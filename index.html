/* ---------- máquinas ---------- */
let maqFicha = null;
const TIPOS = {autopropulsada:'Autopropulsada', arrastrado:'Arrastrado', suspendido:'Suspendido'};
const nuevoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const icoMaq = x => tractor(x.id) ? `<span class="ico t">${I.tractor}</span>` : `<span class="ico a">${I.apero}</span>`;
function horasTrabajo(id){
  const esT = !!tractor(id);
  return todasSesiones().reduce((s,{s:ses})=> s + ses.tramos.reduce((x,t)=>{
    const ap = apero(t.apero);
    const vale = esT ? t.tractor===id : (t.apero===id && (t.modo==='campo' || (ap && ap.tipo==='arrastrado')));
    return x + (vale ? (t.fin-t.inicio)/H : 0);
  },0),0);
}
function opsCuenta(tipo){
  if(tipo==='autopropulsada') return [['siempre','En carretera y en campo'],['campo','Solo en campo'],['alza','Solo en campo con apero suspendido (alza)'],['arrastrado','En carretera y en campo con apero arrastrado (enganche)'],['carretera','Solo en carretera']];
  if(tipo==='arrastrado') return [['campo','Solo en campo'],['siempre','En campo y en carretera (ruedas)'],['carretera','Solo en carretera (ruedas de transporte)']];
  return [['campo','Solo en campo'],['carretera','Solo en carretera']];
}
const tipoDe = id => tractor(id) ? 'autopropulsada' : apero(id).tipo;

function pintarMaquinas(){
  if(maqFicha) return pintarFicha();
  const fila = x => {
    const ms = S.mants.filter(m=>m.maq===x.id);
    const r = ms.filter(m=>estadoMant(m)==='r').length, y = ms.filter(m=>estadoMant(m)==='y').length;
    const sub = tractor(x.id) ? `Horómetro ${fmtH(x.horometro)} h` : `${TIPOS[x.tipo]}, ${fmtH(horasTrabajo(x.id))} h de trabajo`;
    return `<button class="maq" data-id="${x.id}">${icoMaq(x)}<span><span class="n">${x.nombre}</span><br><span class="s">${sub}</span></span><span class="cnt">${r?`<span class="dot r"></span>${r}`:''}${y?` <span class="dot y"></span>${y}`:''}</span></button>`;
  };
  $('#vista').innerHTML = `<button class="chip" id="nueva" style="width:100%">Añadir máquina o apero</button>
    <h2 class="secc">Tractores y autopropulsadas</h2><section class="maquinas">${S.tractores.map(fila).join('')}</section>
    <h2 class="secc">Aperos</h2><section class="maquinas">${S.aperos.length?S.aperos.map(fila).join(''):'<div class="vacio" style="padding:14px">Todavía no hay aperos.</div>'}</section>`;
  $('#nueva').onclick=()=>asistente();
  document.querySelectorAll('.maquinas .maq').forEach(b=>b.onclick=()=>{ maqFicha=b.dataset.id; history.pushState({s:'maquinas'},''); pintar(); });
}

function pintarFicha(){
  const id = maqFicha, esT = !!tractor(id), x = tractor(id) || apero(id);
  if(!x){ maqFicha=null; return pintarMaquinas(); }
  let datos;
  if(esT){
    const lect = S.lecturas.filter(l=>l.tractor===id).sort((a,b)=>b.fecha-a.fecha)[0];
    const sinReg = (x.horometro - x.horometroAlta) - horasTrabajo(id);
    datos = `<dt>Tipo</dt><dd>Autopropulsada</dd>
      <dt>Horómetro</dt><dd>${fmtH(x.horometro)} h<br><span class="s" style="color:var(--text2);font-size:13px">${lect?'Última lectura '+fecha(lect.fecha):'Sin lecturas desde el alta'}</span></dd>
      <dt>Trabajo registrado</dt><dd>${fmtH(horasTrabajo(id))} h</dd>
      <dt>Depósito de gasoil</dt><dd>${x.capDeposito?fmtH(x.capDeposito)+' L':'Sin poner'}</dd>
      <dt>Sin registrar</dt><dd>${sinReg>=0 ? `${fmtH(sinReg)} h<br><span style="color:var(--text2);font-size:13px">Ralentí, maniobras o sesiones sin apuntar</span>` : `${fmtH(-sinReg)} h de más<br><span style="color:var(--text2);font-size:13px">Has registrado más horas de las que ha subido el horómetro: actualízalo</span>`}</dd>`;
  } else {
    datos = `<dt>Tipo</dt><dd>${TIPOS[x.tipo]}</dd>
      <dt>Trabajo</dt><dd>${fmtH(horasTrabajo(id))} h</dd>
      <dt>Última vez</dt><dd>${textoUltimaApero(id)}</dd>
      <dt>Compatible con</dt><dd>${x.compatTodos ? 'Todos los tractores' : (x.compat||[]).map(t=>tractor(t)?.nombre).filter(Boolean).join(', ')}</dd>`;
  }
  const ms = S.mants.filter(m=>m.maq===id).map(info).sort(porUrgencia);
  const faltanPlantilla = esT ? PLANTILLA.mants.filter(p=>!S.mants.some(m=>m.maq===id && m.nombre===p.nombre)).length : 0;
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="vb" aria-label="Volver a Máquinas">${FL.izq}</button><h2>${x.nombre}</h2><button class="flecha" id="ren" aria-label="Cambiar nombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
    <section class="dep"><dl class="det" style="margin:0">${datos}</dl></section>
    <h2 class="secc">Mantenimientos (${ms.length})</h2>
    <div class="lista">${ms.length ? ms.map(({m,e})=>`<button class="mov" data-m="${m.id}" style="align-items:center"><span class="dot ${e||'n'}"></span>${marcaM(m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}<span class="fx"><span class="n">${m.nombre}${m.quien==='taller'?'<span class="tag">Taller</span>':''}</span><span class="s" style="font-size:13px;color:var(--text2)">${cadaTexto(m)}${m.intervalo?(m.reloj==='motor'?', por horómetro':', por horas de trabajo'):''}${m.manualH?`. Manual: ${textoManual(m)}`:''}</span></span><span class="der">${textoMant(m)}</span></button>`).join('') : '<div class="vacio" style="padding:14px">Sin mantenimientos todavía.</div>'}</div>
    ${esT ? '' : `<h2 class="secc">Hectáreas por hora</h2><div class="lista">${ritmosApero(id).map(r=>filaRitmo(nombreCampo(r.campo), r)).join('') || '<div class="vacio" style="padding:14px">Todavía no has trabajado ningún campo con este apero.</div>'}</div>`}
    <div class="acc3"><button class="chip" id="am">Añadir mantenimiento</button><button class="chip" id="dup">Duplicar</button>${esT?`<button class="chip" id="rut">Rutina diaria (${(x.rutina||[]).length})</button><button class="chip" id="cap">Depósito de gasoil</button>`:''}${esT&&faltanPlantilla?`<button class="chip" id="pla">Cargar plantilla ${PLANTILLA.corto}</button>`:''}</div>`;
  $('#vb').onclick=()=>history.back();
  $('#ren').onclick=()=>hojaRenombrar(id);
  $('#am').onclick=()=>hojaNuevoMant(id);
  $('#dup').onclick=()=>asistente({paso:1, nombre:x.nombre+' (copia)', tipo:tipoDe(id), estado:'nueva', horometro:'', rutina:[...(x.rutina||[])], mants:S.mants.filter(m=>m.maq===id).map(m=>({nombre:m.nombre, intervalo:m.intervalo, meses:m.meses, quien:m.quien, nota:m.nota, detalles:m.detalles, manualH:m.manualH, reloj:m.reloj, cuenta:m.cuenta||'campo', ultimo:null}))});
  if($('#rut')) $('#rut').onclick=()=>hojaRutina(id);
  if($('#cap')) $('#cap').onclick=()=>hojaCapacidad(id);
  if($('#pla')) $('#pla').onclick=()=>hojaCargarPlantilla(id);
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>hojaDetalle(b.dataset.m));
}

function hojaCapacidad(id){
  const t = tractor(id);
  abrirHoja(`<h3>Depósito de gasoil del ${esc(t.nombre)}</h3><p>Los litros que caben, según el manual. Sirve para el botón "Lo he llenado" al repostar del depósito de la bajera.</p>
    <label class="f" for="cp">Capacidad (litros)</label>${campoNumero('cp', t.capDeposito||undefined, 'step="1"')}
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const v = leerNum('cp');
        if(v!=null && !(v>0)){ $('#err').textContent='La capacidad debe ser más de 0, o déjala vacía.'; return; }
        t.capDeposito = v; guardar(); cerrarHoja(); pintar(); toast(v?'Capacidad guardada':'Capacidad quitada');
      };
  });
}

function hojaRenombrar(id){
  const x = tractor(id) || apero(id);
  abrirHoja(`<h3>Cambiar nombre</h3><label class="f" for="nm">Nombre</label><input id="nm" value="${x.nombre.replace(/"/g,'&quot;')}"><div class="err" id="err"></div><div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
    $('#no').onclick=()=>cerrarHoja();
    $('#si').onclick=()=>{ const v=$('#nm').value.trim(); if(!v){ $('#err').textContent='Escribe un nombre.'; return; } x.nombre=v; guardar(); cerrarHoja(); pintar(); toast('Nombre cambiado'); };
  });
}

function segQuien(v){ return `<label class="f">Quién lo hace</label><div class="seg" id="mq"><button data-v="yo" class="${v!=='taller'?'sel':''}">Yo</button><button data-v="taller" class="${v==='taller'?'sel':''}">Taller</button></div>`; }
function enlazarSeg(sel){ const c=$(sel); if(!c) return; c.querySelectorAll('button').forEach(b=>b.onclick=()=>c.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))); }
const valSeg = sel => $(sel) ? $(sel).querySelector('.sel').dataset.v : null;
function leerMeses(){
  const v = leerNum('mm');
  if(v==null) return {v:null};
  if(!(v>=1) || !Number.isInteger(v)) return {error:'Los meses deben ser un número entero, 1 o más.'};
  return {v};
}

function formMant(tipo, estado, horometro){
  const conReloj = tipo==='autopropulsada';
  return `<label class="f" for="mn">Nombre</label><input id="mn" placeholder="Engrasar rótulas del eje">
    <label class="f" for="mi">Cada cuántas horas</label>${campoNumero('mi')}
    <label class="f" for="mm">O cada cuántos meses (opcional)</label><input id="mm" type="number" inputmode="numeric" min="1" step="1" placeholder="Sin límite por tiempo">
    <p class="nota" style="margin-top:2px">Avisa por lo primero que llegue. Deja las horas vacías si solo va por tiempo.</p>
    ${segQuien('yo')}
    ${conReloj?`<label class="f">Cuenta por</label><div class="seg" id="mr"><button data-v="trabajo" class="sel">Horas de trabajo</button><button data-v="motor">Horómetro</button></div>`:''}
    <div id="mcw"><label class="f" for="mc">Cuándo cuentan las horas</label><select id="mc">${opsCuenta(tipo).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>
      ${conReloj?`<label class="f" for="mh">Según el manual, cada (h de horómetro)</label>${campoNumero('mh')}<p class="nota" style="margin-top:2px">Opcional. Si el horómetro llega antes, te avisa con una M.</p>`:''}</div>
    <label class="f" for="mo">Referencia del manual (opcional)</label><input id="mo" placeholder="Case IH: cada 600 h (pág. 7-43)">
    <label class="f" for="md">Detalles (opcional)</label><textarea id="md" rows="3" placeholder="Cantidades, pasos o lo que quieras leer al hacerlo"></textarea>
    ${estado==='usada'?`<label class="f" for="mu" id="mul">Horas de trabajo desde la última vez</label>${campoNumero('mu',0)}
      <label class="f" for="mf">Fecha de la última vez</label><input id="mf" type="date" value="${hoyISO()}" max="${hoyISO()}"><p class="nota" style="margin-top:2px">Si no la sabes, deja hoy.</p>`:''}`;
}
function leerFormMant(tipo, estado, horometro){
  const rel = $('#mr') ? valSeg('#mr') : 'trabajo';
  const n=$('#mn').value.trim(), iv=leerNum('mi'), me=leerMeses();
  if(!n) return {error:'Escribe el nombre del mantenimiento.'};
  if(me.error) return {error:me.error};
  if(iv==null && me.v==null) return {error:'Indica cada cuántas horas o cada cuántos meses toca.'};
  if(iv!=null && !(iv>0)) return {error:'Las horas deben ser más de 0.'};
  const mh = (rel==='trabajo' && $('#mh')) ? leerNum('mh') : null;
  if(mh!=null && !(mh>0)) return {error:'Las horas del manual deben ser más de 0.'};
  let ultimo = null, fecha = Date.now();
  if(estado==='usada'){
    ultimo = leerNum('mu');
    if(iv!=null){
      if(ultimo==null||ultimo<0) return {error: rel==='motor'?'Indica el horómetro de la última vez.':'Indica las horas desde la última vez (0 si se acaba de hacer).'};
      if(rel==='motor' && horometro!=null && ultimo>horometro) return {error:'No puede ser mayor que el horómetro actual.'};
    } else ultimo = rel==='motor' ? horometro : 0;
    fecha = fechaDe($('#mf').value);
    if(fecha > Date.now()+60000) return {error:'La fecha de la última vez no puede ser futura.'};
  }
  return {nombre:n, intervalo:iv, meses:me.v, quien:valSeg('#mq'), nota:$('#mo').value.trim(), detalles:$('#md').value.trim(), manualH:mh, reloj:rel, cuenta: rel==='motor'?null:$('#mc').value, ultimo, fecha};
}
function enlazarFormMant(estado, horometro){
  enlazarSeg('#mq');
  if(!$('#mr')) return;
  $('#mr').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#mr').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    const motor = b.dataset.v==='motor';
    $('#mcw').style.display = motor ? 'none' : '';
    if(estado==='usada'){ $('#mul').textContent = motor ? 'Horómetro cuando se hizo la última vez' : 'Horas de trabajo desde la última vez'; $('#mu').value = motor ? (horometro??'') : 0; }
  });
}
function crearMant(maqId, d, horometro){
  const m = {id:nuevoId('k'), maq:maqId, nombre:d.nombre, intervalo:d.intervalo||null, meses:d.meses||null, quien:d.quien||'yo', nota:d.nota||'', detalles:d.detalles||'', reloj:d.reloj, fecha:d.fecha||Date.now()};
  if(d.reloj==='motor') m.ultima = d.ultimo!=null ? d.ultimo : horometro;
  else {
    m.cuenta=d.cuenta; m.acum = d.ultimo!=null ? d.ultimo : 0; m.desde = Date.now();
    const t = tractor(maqId);
    if(t && d.manualH){ m.manualH = d.manualH; m.ultimaHoro = Math.max(0, t.horometro - m.acum); }
  }
  S.mants.push(m);
  return m;
}

function hojaNuevoMant(maqId){
  const tipo = tipoDe(maqId), t = tractor(maqId);
  abrirHoja(`<h3>Nuevo mantenimiento</h3><p>${(t||apero(maqId)).nombre}. Indica cuándo se hizo por última vez para que el aviso salga cuadrado.</p>${formMant(tipo,'usada',t?t.horometro:null)}<div class="err" id="err"></div><div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Añadir</button></div>`,()=>{
    enlazarCamaras(); enlazarFormMant('usada', t?t.horometro:null);
    $('#no').onclick=()=>cerrarHoja();
    $('#si').onclick=()=>{ const d=leerFormMant(tipo,'usada',t?t.horometro:null); if(d.error){ $('#err').textContent=d.error; return; } crearMant(maqId,d,t?t.horometro:null); guardar(); cerrarHoja(); pintar(); toast('Mantenimiento añadido'); };
  });
}

function hojaEditarMant(id){
  const m = S.mants.find(x=>x.id===id), t = tractor(m.maq), trab = m.reloj==='trabajo';
  const acumVis = trab ? Math.round(m.acum*10)/10 : null;
  abrirHoja(`<h3>Editar mantenimiento</h3>
    <label class="f" for="mn">Nombre</label><input id="mn" value="${esc(m.nombre)}">
    <label class="f" for="mi">Cada cuántas horas</label>${campoNumero('mi', m.intervalo??undefined)}
    <label class="f" for="mm">O cada cuántos meses (opcional)</label><input id="mm" type="number" inputmode="numeric" min="1" step="1" placeholder="Sin límite por tiempo" value="${m.meses??''}">
    ${segQuien(m.quien)}
    ${trab ? `<label class="f" for="mc">Cuándo cuentan las horas</label><select id="mc">${opsCuenta(tipoDe(m.maq)).map(([v,x])=>`<option value="${v}" ${v===(m.cuenta||'campo')?'selected':''}>${x}</option>`).join('')}</select><p class="nota" style="margin-top:2px">Si la cambias, lo ya contado se queda y desde ahora cuenta con la nueva.</p>` : ''}
    ${trab && t ? `<label class="f" for="mh">Según el manual, cada (h de horómetro)</label>${campoNumero('mh', m.manualH??undefined)}` : ''}
    <label class="f" for="mo">Referencia del manual (opcional)</label><input id="mo" value="${esc(m.nota)}">
    <label class="f" for="md">Detalles (opcional)</label><textarea id="md" rows="4">${esc(m.detalles)}</textarea>
    <hr class="sep"><p class="peq">Última vez que se hizo</p>
    <label class="f" for="mu">${trab ? 'Horas de trabajo desde entonces' : 'Horómetro cuando se hizo'}</label>${campoNumero('mu', trab ? acumVis : (m.ultima??undefined))}
    <label class="f" for="mf">Fecha</label><input id="mf" type="date" value="${isoDe(m.fecha||Date.now())}" max="${hoyISO()}">
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div><div class="acciones"><button class="peligro" id="del">Borrar mantenimiento</button></div>`,()=>{
    enlazarCamaras(); enlazarSeg('#mq');
    $('#no').onclick=()=>cerrarHoja();
    $('#si').onclick=()=>{
      const n=$('#mn').value.trim(), iv=leerNum('mi'), me=leerMeses(), u=leerNum('mu'), mh=$('#mh')?leerNum('mh'):null;
      const err = t=>{ $('#err').textContent=t; };
      if(!n) return err('Escribe un nombre.');
      if(me.error) return err(me.error);
      if(iv==null && me.v==null) return err('Indica cada cuántas horas o cada cuántos meses toca.');
      if(iv!=null && !(iv>0)) return err('Las horas deben ser más de 0.');
      if(mh!=null && !(mh>0)) return err('Las horas del manual deben ser más de 0.');
      if(u!=null && u<0) return err('La última vez no puede ser negativa.');
      if(!trab && t && u!=null && u>t.horometro) return err(`No puede ser mayor que el horómetro actual (${fmtH(t.horometro)} h).`);
      const f = fechaDe($('#mf').value);
      if(f > Date.now()+60000) return err('La fecha no puede ser futura.');
      const q=valSeg('#mq'), mo=$('#mo').value.trim(), md=$('#md').value.trim(), nc=$('#mc')?$('#mc').value:null;
      const aplicar = ()=>{
      m.nombre=n; m.intervalo=iv; m.meses=me.v; m.quien=q; m.nota=mo; m.detalles=md; m.fecha=f;
      if(trab && nc && nc!==(m.cuenta||'campo')){
        /* lo que llevaba el tramo abierto se cuenta con la regla vieja; desde ahora, con la nueva */
        const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1];
        if(tr && !tr.fin && cuentaEnTramo(m,tr)) m.acum += Math.max(0,(Date.now()-Math.max(tr.inicio, m.desde||0))/H);
        m.desde = Date.now(); m.cuenta = nc;
      }
      if(trab){
        if(u!=null && Math.abs(u-acumVis)>0.05){ m.acum=u; m.desde=Date.now(); if(t) m.ultimaHoro=Math.max(0,t.horometro-u); }
        if(t){ m.manualH = mh||null; if(m.manualH && m.ultimaHoro==null) m.ultimaHoro=Math.max(0,t.horometro-m.acum); }
      } else if(u!=null) m.ultima=u;
      else if(m.ultima==null && t) m.ultima=t.horometro;
      guardar(); cerrarHoja(); pintar(); toast('Mantenimiento actualizado');
      };
      if(trab && nc && nc!==(m.cuenta||'campo')){
        const ops = Object.fromEntries(opsCuenta(tipoDe(m.maq)));
        abrirHoja(`<h3>¿Cambiar cuándo cuentan las horas?</h3><p>${esc(m.nombre)}: de «${esc(ops[m.cuenta||'campo']||m.cuenta)}» a «${esc(ops[nc])}». Lo ya contado se queda; desde ahora cuenta con la nueva.</p><div class="acciones"><button id="no3">Cancelar</button><button class="ok" id="si3">Cambiar</button></div>`,()=>{
          $('#no3').onclick=()=>cerrarHoja(); $('#si3').onclick=aplicar; });
      } else aplicar();
    };
    $('#del').onclick=()=>abrirHoja(`<h3>¿Borrar ${esc(m.nombre)}?</h3><p>Deja de contar y desaparece de los avisos. El historial de veces que se hizo se conserva.</p><div class="acciones"><button id="no2">Cancelar</button><button class="peligro" id="si2">Borrar</button></div>`,()=>{
      $('#no2').onclick=()=>cerrarHoja();
      $('#si2').onclick=()=>{ S.mants=S.mants.filter(x=>x.id!==id); guardar(); cerrarHoja(); pintar(); toast('Mantenimiento borrado'); };
    });
  });
}

function asistente(base){
  const w = base || {paso:1, nombre:'', tipo:'autopropulsada', estado:'nueva', horometro:'', mants:[]};
  const total = () => w.tipo==='autopropulsada' ? 3 : 4;
  const cab = t => `<p class="wz">Paso ${w.paso} de ${total()}</p><h3>${t}</h3>`;
  const pie = (sig) => `<div class="err" id="err"></div><div class="acciones"><button id="atr">${w.paso===1?'Cancelar':'Atrás'}</button><button class="ok" id="sig">${sig}</button></div>`;
  const atras = () => { if(w.paso===1) cerrarHoja(); else { w.paso--; asistente(w); } };
  const horo = () => w.tipo==='autopropulsada' ? parseFloat(w.horometro) : null;
  if(w.paso===1){
    abrirHoja(`${cab('Nueva máquina')}<label class="f" for="nm">Nombre</label><input id="nm" placeholder="Puma 240" value="${w.nombre.replace(/"/g,'&quot;')}">
      <label class="f">Tipo</label><div class="seg" id="tp">${Object.entries(TIPOS).map(([v,t])=>`<button data-v="${v}" class="${w.tipo===v?'sel':''}">${t}</button>`).join('')}</div>
      <p class="nota">Autopropulsada: tractores, cosechadora. Arrastrado: va sobre sus ruedas. Suspendido: va colgado del alza.</p>${pie('Siguiente')}`,()=>{
        $('#tp').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(w.tipo!==b.dataset.v){ w.tipo=b.dataset.v; w.mants=[]; } w.nombre=$('#nm').value; asistente(w); });
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{ w.nombre=$('#nm').value.trim(); if(!w.nombre){ $('#err').textContent='Escribe un nombre.'; return; } w.paso=2; asistente(w); };
    });
  } else if(w.paso===2){
    abrirHoja(`${cab('¿Nueva o usada?')}<div class="seg" id="es"><button data-v="nueva" class="${w.estado==='nueva'?'sel':''}">Nueva</button><button data-v="usada" class="${w.estado==='usada'?'sel':''}">Usada</button></div>
      <p class="nota">${w.estado==='nueva'?'Los mantenimientos empiezan desde cero.':'En el siguiente paso indicarás cuándo se hizo cada mantenimiento por última vez.'}</p>
      ${w.tipo==='autopropulsada'?`<label class="f" for="ho">Horas del horómetro ahora</label>${campoNumero('ho', w.horometro===''?undefined:w.horometro)}<p class="nota">Aunque sea nueva, puede traer algunas horas.</p>`:'<p class="nota">Los aperos no tienen horómetro: sus horas las cuenta la app con las sesiones.</p>'}${pie('Siguiente')}`,()=>{
        enlazarCamaras();
        $('#es').querySelectorAll('button').forEach(b=>b.onclick=()=>{ w.estado=b.dataset.v; if($('#ho')) w.horometro=$('#ho').value; asistente(w); });
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{
          if(w.tipo==='autopropulsada'){ w.horometro=$('#ho').value; const h=parseFloat(w.horometro); if(isNaN(h)||h<0){ $('#err').textContent='Indica las horas del horómetro.'; return; } }
          w.paso=3; asistente(w);
        };
    });
  } else if(w.paso===3){
    const lista = w.mants.map((m,k)=>`<div class="mitem"><span>${esc(m.nombre)}<span class="s">${cadaTexto(m)}${m.intervalo?(m.reloj==='motor'?', horómetro':', horas de trabajo'):''}${m.quien==='taller'?', taller':''}${w.estado==='usada'&&m.intervalo&&m.ultimo!=null&&!m.plantilla?(m.reloj==='motor'?`, última a las ${fmtH(m.ultimo)} h`:`, hace ${fmtH(m.ultimo)} h`):''}${w.estado==='usada'&&m.ultimo==null?', falta la última vez':''}</span></span><button data-k="${k}" aria-label="Quitar ${esc(m.nombre)}">×</button></div>`).join('');
    const hayPlantilla = w.mants.some(m=>m.plantilla);
    abrirHoja(`${cab('Mantenimientos')}<p>Añade los que quieras ahora; más adelante puedes añadir otros desde la ficha.</p>
      ${w.tipo==='autopropulsada' && !hayPlantilla ? `<button class="chip" id="pl" style="width:100%;margin-bottom:10px">Cargar plantilla ${PLANTILLA.nombre}</button>` : ''}
      ${hayPlantilla && w.estado==='usada' ? `<p class="nota">Los de la plantilla empiezan a contar desde hoy. Después, en la ficha, corrige la última vez de cada uno con Editar.</p>` : ''}
      ${lista?`<div>${lista}</div>`:''}
      <div class="caja">${formMant(w.tipo, w.estado, horo())}<div class="err" id="err2"></div><div class="acciones"><button id="add">Añadir a la lista</button></div></div>
      ${pie(total()===3?'Guardar máquina':'Siguiente')}`,()=>{
        enlazarCamaras(); enlazarFormMant(w.estado, horo());
        document.querySelectorAll('.mitem button').forEach(b=>b.onclick=()=>{ w.mants.splice(+b.dataset.k,1); asistente(w); });
        if($('#pl')) $('#pl').onclick=()=>{
          PLANTILLA.mants.forEach(p=>{ if(!w.mants.some(m=>m.nombre===p.nombre)) w.mants.push({...p, plantilla:true, ultimo: w.estado==='usada' ? (p.reloj==='motor' ? horo() : 0) : null, fecha:Date.now()}); });
          w.rutina = [...PLANTILLA.rutina]; asistente(w);
        };
        $('#add').onclick=()=>{ const d=leerFormMant(w.tipo, w.estado, horo()); if(d.error){ $('#err2').textContent=d.error; return; } w.mants.push(d); asistente(w); };
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{
          if(w.estado==='usada' && w.mants.some(m=>m.ultimo==null)){ $('#err').textContent='Falta indicar la última vez de algún mantenimiento: quítalo y vuelve a añadirlo.'; return; }
          if(total()===3) finalizar(); else { w.paso=4; asistente(w); }
        };
    });
  } else {
    abrirHoja(`${cab('Compatibilidad')}<p>Con qué tractores se puede usar este apero.</p><div class="seg"><button class="sel">Todos los tractores</button></div><p class="nota">Elegir tractores concretos llegará en una versión siguiente.</p>${pie('Guardar apero')}`,()=>{
      $('#atr').onclick=atras;
      $('#sig').onclick=finalizar;
    });
  }
  function finalizar(){
    const id = nuevoId(w.tipo==='autopropulsada'?'t':'a');
    if(w.tipo==='autopropulsada'){ const h=parseFloat(w.horometro); S.tractores.push({id, nombre:w.nombre, horometro:h, horometroAlta:h, fechaAlta:Date.now(), rutina:w.rutina||[]}); if(!S.sel.tractor) S.sel.tractor=id; }
    else { S.aperos.push({id, nombre:w.nombre, tipo:w.tipo, compatTodos:true, compat:[]}); if(!S.sel.apero) S.sel.apero=id; }
    w.mants.forEach(d=>crearMant(id, w.estado==='usada'?d:{...d, ultimo:null}, horo()));
    guardar(); cerrarHoja(); toast(`${w.nombre} añadido`);
    setTimeout(()=>{ seccion='maquinas'; maqFicha=id; history.pushState({s:'maquinas'},''); pintar(); }, 80);
  }
}

/* ---------- días pasados ---------- */
const FL = {
  izq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  der:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
let diasModo='cal', calMes=null, diaSel=null;
const inicioDia = ms => { const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const sumarDias = (ms,n) => { const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); };
const hora = ms => new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const nombreApero = id => { const a=apero(id); return a ? a.nombre : 'Sin apero'; };
const nombreModo = m => m==='campo' ? 'Campo' : m==='nose' ? 'Sin saber (igualado)' : 'Carretera';
function todasSesiones(){
  const l = S.sesiones.map((s,i)=>({s,i}));
  if(S.sesion){ const tr=S.sesion.tramos.map(t=>({...t, fin:t.fin||Date.now()})); l.push({s:{...S.sesion, tramos:tr, fin:Date.now()}, i:-1}); }
  return l;
}
function diasTrabajados(){
  const set = new Set();
  todasSesiones().forEach(({s})=>{ for(let d=inicioDia(s.inicio); d<s.fin; d=sumarDias(d,1)) set.add(d); });
  return set;
}

function pintarDias(){
  if(diasModo==='dia') return pintarDia();
  if(calMes==null){ const d=new Date(); calMes=new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  const m = new Date(calMes), anio=m.getFullYear(), mes=m.getMonth();
  const primero = (new Date(anio,mes,1).getDay()+6)%7, nd = new Date(anio,mes+1,0).getDate();
  const trab = diasTrabajados(), hoy = inicioDia(Date.now());
  let celdas = ['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<primero;i++) celdas += '<div></div>';
  for(let d=1; d<=nd; d++){
    const ms = new Date(anio,mes,d).getTime(), con = trab.has(ms);
    celdas += `<button data-d="${ms}" class="${con?'con':''} ${ms===hoy?'hoy':''}" aria-label="${d}${con?', con trabajo':''}">${d}${con?'<span class="pt"></span>':''}</button>`;
  }
  const titulo = m.toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="pm" aria-label="Mes anterior">${FL.izq}</button><h2>${titulo}</h2><button class="flecha" id="sm" aria-label="Mes siguiente">${FL.der}</button></div><div class="cal">${celdas}</div><p class="pista">Toca un día para verlo en formato agenda.</p>`;
  $('#pm').onclick=()=>{ const x=new Date(calMes); x.setMonth(x.getMonth()-1); calMes=x.getTime(); pintarDias(); };
  $('#sm').onclick=()=>{ const x=new Date(calMes); x.setMonth(x.getMonth()+1); calMes=x.getTime(); pintarDias(); };
  document.querySelectorAll('.cal button').forEach(b=>b.onclick=()=>{ diaSel=+b.dataset.d; diasModo='dia'; history.pushState({s:'dias'},''); pintarDias(); });
}

function pintarDia(){
  const d0=diaSel, d1=sumarDias(d0,1), PX=56;
  const bloques=[];
  todasSesiones().forEach(({s,i})=>{
    s.tramos.forEach(t=>{
      const a=Math.max(t.inicio,d0), b=Math.min(t.fin,d1);
      if(b>a) bloques.push({a,b,t,i,partida: t.inicio<d0 || t.fin>d1});
    });
  });
  const titulo = new Date(d0).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
  let cuerpo;
  if(!bloques.length){ cuerpo = '<div class="lista"><div class="vacio" style="padding:16px">Este día no hay sesiones.</div></div>'; }
  else {
    const hIni = Math.max(0, Math.floor((Math.min(...bloques.map(x=>x.a))-d0)/H)-1);
    const hFin = Math.min(24, Math.ceil((Math.max(...bloques.map(x=>x.b))-d0)/H)+1);
    let html = '';
    for(let h=hIni; h<=hFin; h++) html += `<div class="hl" style="top:${(h-hIni)*PX}px">${String(h).padStart(2,'0')}:00</div>`;
    bloques.forEach(x=>{
      const top=((x.a-d0)/H-hIni)*PX, alto=Math.max(24,(x.b-x.a)/H*PX-2);
      const txt=`${nombreModo(x.t.modo)}, ${nombreApero(x.t.apero)}<br>${hora(x.a)} a ${x.i===-1&&x.t.fin>=Date.now()-1000?'ahora':hora(x.b)} (${durTxt(x.t.fin-x.t.inicio)})${x.partida?' (sesión partida)':''}`;
      html += `<button class="blk ${x.t.modo} ${x.i===-1?'abierta':''}" data-i="${x.i}" style="top:${top+1}px;height:${alto}px">${txt}</button>`;
    });
    cuerpo = `${resumenDia(bloques)}<div class="agenda" style="height:${(hFin-hIni)*PX+8}px">${html}</div>`;
  }
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="pd" aria-label="Día anterior">${FL.izq}</button><h2>${titulo}</h2><button class="flecha" id="sd" aria-label="Día siguiente">${FL.der}</button></div>${cuerpo}<p class="pista">Toca un tramo para ver y corregir su sesión. Para volver al calendario, usa atrás.</p>`;
  $('#pd').onclick=()=>{ diaSel=sumarDias(diaSel,-1); pintarDias(); };
  $('#sd').onclick=()=>{ diaSel=sumarDias(diaSel,1); pintarDias(); };
  document.querySelectorAll('.blk').forEach(b=>b.onclick=()=>hojaSesion(+b.dataset.i));
}

function aporte(m, tramos){
  return tramos.reduce((s,t)=> s + (cuentaEnTramo(m,t) ? Math.max(0,(t.fin - Math.max(t.inicio, m.desde||0))/H) : 0), 0);
}

/* 1.4.1.1 (nota 19): horas de la sesión: total trabajado y, aparte, campo, carretera, sin saber y pausas */
const durTxt = ms => { const m=Math.round(ms/60000), h=Math.floor(m/60), r=m%60; return h ? `${h} h${r?` ${r} min`:''}` : `${r} min`; };
function resumenSesion(d){
  const ini=d[0].inicio, fin=d[d.length-1].fin, por={campo:0,carretera:0,nose:0};
  d.forEach(t=>{ const k = por[t.modo]!=null ? t.modo : 'carretera'; por[k]+=Math.max(0,t.fin-t.inicio); });
  const trab = por.campo+por.carretera+por.nose, pausa = Math.max(0, (fin-ini)-trab);
  const partes = [['campo','Campo',por.campo],['carretera','Carretera',por.carretera]];
  if(por.nose) partes.push(['nose','Sin saber',por.nose]);
  partes.push(['pausa','Pausas',pausa]);
  return `<div class="resu" aria-label="Horas de la sesión"><div class="tot"><span class="v">${durTxt(trab)}</span><br><span class="k">Total trabajado</span></div><div class="partes" style="grid-template-columns:repeat(${partes.length},1fr)">${partes.map(([c,k,v])=>`<div class="${c}"><span class="v">${durTxt(v)}</span><br><span class="k">${k}</span></div>`).join('')}</div></div>`;
}
function hojaSesion(i, borrador){
  if(i===-1){
    const sa = todasSesiones().find(x=>x.i===-1);
    abrirHoja(`<h3>Sesión en curso</h3>${sa?resumenSesion(sa.s.tramos):''}<p>Esta sesión sigue abierta. Podrás ajustarla al pararla o, después, desde aquí.</p><div class="acciones"><button id="no">Cerrar</button></div>`,()=>$('#no').onclick=()=>cerrarHoja());
    return;
  }
  const ses = S.sesiones[i];
  const d = borrador || ses.tramos.map(t=>({...t}));
  const cambiado = JSON.stringify(d)!==JSON.stringify(ses.tramos);
  const ini=d[0].inicio, fin=d[d.length-1].fin, total=d.reduce((s,t)=>s+(t.fin-t.inicio),0)/H;
  const cruza = inicioDia(ini)!==inicioDia(fin-1);
  const lista = d.map((t,j)=>`<button class="tramo" data-j="${j}"><span class="bar ${t.modo}"></span><span>${nombreModo(t.modo)}<br><span class="s" style="font-size:13px;color:var(--text2)">${nombreApero(t.apero)}${t.modo==='campo'?', '+esc(sitioTramo(t)):rutaTramo(d,j,ses)?', '+esc(rutaTramo(d,j,ses)):''}</span></span><span class="der">${hora(t.inicio)} a ${hora(t.fin)}<br><span class="dur">${durTxt(t.fin-t.inicio)}</span></span></button>`).join('');
  abrirHoja(`<h3>Sesión de ${hora(ini)} a ${hora(fin)}</h3>
    ${resumenSesion(d)}
    <p>${tractor(ses.tractor).nombre}.${cruza?' Cruza la medianoche: se ve en los dos días.':''}${cambiado?' Tienes cambios sin guardar.':''}</p>
    <div class="tramos">${lista}</div>
    <p class="nota">Toca un tramo para cambiar sus horas, su modo o su apero, o para meter un cambio de apero a una hora.</p>
    <div class="acciones"><button id="no">${cambiado?'Descartar':'Cerrar'}</button><button class="ok" id="si" ${cambiado?'':'style="display:none"'}>Revisar y guardar</button></div>
    <div class="acciones"><button class="peligro" id="del">Borrar sesión</button></div>`,()=>{
      document.querySelectorAll('.tramo').forEach(b=>b.onclick=()=>hojaTramo(i, d, +b.dataset.j));
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>hojaPrevia(i, d);
      $('#del').onclick=()=>hojaPrevia(i, [], true);
  });
}

function hojaTramo(i, d, j){
  const t = d[j], ses = S.sesiones[i];
  const aps = S.aperos.filter(a=>esCompat(a, ses.tractor));
  const opsAp = sel => `<option value="" ${!sel?'selected':''}>Sin apero</option>` + aps.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.nombre}</option>`).join('');
  abrirHoja(`<h3>Tramo ${j+1} de ${d.length}</h3>
    <div class="seg" id="md"><button data-v="carretera" class="${t.modo==='carretera'?'sel':''}">Carretera</button><button data-v="campo" class="${t.modo==='campo'?'sel':''}">Campo</button></div>
    <label class="f" for="ti">Empieza</label><input type="datetime-local" id="ti" value="${aLocal(t.inicio)}">
    <label class="f" for="tf">Termina</label><input type="datetime-local" id="tf" value="${aLocal(t.fin)}">
    <label class="f" for="ta">Apero</label><select id="ta">${opsAp(t.apero)}</select>
    <div id="cmpw" ${t.modo==='campo'?'':'style="display:none"'}><label class="f" for="tc">Campo</label><select id="tc"><option value="">Sin identificar</option>${S.campos.map(c=>`<option value="${c.id}" ${c.id===t.campo?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <p class="nota posic">${t.modo==='carretera' ? `Desde: ${filaPos(origenTramo(d,j,ses), t.posIni)}<br>Hasta: ${filaPos(destinoTramo(d,j), t.posFin)}` : `Desde: ${textoPos(t.posIni)}<br>Hasta: ${textoPos(t.posFin)}`}</p>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Volver</button><button class="ok" id="si">Aplicar</button></div>
    <hr class="sep"><p class="peq">Cambio de apero dentro de este tramo</p>
    <p class="nota" style="margin-top:0">Si a mitad del tramo cambiaste de apero y no lo marcaste.</p>
    <label class="f" for="dh">A qué hora</label><input type="datetime-local" id="dh" value="${aLocal(t.inicio+(t.fin-t.inicio)/2)}">
    <label class="f" for="da">Nuevo apero</label><select id="da">${opsAp(t.apero ? null : aps[0]?.id)}</select>
    <div class="err" id="err2"></div>
    <div class="acciones"><button id="div">Meter cambio de apero</button></div>`,()=>{
      let modo=t.modo;
      $('#md').querySelectorAll('button').forEach(b=>b.onclick=()=>{ modo=b.dataset.v; $('#md').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b)); $('#cmpw').style.display = modo==='campo' ? '' : 'none'; });
      $('#no').onclick=()=>hojaSesion(i, d);
      $('#si').onclick=()=>{
        const ni = $('#ti').value===aLocal(t.inicio) ? t.inicio : new Date($('#ti').value).getTime(), nf = $('#tf').value===aLocal(t.fin) ? t.fin : new Date($('#tf').value).getTime();
        if(isNaN(ni)||isNaN(nf)){ $('#err').textContent='Indica las dos horas.'; return; }
        if(nf<=ni){ $('#err').textContent='El final debe ser posterior al inicio.'; return; }
        if(j>0 && ni<=d[j-1].inicio){ $('#err').textContent=`No puede empezar antes de que empiece el tramo anterior (${hora(d[j-1].inicio)}).`; return; }
        if(j<d.length-1 && nf>=d[j+1].fin){ $('#err').textContent=`No puede terminar después de que termine el tramo siguiente (${hora(d[j+1].fin)}).`; return; }
        if(nf>Date.now()){ $('#err').textContent='No puede terminar en el futuro.'; return; }
        const oi=t.inicio, of=t.fin, oa=t.apero||null, oc=t.campo||null;
        t.inicio=ni; t.fin=nf; t.modo=modo; t.apero=$('#ta').value||null;
        if(modo==='campo'){ const nc=$('#tc').value||null; if(nc!==oc || t.apero!==oa || (nc && t.apero && !t.trabajo)) asignarCampo(t, nc, ses.inicio, true); }
        /* si había una pausa entre tramos, se respeta; solo se mueve el vecino si iba pegado o si se pisan */
        if(j>0 && (d[j-1].fin===oi || d[j-1].fin>ni)) d[j-1].fin=ni;
        if(j<d.length-1 && (d[j+1].inicio===of || d[j+1].inicio<nf)) d[j+1].inicio=nf;
        hojaSesion(i, d);
      };
      $('#div').onclick=()=>{
        const h=new Date($('#dh').value).getTime(), na=$('#da').value||null;
        if(isNaN(h)){ $('#err2').textContent='Indica la hora del cambio.'; return; }
        if(h<=t.inicio || h>=t.fin){ $('#err2').textContent=`La hora debe estar entre ${hora(t.inicio)} y ${hora(t.fin)}.`; return; }
        if(na===t.apero){ $('#err2').textContent='Elige un apero distinto del que ya lleva el tramo.'; return; }
        const nt = {...t, inicio:h, apero:na, posIni:null}; delete nt.trabajo; t.fin=h; t.posFin=null;
        if(nt.modo==='campo') asignarCampo(nt, t.campo||null, ses.inicio, true);
        d.splice(j+1,0,nt);
        hojaSesion(i, d);
      };
  });
}

function hojaPrevia(i, d, borrar){
  const ses = S.sesiones[i];
  const cambios = S.mants.map(m=>{
    const delta = aporte(m,d) - aporte(m,ses.tramos);
    return {m, delta, antes:horasRestantes(m), despues:horasRestantes(m)-delta};
  }).filter(x=>Math.abs(x.delta)>0.001);
  const est = (r,m) => r<0 ? 'pasado' : r<umbralDe(m) ? 'inminente' : 'al día';
  const lista = cambios.length ? cambios.map(x=>`<div class="cambio"><span>${x.m.nombre}<br><span class="s">${nombreMaq(x.m.maq)}</span></span><span style="text-align:right">${textoRestante(x.antes)}<br><span class="s">pasa a ${textoRestante(x.despues)}${est(x.antes,x.m)!==est(x.despues,x.m)?', '+est(x.despues,x.m):''}</span></span></div>`).join('') : '<p>No cambia ningún mantenimiento.</p>';
  abrirHoja(`<h3>${borrar?'¿Borrar esta sesión?':'Revisa los cambios'}</h3><p>${borrar?'Se quitan sus horas de los mantenimientos que aún no se han hecho desde entonces.':'Así quedan los mantenimientos afectados. Los hechos después de esta sesión no cambian.'}</p>${lista}
    <div class="acciones"><button id="no">Volver</button><button class="${borrar?'peligro':'ok'}" id="si">${borrar?'Borrar':'Guardar'}</button></div>`,()=>{
      $('#no').onclick=()=>hojaSesion(i, borrar?undefined:d);
      $('#si').onclick=()=>{
        cambios.forEach(x=>{ if(x.m.reloj==='trabajo') x.m.acum=Math.max(0,x.m.acum+x.delta); });
        if(!S.cambios) S.cambios=[];
        S.cambios.push({fecha:Date.now(), tipo:borrar?'borrar-sesion':'editar-sesion', sesionInicio:ses.inicio, antes:ses.tramos, despues:d});
        if(borrar) S.sesiones.splice(i,1);
        else { ses.tramos=d; ses.inicio=d[0].inicio; ses.fin=d[d.length-1].fin; }
        guardar(); cerrarHoja(); pintar(); toast(borrar?'Sesión borrada':'Sesión corregida');
      };
  });
}

/* ---------- combustible ---------- */
const eur = n => n==null ? '' : n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const eurL = n => n==null ? '' : n.toLocaleString('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3})+' €/L';
const fecha = ms => new Date(ms).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+', '+new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

function calcDeposito(){
  const D=S.deposito, cap=D.capacidad;
  const evs=[...D.movs.map(m=>({...m})),
    ...S.repostajes.map((r,i)=>({r,i})).filter(x=>x.r.producto==='gasoil'&&x.r.origen==='dep').map(x=>({tipo:'salida',fecha:x.r.fecha,litros:x.r.litros,key:'r'+x.i}))
  ].sort((a,b)=>a.fecha-b.fecha);
  let stock=null, pm=null, pendiente=false, salidas=[], iniciado=false, ultimoAjuste=null, ultimoLleno=null;
  const info={};
  for(const e of evs){
    if(e.tipo==='inicio'){ iniciado=true; pm=e.importe/e.litros; stock=cap; salidas=[]; ultimoLleno=e.fecha; }
    else if(e.tipo==='compra'){
      if(e.litros==null||e.importe==null){ pendiente=true; info[e.id]={pendiente:true}; if(e.lleno&&iniciado){ stock=cap; salidas=[]; ultimoLleno=e.fecha; } continue; }
      if(!iniciado){ info[e.id]={}; continue; }
      const base=Math.max(stock,0); pm=(base*pm+e.importe)/(base+e.litros); stock+=e.litros;
      if(e.lleno){
        const des=cap-stock, suma=salidas.reduce((s,x)=>s+x.litros,0);
        const f = suma>0 ? Math.max(0,(suma-des)/suma) : 1;
        salidas.forEach(x=>{ info[x.key].ajustados=x.litros*f; });
        ultimoAjuste={fecha:e.fecha, litros:des, pct: suma>0 ? Math.abs(des)/suma*100 : 0};
        info[e.id]={desajuste:des}; stock=cap; salidas=[]; ultimoLleno=e.fecha;
      } else info[e.id]={};
    }
    else if(e.tipo==='salida'||e.tipo==='otro'){
      const key = e.tipo==='salida' ? e.key : e.id;
      info[key]={coste: pm!=null ? e.litros*pm : null, provisional:pendiente};
      if(iniciado){ stock-=e.litros; salidas.push({key,litros:e.litros}); }
    }
  }
  return {iniciado, stock, pm, pendiente, info, ultimoAjuste, ultimoLleno, cap};
}

function pintarComb(){
  const C = calcDeposito();
  const items = [
    ...S.repostajes.map((r,i)=>({fecha:r.fecha, k:'r'+i, r})),
    ...S.deposito.movs.map(m=>({fecha:m.fecha, k:m.id, m}))
  ].sort((a,b)=>b.fecha-a.fecha);
  const fila = it => {
    const inf = C.info[it.k] || {};
    if(it.r){
      const r=it.r, t=tractor(r.tractor);
      const tit = r.producto==='adblue' ? 'AdBlue, cooperativa' : (r.origen==='dep' ? 'Gasoil del depósito' : 'Gasoil, cooperativa');
      let der = `${fmtH(r.litros)} L`, sub='';
      if(r.origen==='dep'){
        if(inf.ajustados!=null) der = `${fmtH(inf.ajustados)} L`, sub = `marcados ${fmtH(r.litros)} L`;
        else if(inf.coste!=null) sub = `${inf.provisional?'≈ ':''}${eur(inf.coste)}`;
      } else sub = eur(r.importe);
      return `<div class="mov"><span class="fx"><span class="n">${tit}</span><br><span class="s">${t?t.nombre:''}, ${fecha(r.fecha)}</span></span><span class="der">${der}<span class="s">${sub}</span></span></div>`;
    }
    const m = it.m;
    if(m.tipo==='inicio') return `<div class="mov"><span class="fx"><span class="n">Puesta en marcha del depósito</span><br><span class="s">${fecha(m.fecha)}</span><br><span class="tag ok">Lleno, ${fmtH(C.cap)} L</span></span><span class="der">${fmtH(m.litros)} L<span class="s">${eur(m.importe)}</span></span></div>`;
    if(m.tipo==='otro') return `<div class="mov"><span class="fx"><span class="n">Salida del depósito</span><br><span class="s">${m.nota||'Otros usos'}, ${fecha(m.fecha)}</span></span><span class="der">${fmtH(m.litros)} L<span class="s">${inf.coste!=null?(inf.provisional?'≈ ':'')+eur(inf.coste):''}</span></span></div>`;
    if(inf.pendiente) return `<button class="mov" data-comp="${m.id}"><span class="fx"><span class="n">Pedido de gasoil</span><br><span class="s">${fecha(m.fecha)}</span><br><span class="tag">Faltan datos, toca para completar</span>${m.lleno?' <span class="tag ok">Lleno</span>':''}</span><span class="der">${m.litros!=null?fmtH(m.litros)+' L':''}</span></button>`;
    const des = inf.desajuste!=null ? `<br><span class="s">Desajuste ${inf.desajuste>=0?'+':''}${fmtH(inf.desajuste)} L</span>` : '';
    return `<div class="mov"><span class="fx"><span class="n">Pedido de gasoil</span><br><span class="s">${fecha(m.fecha)}</span>${m.lleno?'<br><span class="tag ok">Lleno</span>':''}${des}</span><span class="der">${fmtH(m.litros)} L<span class="s">${eur(m.importe)}</span></span></div>`;
  };
  let dep;
  if(!C.iniciado){
    dep = `<section class="dep"><div class="tit">Depósito de la bajera</div><p class="s" style="margin:6px 0 10px">Ponlo en marcha el día que lo llenes entero: así la app sabrá cuánto hay.</p><button class="chip" id="bi" style="width:100%">Poner en marcha el depósito</button></section>`;
  } else {
    const st = Math.max(0, C.stock), pct = Math.min(100, st/C.cap*100);
    const a = C.ultimoAjuste;
    const desHtml = a ? `<div class="des ${a.pct>S.umbralDesajuste?'alerta':''}">Último llenado: desajuste de ${a.litros>=0?'+':''}${fmtH(a.litros)} L${a.pct?` (${fmtH(a.pct)} % de lo repostado)`:''}${a.pct>S.umbralDesajuste?'. Revisa si falta algún repostaje por apuntar.':''}</div>` : '';
    dep = `<section class="dep" aria-label="Depósito de la bajera"><div class="tit">Depósito de la bajera</div><div class="big">≈ ${Math.round(st).toLocaleString('es-ES')} L</div><div class="barra" aria-hidden="true"><span style="width:${pct}%"></span></div><div class="s">De ${C.cap.toLocaleString('es-ES')} L. Precio medio ${C.pendiente?'provisional ':''}${eurL(C.pm)}</div>${desHtml}</section>`;
  }
  $('#vista').innerHTML = `${dep}
    <div class="acc3">
      <button class="chip" id="brp">${I.gas}Repostar</button>
      <button class="chip" id="bpd">Pedido a domicilio</button>
      ${C.iniciado?`<button class="chip" id="bot">Otra salida del depósito</button>`:''}
    </div>
    ${textoPrecios()}
    <section class="hist"><h2>Historial</h2><div class="lista">${items.length?items.map(fila).join(''):'<div class="vacio" style="padding:16px">Todavía no hay repostajes. Empieza con el botón Repostar.</div>'}</div></section>`;
  if($('#bi')) $('#bi').onclick=hojaInicioDeposito;
  $('#brp').onclick=hojaRepostar;
  $('#bpd').onclick=()=> C.iniciado ? hojaPedido() : hojaInicioDeposito();
  if($('#bot')) $('#bot').onclick=hojaOtraSalida;
  document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>hojaCompletar(b.dataset.comp));
}

function leerNum(id){ const v=$('#'+id).value; return v==='' ? null : parseFloat(v); }

function hojaInicioDeposito(){
  abrirHoja(`<h3>Poner en marcha el depósito</h3><p>Usa el día que el camión lo deje lleno. Lo que ya había dentro se valora al precio de esta compra.</p>
    <label class="f" for="cap">Capacidad del depósito (L)</label>${campoNumero('cap', S.deposito.capacidad)}
    <label class="f" for="l">Litros que ha traído el camión</label>${campoNumero('l')}
    <label class="f" for="p">Importe total (€)</label>${campoNumero('p',undefined,'step="0.01"')}
    <label class="f" for="fd">Fecha</label><input type="datetime-local" id="fd" value="${aLocal(Date.now())}">
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Poner en marcha</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const cap=leerNum('cap'), l=leerNum('l'), p=leerNum('p'), f=new Date($('#fd').value).getTime();
        if(!cap||cap<=0){ $('#err').textContent='Indica la capacidad del depósito.'; return; }
        if(!l||l<=0){ $('#err').textContent='Indica los litros que ha traído el camión.'; return; }
        if(l>cap){ $('#err').textContent='Los litros no pueden superar la capacidad.'; return; }
        if(p==null||p<=0){ $('#err').textContent='Indica el importe total.'; return; }
        if(isNaN(f)){ $('#err').textContent='Indica la fecha.'; return; }
        S.deposito.capacidad=cap;
        S.deposito.movs.push({id:'d'+Date.now(), tipo:'inicio', fecha:f, litros:l, importe:p});
        guardar(); cerrarHoja(); pintar(); toast('Depósito en marcha');
      };
  });
}

function hojaPedido(){
  abrirHoja(`<h3>Pedido de gasoil a domicilio</h3><p>Si ahora no tienes los litros o el importe, déjalos en blanco y los completas cuando tengas el albarán.</p>
    <label class="f" for="fd">Fecha de entrega</label><input type="datetime-local" id="fd" value="${aLocal(Date.now())}">
    <label class="f" for="l">Litros</label>${campoNumero('l')}
    <label class="f" for="p">Importe total (€)</label>${campoNumero('p',undefined,'step="0.01"')}
    <label class="chk"><input type="checkbox" id="ll"> Ha quedado lleno (${S.deposito.capacidad.toLocaleString('es-ES')} L)</label>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const l=leerNum('l'), p=leerNum('p'), f=new Date($('#fd').value).getTime();
        if(isNaN(f)){ $('#err').textContent='Indica la fecha.'; return; }
        if(l!=null && l<=0){ $('#err').textContent='Los litros deben ser más de 0.'; return; }
        if(p!=null && p<0){ $('#err').textContent='El importe no puede ser negativo.'; return; }
        S.deposito.movs.push({id:'d'+Date.now(), tipo:'compra', fecha:f, litros:l, importe:p, lleno:$('#ll').checked});
        guardar(); cerrarHoja(); pintar(); toast(l==null||p==null ? 'Pedido guardado, faltan datos' : 'Pedido guardado');
      };
  });
}

function hojaCompletar(id){
  const m = S.deposito.movs.find(x=>x.id===id);
  abrirHoja(`<h3>Completar pedido</h3><p>Pedido del ${fecha(m.fecha)}. Al guardar se recalculan el precio medio y los costes.</p>
    <label class="f" for="l">Litros</label>${campoNumero('l', m.litros??undefined)}
    <label class="f" for="p">Importe total (€)</label>${campoNumero('p', m.importe??undefined,'step="0.01"')}
    <label class="chk"><input type="checkbox" id="ll" ${m.lleno?'checked':''}> Quedó lleno (${S.deposito.capacidad.toLocaleString('es-ES')} L)</label>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const l=leerNum('l'), p=leerNum('p');
        if(l==null||l<=0){ $('#err').textContent='Indica los litros.'; return; }
        if(p==null||p<0){ $('#err').textContent='Indica el importe.'; return; }

      };
  });
}

/* ---------- mantenimientos ---------- */
let filtroEstado='todos', filtroMaq='todas';
const nombreMaq = id => (tractor(id)||apero(id)||{}).nombre || '';
function textoRestante(r){ return r<0 ? `pasado ${fmtH(-r)} h` : `faltan ${fmtH(r)} h`; }

function pintarMant(){
  const enMaq = m => filtroMaq==='todas' || m.maq===filtroMaq;
  const todas = S.mants.filter(enMaq).map(info);
  const cuenta = e => todas.filter(x=>x.e===e).length;
  const pasa = x => filtroEstado==='todos' || (filtroEstado==='pasados'&&x.e==='r') || (filtroEstado==='inminentes'&&x.e==='y');
  const maqs = [...S.tractores, ...S.aperos];
  const bloques = bloquesMaquinas();
  const orden = bloques.flatMap(b=>b.ids);
  const tarjetas = orden.filter(id=>filtroMaq==='todas'||id===filtroMaq).map(id=>{
    const l = tallerDe(id);
    return (l.length && (filtroEstado==='todos' || l.some(pasa))) ? tarjetaTaller(id) : '';
  }).join('');
  const filaHtml = ({m,e})=>`
      <div class="fwrap"><div class="fondo" aria-hidden="true">Hecho</div>
        <div class="fila" data-id="${m.id}" tabindex="0" role="button" aria-label="${esc(m.nombre)}, ${esc(nombreMaq(m.maq))}, ${textoMant(m)}">
          <span class="dot ${e||'n'}"></span>${marcaM(m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}
          <span class="fx"><span class="n">${m.nombre}</span><span class="s">${nombreMaq(m.maq)}, ${cadaTexto(m)}${m.manualH?`<br>Trabajo: ${textoMant(m)}. Manual: ${textoManual(m)}`:''}</span></span>
          <span class="fq">${m.intervalo?`<span class="rel" title="${m.reloj==='motor'?'Horas de motor':'Horas de trabajo'}">${m.reloj==='motor'?I.motor:I.reloj}</span>`:`<span class="rel" title="Por tiempo">${I.cal}</span>`}${textoMant(m)}</span>
        </div></div>`;
  const grupos = bloques.map(b=>({titulo:b.titulo, filas: todas.filter(x=>b.ids.includes(x.m.maq) && x.m.quien!=='taller' && pasa(x)).sort(porHoras)})).filter(g=>g.filas.length);
  const unaSola = filtroMaq!=='todas';
  $('#vista').innerHTML = `
    <div class="filtros">
      <div class="seg" id="fe">
        <button data-v="todos" class="${filtroEstado==='todos'?'sel':''}">Todos</button>
        <button data-v="pasados" class="${filtroEstado==='pasados'?'sel':''}"><span class="dot r"></span>Pasados (${cuenta('r')})</button>
        <button data-v="inminentes" class="${filtroEstado==='inminentes'?'sel':''}"><span class="dot y"></span>Inminentes (${cuenta('y')})</button>
      </div>
      <select id="fm" aria-label="Filtrar por máquina"><option value="todas">Todas las máquinas</option>${maqs.map(x=>`<option value="${x.id}" ${x.id===filtroMaq?'selected':''}>${x.nombre}</option>`).join('')}</select>
    </div>
    <p class="pista">Arriba, lo del tractor y el apero enganchado, por horas que faltan. Desliza una línea a la derecha para marcarla como hecha, o tócala para ver el detalle. Lo del taller va junto en su tarjeta.</p>
    ${tarjetas}
    ${grupos.length ? grupos.map(g=>`${unaSola?'':`<h2 class="secc">${esc(g.titulo)}</h2>`}<div class="lista" style="margin-bottom:6px">${g.filas.map(filaHtml).join('')}</div>`).join('') : `<div class="lista"><div class="vacio" style="padding:16px">${tarjetas?'Nada más con este filtro.':'No hay mantenimientos con este filtro.'}</div></div>`}`;
  $('#fe').querySelectorAll('button').forEach(b=>b.onclick=()=>{ filtroEstado=b.dataset.v; pintarMant(); });
  $('#fm').onchange=e=>{ filtroMaq=e.target.value; pintarMant(); };
  document.querySelectorAll('.fila').forEach(enlazarDeslizar);
  document.querySelectorAll('[data-taller]').forEach(b=>b.onclick=()=>hojaTaller(b.dataset.taller));
}

function enlazarDeslizar(el){
  let x0=null, dx=0, movido=false; const id=el.dataset.id;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; movido=false; el.setPointerCapture(e.pointerId); el.style.transition='none'; });
  el.addEventListener('pointermove',e=>{ if(x0===null) return; dx=Math.max(0,e.clientX-x0); if(dx>6) movido=true; el.style.transform=`translateX(${dx}px)`; });
  el.addEventListener('pointerup',()=>{
    if(x0===null) return; x0=null;
    el.style.transition='transform .2s'; const w=el.offsetWidth; el.style.transform='translateX(0)';
    if(dx > w*0.35) hojaHecho(id); else if(!movido) hojaDetalle(id);
  });
  el.addEventListener('pointercancel',()=>{ x0=null; el.style.transform='translateX(0)'; });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hojaDetalle(id); } });
}

  if(m.intervalo) ultimo = m.reloj==='motor' ? `A las ${fmtH(m.ultima)} h del horómetro, ` : `Hace ${fmtH(m.intervalo - horasRestantes(m))} h de trabajo, `;

    <dl class="det">

      <dt>Toca</dt><dd>${cadaTexto(m).replace(/^c/,'C')}</dd>

      ${m.manualH?`<dt>Según el manual</dt><dd>${marcaM(m)?'<span class="mk">M</span> ':''}Cada ${fmtH(m.manualH)} h de horómetro: ${textoManual(m)}</dd>`:''}
      <dt>Última vez</dt><dd>${ultimo}</dd>
      <dt>Estado</dt><dd>${e==='r'?'Pasado':e==='y'?'Inminente':'Al día'}, ${textoMant(m)}</dd>

/* pone a cero un mantenimiento y lo apunta en el historial */
function completar(m, o){
  const t = tractor(m.maq);
  const h = {fecha:Date.now(), hecho:o.fecha, mant:m.id, quien:o.quien, reloj:m.reloj};
  if(o.revision) h.revision = true;
  if(m.reloj==='motor'){
    if(m.intervalo){ h.horas = o.horo; h.tocaba = m.ultima + m.intervalo; }
    if(o.horo!=null) m.ultima = o.horo;
  } else {
    if(m.intervalo){ h.horasAlHacerlo = (m.intervalo - horasRestantes(m)) - (o.trabajoDesde||0); h.intervalo = m.intervalo; }
    m.acum = o.trabajoDesde||0; m.desde = Date.now();
    if(t) m.ultimaHoro = Math.max(0, (o.horo!=null ? o.horo : t.horometro) - m.acum);
  }
  m.fecha = o.fecha; m.mAviso = false;
  S.hechos.push(h);
}

function hojaHecho(id, alAcabar){
  const m = S.mants.find(x=>x.id===id), t = tractor(m.maq);
  const conHoro = !!t && m.reloj==='motor' && !!m.intervalo;
  const conTrab = m.reloj==='trabajo' && !!m.intervalo;
  const acumAhora = conTrab ? m.intervalo - horasRestantes(m) : 0;
  abrirHoja(`<h3>${esc(m.nombre)} hecho</h3><p>${nombreMaq(m.maq)}.${conHoro?' Indica el horómetro cuando lo hiciste. Si fue ahora, deja la última lectura.':''}${conTrab?' Si lo acabas de hacer, deja 0. Si fue antes, indica cuántas horas de trabajo han pasado desde entonces.':''}</p>
    ${m.detalles?`<div class="detalles">${esc(m.detalles)}</div>`:''}
    ${conHoro?`<label class="f" for="h">Horas del horómetro</label>${campoNumero('h', t.horometro)}`:''}
    ${conTrab?`<label class="f" for="h">Horas de trabajo desde que lo hiciste</label>${campoNumero('h', 0)}`:''}
    <label class="f" for="fd">Fecha</label><input id="fd" type="date" value="${hoyISO()}" max="${hoyISO()}">
    <label class="f">Lo hizo</label><div class="seg" id="qq"><button data-v="yo" class="${m.quien!=='taller'?'sel':''}">Yo</button><button data-v="taller" class="${m.quien==='taller'?'sel':''}">Taller</button></div>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras(); enlazarSeg('#qq');
      $('#no').onclick=()=>cerrarHoja();
      if($('#h')) $('#h').oninput=()=>{$('#err').textContent='';};
      $('#si').onclick=()=>{
        const err = x=>{ $('#err').textContent=x; };
        const f = fechaDe($('#fd').value);
        if(f > Date.now()+60000) return err('La fecha no puede ser futura.');
        let v = null;
        if(conHoro){
          v = parseFloat($('#h').value);
          if(isNaN(v)) return err('Escribe las horas del horómetro.');
          if(v > t.horometro) return err(`Es más que la última lectura (${fmtH(t.horometro)} h). Actualiza antes el horómetro desde Inicio.`);
          if(v < m.ultima) return err(`Es menos que la vez anterior (${fmtH(m.ultima)} h).`);
        }
        if(conTrab){
          v = parseFloat($('#h').value);
          if(isNaN(v) || v<0) return err('Escribe 0 o más horas.');
          if(v > acumAhora) return err(`Desde la vez anterior solo hay ${fmtH(acumAhora)} h de trabajo registradas.`);
        }
        completar(m, {fecha:f, quien:valSeg('#qq'), horo: conHoro ? v : (t ? t.horometro : null), trabajoDesde: conTrab ? v : 0});
        guardar(); cerrarHoja(); pintar(); toast(`${m.nombre}: marcado como hecho`);
        if(alAcabar) setTimeout(alAcabar, 120);
      };
  });
}

/* ---------- próxima visita al taller ---------- */
function tallerDe(maqId){
  return S.mants.filter(m=>m.maq===maqId && m.quien==='taller').map(info)
    .filter(x=>x.r < S.ventanaTaller || x.d < S.diasAmarillo).sort(porUrgencia);
}
const peorEstado = l => l.some(x=>x.e==='r') ? 'r' : l.some(x=>x.e==='y') ? 'y' : '';
function tarjetaTaller(maqId){
  const l = tallerDe(maqId); if(!l.length) return '';
  const e = peorEstado(l);
  return `<button class="taller" data-taller="${maqId}"><span class="dot ${e||'n'}" aria-label="${e==='r'?'Algo pasado':e==='y'?'Algo inminente':''}"></span><span><span class="n">Próxima visita al taller</span><br><span class="s">${nombreMaq(maqId)}, ${l.length} ${l.length===1?'tarea':'tareas'}. ${e?'Llama para pedir cita.':'Vencen en las próximas '+fmtH(S.ventanaTaller)+' h.'}</span></span><span class="q">Ver</span></button>`;
}
function textoTaller(maqId, l){
  const t = tractor(maqId);
  return `Revisión ${nombreMaq(maqId)}${t?` (horómetro ${fmtH(t.horometro)} h)`:''}:\n` + l.map(x=>`- ${x.m.nombre}`).join('\n');
}
function hojaTaller(maqId, quitados){
  quitados = quitados || new Set();
  const l = tallerDe(maqId), t = tractor(maqId);
  const marcados = () => l.filter(x=>!quitados.has(x.m.id));
  abrirHoja(`<h3>Próxima visita al taller</h3><p>${nombreMaq(maqId)}. Lo que hace el taller y vence pronto. Desmarca lo que no te vayan a hacer.</p>
    <div class="ventana">Lo que vence en las próximas<button id="vm" aria-label="Menos horas">−</button><b>${fmtH(S.ventanaTaller)} h</b><button id="vp" aria-label="Más horas">+</button></div>
    <div>${l.length ? l.map(x=>`<button class="chk ${quitados.has(x.m.id)?'':'on'}" data-id="${x.m.id}" aria-pressed="${!quitados.has(x.m.id)}"><span class="box">${OKSVG}</span><span>${esc(x.m.nombre)}<span class="s">${cadaTexto(x.m)}</span></span><span class="der"><span class="dot ${x.e||'n'}" style="display:inline-block;vertical-align:-1px;margin-right:6px"></span>${textoMant(x.m)}</span></button>`).join('') : '<p>No vence nada del taller en este margen.</p>'}</div>
    <div class="err" id="err"></div>
    ${l.length?`<div class="acciones"><button id="cp">Copiar lista</button><button id="wa">Enviar por WhatsApp</button></div>`:''}

      $('#vp').onclick=()=>{ S.ventanaTaller+=50; guardar(); hojaTaller(maqId, quitados); };

      $('#wa').onclick=()=>{ if(!marcados().length) return $('#err').textContent='Marca al menos una tarea.'; window.open('https://wa.me/?text='+encodeURIComponent(texto()), '_blank'); };

  });
}
function hojaRevision(maqId, ids, quitados){

/* ---------- rutina diaria ---------- */
const OKSVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function rutinaHoy(tid){
  const r = S.rutinaDia[tid];
  if(r && r.dia===hoyISO()) return r;
  return S.rutinaDia[tid] = {dia:hoyISO(), ok:[], fallos:[], saltada:false};
}
function rutinaPendiente(t){
  if(!t || !(t.rutina||[]).length) return false;
  const r = rutinaHoy(t.id);
  return !r.saltada && !t.rutina.every(n=>r.ok.includes(n) || r.fallos.includes(n));
}
function rutinaTodoBien(t){
  const r = rutinaHoy(t.id);
  t.rutina.forEach(n=>{ if(!r.fallos.includes(n) && !r.ok.includes(n)) r.ok.push(n); });
}
function hojaPreguntaRutina(modo, cuando){
  const t = tractor(S.sel.tractor), r = rutinaHoy(t.id);
  const falta = t.rutina.filter(n=>!r.ok.includes(n) && !r.fallos.includes(n));
  abrirHoja(`<h3>¿Hiciste la rutina?</h3><p>Hoy falta por mirar en el ${t.nombre}: ${falta.map(esc).join(', ').toLowerCase()}.</p>
    <div class="acciones"><button class="ok" id="tb">Todo bien</button></div>
    <div class="acciones"><button id="vl">Ver lista</button><button id="sl">Saltar</button></div>`,()=>{
      $('#tb').onclick=()=>{ rutinaTodoBien(t); guardar(); cerrarHoja(); pulsarModo(modo, true, cuando); };
      $('#sl').onclick=()=>{ r.saltada = true; guardar(); cerrarHoja(); pulsarModo(modo, true, cuando); };
      $('#vl').onclick=()=>{ cerrarHoja(); setTimeout(()=>irA('salir'), 80); };
  });
}
function hojaRutina(tid, lista){
  const t = tractor(tid);
  lista = lista || [...(t.rutina||[])];
  abrirHoja(`<h3>Rutina diaria</h3><p>${t.nombre}. Lo que miras cada día antes de salir.</p>
    <div>${lista.length ? lista.map((n,k)=>`<div class="mitem"><span>${esc(n)}</span><button data-k="${k}" aria-label="Quitar ${esc(n)}">×</button></div>`).join('') : '<p>Sin comprobaciones todavía.</p>'}</div>
    <div class="caja"><label class="f" for="rn">Añadir comprobación</label><input id="rn" placeholder="Presión de neumáticos"><div class="err" id="err"></div><div class="acciones"><button id="add">Añadir a la lista</button></div></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar rutina</button></div>`,()=>{

      $('#no').onclick=()=>cerrarHoja();

}
function hojaFalla(tid, n){
  const t = tractor(tid);
  abrirHoja(`<h3>${esc(n)}: algo falla</h3><p>Se apunta como avería del ${t.nombre} con la fecha de hoy.</p>
    <label class="f" for="fn">Qué pasa (opcional)</label><input id="fn" placeholder="Baja de nivel más de lo normal">
    <div class="acciones"><button id="no">Cancelar</button><button class="peligro" id="si">Apuntar avería</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const r = rutinaHoy(tid);

      };

/* ---------- pantalla Antes de salir ---------- */
function pintarSalir(){
  const t = tractor(S.sel.tractor), a = apero(S.sel.apero);
  if(!t){ seccion='inicio'; return pintar(); }
  const r = rutinaHoy(t.id), items = t.rutina||[];
  const proximos = S.mants.filter(m=>(m.maq===t.id || (a && m.maq===a.id)) && m.quien!=='taller').map(info)
    .filter(x=>x.r < S.ventanaSalir || x.d < 7 || marcaM(x.m)).sort(porUrgencia);
  const tarjetas = [t.id, a && a.id].filter(Boolean).filter(id=>tallerDe(id).some(x=>x.r < S.ventanaSalir || x.e==='r')).map(tarjetaTaller).join('');
  const fila = n => {
    const ok = r.ok.includes(n), fa = r.fallos.includes(n);
    return `<div class="rut"><button class="chk ${ok?'on':''} ${fa?'fallo':''}" data-n="${esc(n)}" aria-pressed="${ok}"><span class="box">${fa?'!':OKSVG}</span><span>${esc(n)}${fa?'<span class="s">Avería apuntada</span>':''}</span></button>${fa?'':`<button class="falla" data-f="${esc(n)}">Falla</button>`}</div>`;
  };
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="vb" aria-label="Volver a Inicio">${FL.izq}</button><h2>Antes de salir</h2><span style="width:44px"></span></div>
    <h2 class="secc">Rutina de hoy del ${t.nombre}</h2>
    <section class="panel">${items.length ? items.map(fila).join('') + `<div class="acciones"><button id="ed">Editar rutina</button><button class="ok" id="tb">Todo bien</button></div>` : `<p class="vacio">No hay rutina diaria para este tractor.</p><div class="acciones"><button id="ed">Crear rutina</button></div>`}</section>
    <h2 class="secc">Lo que vence pronto</h2>
    <div class="ventana">En las próximas<button id="vm" aria-label="Menos horas">−</button><b>${fmtH(S.ventanaSalir)} h</b><button id="vp" aria-label="Más horas">+</button></div>
    ${tarjetas}
    <div class="lista">${proximos.length ? proximos.map(({m,e})=>`<button class="mov" data-m="${m.id}" style="align-items:center"><span class="dot ${e||'n'}"></span>${marcaM(m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}<span class="fx"><span class="n">${m.nombre}</span><span class="s" style="font-size:13px;color:var(--text2)">${nombreMaq(m.maq)}, toca para marcarlo hecho</span></span><span class="der">${textoMant(m)}</span></button>`).join('') : `<div class="vacio" style="padding:14px">Nada vence en las próximas ${fmtH(S.ventanaSalir)} h con este tractor y este apero.</div>`}</div>`;
  $('#vb').onclick=()=>history.back();
  $('#ed').onclick=()=>hojaRutina(t.id);
  if($('#tb')) $('#tb').onclick=()=>{ rutinaTodoBien(t); guardar(); pintar(); toast('Rutina hecha'); };
  document.querySelectorAll('.rut .chk').forEach(b=>b.onclick=()=>{
    const n = b.dataset.n;
    if(r.ok.includes(n)) r.ok = r.ok.filter(x=>x!==n);
    else { r.ok.push(n); r.fallos = r.fallos.filter(x=>x!==n); }
    guardar(); pintar();
    if(!rutinaPendiente(t)) toast('Rutina hecha');
  });
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>hojaFalla(t.id, b.dataset.f));
  $('#vm').onclick=()=>{ S.ventanaSalir=Math.max(5, S.ventanaSalir-5); guardar(); pintar(); };
  $('#vp').onclick=()=>{ S.ventanaSalir+=5; guardar(); pintar(); };
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>hojaHecho(b.dataset.m));
  document.querySelectorAll('[data-taller]').forEach(b=>b.onclick=()=>hojaTaller(b.dataset.taller));
}

/* ---------- códigos de fallo ---------- */
const normCodigo = c => c.replace(/\s+/g,'').toUpperCase();
const nombreModoSesion = x => x==='campo'?'en campo':x==='carretera'?'en carretera':x==='pausa'?'en pausa':'sin sesión';
function hojaCodigo(){
  const t = tractor(S.sel.tractor), a = apero(S.sel.apero);
  abrirHoja(`<h3>Código de fallo</h3><p>Se guarda sola la hora, el horómetro (${fmtH(t.horometro)} h, última lectura), el ${esc(t.nombre)}${a?` con ${esc(a.nombre)}`:''} y si estabas en campo o en carretera.</p>
    <label class="f" for="cd">Código que sale en el tractor</label><input id="cd" autocapitalize="characters" autocomplete="off" placeholder="Tal como sale en la pantalla">
    <label class="f" for="cn">Qué pasaba (opcional)</label><textarea id="cn" rows="2" placeholder="Se puede dictar"></textarea>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const c = normCodigo($('#cd').value);
        if(!c){ $('#err').textContent='Escribe el código.'; return; }
        const modo = !S.sesion ? null : enPausa() ? 'pausa' : S.sesion.tramos[S.sesion.tramos.length-1].modo;
        S.codigos.push({id:nuevoId('c'), fecha:Date.now(), codigo:c, nota:$('#cn').value.trim(), tractor:t.id, apero:a?a.id:null, horometro:t.horometro, modo});
        const n = S.codigos.filter(x=>x.codigo===c).length;
        guardar(); cerrarHoja(); pintar(); toast(n>1 ? `Código apuntado. Ha salido ${n} veces` : 'Código apuntado');
      };
  });
}
function gruposCodigos(){
  const g = {};
  S.codigos.forEach(x=>{ (g[x.codigo] = g[x.codigo] || []).push(x); });
  return Object.entries(g).map(([codigo,l])=>({codigo, l:l.sort((a,b)=>b.fecha-a.fecha)})).sort((a,b)=>b.l[0].fecha-a.l[0].fecha);
}
const lineaCodigo = x => `${fecha(x.fecha)}, ${nombreMaq(x.tractor)}${x.apero?' con '+nombreMaq(x.apero):''}, ${fmtH(x.horometro)} h, ${nombreModoSesion(x.modo)}`;
function hojaGrupoCodigo(codigo){
  const g = gruposCodigos().find(x=>x.codigo===codigo); if(!g){ cerrarHoja(); return; }
  abrirHoja(`<h3>Código ${esc(codigo)}</h3><p>Ha salido ${g.l.length===1?'1 vez':g.l.length+' veces'}.</p>
    <div class="lista">${g.l.map(x=>`<div class="mov" style="align-items:center"><span class="fx"><span class="n">${esc(lineaCodigo(x))}</span>${x.nota?`<span class="s" style="font-size:13px;color:var(--text2)">${esc(x.nota)}</span>`:''}</span><button class="falla" data-del="${x.id}">Borrar</button></div>`).join('')}</div>
    <div class="acciones"><button class="ok" id="no">Cerrar</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#hoja').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        const x = S.codigos.find(c=>c.id===b.dataset.del);
        abrirHoja(`<h3>¿Borrar este código?</h3><p>${esc(codigo)}: ${esc(lineaCodigo(x))}.</p><p>No se puede deshacer.</p><div class="acciones"><button id="no2">Cancelar</button><button class="peligro" id="si2">Borrar</button></div>`,()=>{
          $('#no2').onclick=()=>hojaGrupoCodigo(codigo);
          $('#si2').onclick=()=>{ S.codigos=S.codigos.filter(c=>c.id!==x.id); guardar(); pintar(); toast('Código borrado'); if(S.codigos.some(c=>c.codigo===codigo)) hojaGrupoCodigo(codigo); else cerrarHoja(); };
        });
      });
  });
}

function hojaCargarPlantilla(tid){

function pintar(){
  pintarContadorNotas();
  const d = new Date();
  $('#fecha').textContent = d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
  pintarNav();
  if(seccion==='inicio') pintarInicio();
  else if(seccion==='mant') pintarMant();
  else if(seccion==='gasoil') pintarComb();
  else if(seccion==='dias') pintarDias();
  else if(seccion==='maquinas') pintarMaquinas();
  else if(seccion==='salir') pintarSalir();
  else if(seccion==='averias') pintarAverias();
  else if(seccion==='campos') pintarCampos();
  else if(seccion==='notas') pintarNotas();
  else if(seccion==='notif') pintarAvisos();
  else {
    const nom = SECCIONES.find(s=>s[0]===seccion)[1];
    $('#vista').innerHTML = `<div class="prox"><h2 style="font-weight:500;color:var(--text)">${nom}</h2><p>Esta sección la construiremos en los siguientes pasos.</p></div>`;
  }
}

function tic(){
  if(seccion!=='inicio') return;
  const r = $('#reloj'); if(!r) return;
  if(S.sesion){
    const ms = Date.now()-S.sesion.inicio;
    r.textContent = dur(trabajadoSesion());
    const ult = S.sesion.tramos[S.sesion.tramos.length-1];
    const ptr = $('#ptr'), pc = $('#pcont');
    if(ptr && ult && !ult.fin) ptr.textContent = dur(Date.now()-ult.inicio);
    if(pc && S.sesion.pausa){ const mn = Math.floor((Date.now()-S.sesion.pausa)/60000); pc.textContent = `${Math.floor(mn/60)}:${String(mn%60).padStart(2,'0')}`; }
    const l = $('#largo');
    if(ms/H >= S.umbralLarga){ l.style.display='block'; l.textContent=`La sesión lleva más de ${S.umbralLarga} h abierta. ¿Se te olvidó pararla?`; }
    else l.style.display='none';
  } else r.textContent='00:00:00';
  if(S.sesion && new Date().getSeconds()%15===0) pintarHoy();
}
setInterval(tic, 1000);

let estadosPrevios = null;
function comprobarAvisos(){
  const t = tractor(S.sel.tractor), a = apero(S.sel.apero);
  if(!t) return;
  const ahora = {};
  S.mants.filter(m=>m.maq===t.id || (a && m.maq===a.id)).forEach(m=>{ ahora[m.id]=estadoMant(m); });
  let cambio = false;
  if(estadosPrevios){
    for(const id in ahora){
      if(ahora[id]!==estadosPrevios[id]){
        cambio = true;
        const m = S.mants.find(x=>x.id===id);
        if(ahora[id]==='r') toast(`${m.nombre}: ya toca`);
        else if(ahora[id]==='y') toast(`${m.nombre}: ${textoMant(m)}`);
      }
    }
  }
  estadosPrevios = ahora;
  if(cambio && seccion==='inicio' && !hojaAbierta) pintarInicio();
}
setInterval(comprobarAvisos, 30000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ if(!hojaAbierta) pintar(); comprobarAvisos(); }
});
setTimeout(comprobarAvisos, 500);
