/* pone a cero un mantenimiento y lo apunta en el historial */
function completar(m, o){
  const t = tractor(m.maq);
  const h = {fecha:Date.now(), hecho:o.fecha, mant:m.id, quien:o.quien, reloj:m.reloj};
  if(o.revision) h.revision = true;
  if(m.reloj==='motor'){
    if(m.intervalo){ h.horas = o.horo; h.tocaba = m.ultima + m.intervalo; }
    if(o.horo!=null) m.ultima = o.horo;
  } else {
    if(m.intervalo){ h.horasAlHacerlo = (m.intervalo - horasRestantes(m)) - (o.trabajoDesde||0); h.intervalo = m.intervalo; }
    m.acum = o.trabajoDesde||0; m.desde = Date.now();
    if(t) m.ultimaHoro = Math.max(0, (o.horo!=null ? o.horo : t.horometro) - m.acum);
  }
  m.fecha = o.fecha; m.mAviso = false;
  S.hechos.push(h);
}

function hojaHecho(id, alAcabar){
  const m = S.mants.find(x=>x.id===id), t = tractor(m.maq);
  const conHoro = !!t && m.reloj==='motor' && !!m.intervalo;
  const conTrab = (m.reloj==='trabajo'||m.reloj==='ha') && !!m.intervalo, uN = m.reloj==='ha' ? 'hectáreas' : 'horas de trabajo';
  const acumAhora = conTrab ? m.intervalo - horasRestantes(m) : 0;
  abrirHoja(`<h3>${esc(m.nombre)} hecho</h3><p>${nombreMaq(m.maq)}.${conHoro?' Indica el horómetro cuando lo hiciste. Si fue ahora, deja la última lectura.':''}${conTrab?` Si lo acabas de hacer, deja 0. Si fue antes, indica cuántas ${uN} han pasado desde entonces.`:''}</p>
    ${m.detalles?`<div class="detalles">${esc(m.detalles)}</div>`:''}
    ${conHoro?`<label class="f" for="h">Horas del horómetro</label>${campoNumero('h', t.horometro)}`:''}
    ${conTrab?`<label class="f" for="h">${m.reloj==='ha'?'Hectáreas':'Horas de trabajo'} desde que lo hiciste</label>${campoNumero('h', 0)}`:''}
    <label class="f" for="fd">Fecha</label><input id="fd" type="date" value="${hoyISO()}" max="${hoyISO()}">
    <label class="f">Lo hizo</label><div class="seg" id="qq"><button data-v="yo" class="${m.quien!=='taller'?'sel':''}">Yo</button><button data-v="taller" class="${m.quien==='taller'?'sel':''}">Taller</button></div>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras(); enlazarSeg('#qq');
      $('#no').onclick=()=>cerrarHoja();
      if($('#h')) $('#h').oninput=()=>{$('#err').textContent='';};
      $('#si').onclick=()=>{
        const err = x=>{ $('#err').textContent=x; };
        const f = fechaDe($('#fd').value);
        if(f > Date.now()+60000) return err('La fecha no puede ser futura.');
        let v = null;
        if(conHoro){
          v = parseFloat($('#h').value);
          if(isNaN(v)) return err('Escribe las horas del horómetro.');
          if(v > t.horometro) return err(`Es más que la última lectura (${fmtH(t.horometro)} h). Actualiza antes el horómetro desde Inicio.`);
          if(v < m.ultima) return err(`Es menos que la vez anterior (${fmtH(m.ultima)} h).`);
        }
        if(conTrab){
          v = parseFloat($('#h').value);
          if(isNaN(v) || v<0) return err(`Escribe 0 o más ${m.reloj==='ha'?'hectáreas':'horas'}.`);
          if(v > acumAhora) return err(`Desde la vez anterior solo hay ${fmtH(acumAhora)} ${m.reloj==='ha'?'ha':'h de trabajo'} registradas.`);
        }
        completar(m, {fecha:f, quien:valSeg('#qq'), horo: conHoro ? v : (t ? t.horometro : null), trabajoDesde: conTrab ? v : 0});
        guardar(); cerrarHoja(); pintar(); toast(`${m.nombre}: marcado como hecho`);
        if(alAcabar) setTimeout(alAcabar, 120);
      };
  });
}

/* ---------- próxima visita al taller ---------- */
function tallerDe(maqId){
  return S.mants.filter(m=>m.maq===maqId && m.quien==='taller').map(info)

const peorEstado = l => l.some(x=>x.e==='r') ? 'r' : l.some(x=>x.e==='y') ? 'y' : '';
function tarjetaTaller(maqId){

}

/* ---------- rutina diaria ---------- */
const OKSVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function rutinaHoy(tid){
  const r = S.rutinaDia[tid];
  if(r && r.dia===hoyISO()) return r;
  return S.rutinaDia[tid] = {dia:hoyISO(), ok:[], fallos:[], saltada:false};
}
function rutinaPendiente(t){
  if(!t || !(t.rutina||[]).length) return false;
  const r = rutinaHoy(t.id);
  return !r.saltada && !t.rutina.every(n=>r.ok.includes(n) || r.fallos.includes(n));
}
function rutinaTodoBien(t){
  const r = rutinaHoy(t.id);
  t.rutina.forEach(n=>{ if(!r.fallos.includes(n) && !r.ok.includes(n)) r.ok.push(n); });
}
function hojaPreguntaRutina(modo, cuando){
  const t = tractor(S.sel.tractor), r = rutinaHoy(t.id);
  const falta = t.rutina.filter(n=>!r.ok.includes(n) && !r.fallos.includes(n));
  abrirHoja(`<h3>¿Hiciste la rutina?</h3><p>Hoy falta por mirar en el ${t.nombre}: ${falta.map(esc).join(', ').toLowerCase()}.</p>
    <div class="acciones"><button class="ok" id="tb">Todo bien</button></div>
    <div class="acciones"><button id="vl">Ver lista</button><button id="sl">Saltar</button></div>`,()=>{
      $('#tb').onclick=()=>{ rutinaTodoBien(t); guardar(); cerrarHoja(); pulsarModo(modo, true, cuando); };
      $('#sl').onclick=()=>{ r.saltada = true; guardar(); cerrarHoja(); pulsarModo(modo, true, cuando); };
      $('#vl').onclick=()=>{ cerrarHoja(); setTimeout(()=>irA('salir'), 80); };
  });
}
function hojaRutina(tid, lista){
  const t = tractor(tid);
  lista = lista || [...(t.rutina||[])];
  abrirHoja(`<h3>Rutina diaria</h3><p>${t.nombre}. Lo que miras cada día antes de salir.</p>
    <div>${lista.length ? lista.map((n,k)=>`<div class="mitem"><span>${esc(n)}</span><button data-k="${k}" aria-label="Quitar ${esc(n)}">×</button></div>`).join('') : '<p>Sin comprobaciones todavía.</p>'}</div>
    <div class="caja"><label class="f" for="rn">Añadir comprobación</label><input id="rn" placeholder="Presión de neumáticos"><div class="err" id="err"></div><div class="acciones"><button id="add">Añadir a la lista</button></div></div>

function hojaFalla(tid, n){

/* ---------- pantalla Antes de salir ---------- */
function pintarSalir(){
  const t = tractor(S.sel.tractor), a = apero(S.sel.apero);
  if(!t){ seccion='inicio'; return pintar(); }
  const r = rutinaHoy(t.id), items = t.rutina||[];
  const proximos = S.mants.filter(m=>(m.maq===t.id || (a && m.maq===a.id)) && m.quien!=='taller').map(info)
    .filter(x=>x.r < S.ventanaSalir || x.d < 7 || marcaM(x.m)).sort(porUrgencia);
  const tarjetas = [t.id, a && a.id].filter(Boolean).filter(id=>tallerDe(id).some(x=>x.r < S.ventanaSalir || x.e==='r')).map(tarjetaTaller).join('');
  const fila = n => {
    const ok = r.ok.includes(n), fa = r.fallos.includes(n);

const nombreModoSesion = x => x==='campo'?'en campo':x==='carretera'?'en carretera':(x==='pausa'||x==='parado')?'parado':'sin sesión';

/* ---------- campos: contornos SIGPAC del FEGA (licencia CC BY 4.0) ---------- */
const MUNIS = {94:'Eslava', 103:'Ezprogui', 110:'Gallipienzo', 216:'Sangüesa'};
const campo = id => (S.campos||[]).find(c=>c.id===id);
const nombreCampo = id => { const c=campo(id); return c ? c.nombre : 'Campo sin identificar'; };
const fmtHa = n => (n||0).toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtRitmo = x => x.toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2})+' ha/h';
const durCorta = ms => { const mn=Math.round(ms/60000), h=Math.floor(mn/60), m=mn%60; return h ? `${h} h${m?` ${m} min`:''}` : `${m} min`; };
const mapa = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
/* nombre del sitio (último confirmado) y, si pulsaste en otro sitio, dónde pulsaste */
const filaPos = (nombre, p) => !nombre ? textoPos(p) : (p && nombre===lugarDe(p)) ? textoPos(p) : `${esc(nombre)}. Pulsaste en: ${textoPos(p)}`;
const textoPos = p => p ? `${lugarDe(p)?esc(lugarDe(p))+', ':''}<a href="${mapa(p)}" target="_blank" rel="noopener">ver en el mapa</a> (a las ${hora(p.t)}${p.prec?`, precisión ${p.prec} m`:''})` : 'sin posición';
/* cada recinto: lista de polígonos; cada polígono: anillo exterior y huecos */
function poligonos(k){ const r=GEO[k]; if(!r) return []; return r.t==='Polygon' ? [r.g] : r.g; }
function dentroAnillo(lon, lat, ring){
  let d=false;
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const [xi,yi]=ring[i], [xj,yj]=ring[j];
    if(((yi>lat)!==(yj>lat)) && lon < (xj-xi)*(lat-yi)/(yj-yi)+xi) d=!d;
  }
  return d;
}
const dentroRecinto = (p, k) => poligonos(k).some(pol=> dentroAnillo(p.lon,p.lat,pol[0]) && !pol.slice(1).some(h=>dentroAnillo(p.lon,p.lat,h)));
/* lugares (granja, bajera y Ayesa): en los de recintos cuenta todo el recinto, huecos incluidos; la bajera es un círculo */
const lugar = id => (S.lugares||[]).find(l=>l.id===id);
const enLugar = l => l.recintos && l.id!=='granja' ? `En ${l.nombre}` : `En la ${l.nombre.toLowerCase()}`;
const dentroLugar = (p, l) => l.centro ? metros(p, l.centro) <= l.radio : l.recintos.some(k=>poligonos(k).some(pol=>dentroAnillo(p.lon,p.lat,pol[0])));
function lugarEn(p){ if(!p) return null; const l=(S.lugares||[]).find(l=>dentroLugar(p,l)); return l ? l.id : null; }
function distLugar(p, l){
  if(dentroLugar(p,l)) return 0;
  if(l.centro) return Math.max(0, metros(p,l.centro)-l.radio);
  let m=Infinity; l.recintos.forEach(k=>poligonos(k).forEach(pol=>pol[0].forEach(([lon,lat])=>{ const d=metros(p,{lat,lon}); if(d<m) m=d; })));
  return m;
}
/* nombre del sitio de una posición: campo o lugar; al entrar o salir el GPS puede caer justo fuera, así que vale hasta 50 m */
function sitioDe(p){
  if(!p) return null;
  const c = campoEn(p); if(c) return nombreCampo(c);
  const l = lugarEn(p); if(l) return lugar(l).nombre;
  let mejor=null, dm=50;
  (S.campos||[]).forEach(x=>{ const d=distCampo(p,x); if(d<=dm){ dm=d; mejor=x.nombre; } });
  (S.lugares||[]).forEach(x=>{ const d=distLugar(p,x); if(d<=dm){ dm=d; mejor=x.nombre; } });
  return mejor;
}
/* 1.4.1.2: fuera de campos y lugares, ubicación aproximada: el pueblo más cercano (OpenStreetMap, se pregunta cuando hay internet)
   o, mientras tanto, la distancia al sitio conocido más cercano */
const clavePueblo = p => `${(+p.lat).toFixed(3)},${(+p.lon).toFixed(3)}`;
function cercanoConocido(p){
  let mejor=null, dm=Infinity;
  (S.campos||[]).forEach(x=>{ const d=distCampo(p,x); if(d<dm){ dm=d; mejor=x.nombre; } });
  (S.lugares||[]).forEach(x=>{ const d=distLugar(p,x); if(d<dm){ dm=d; mejor=x.nombre; } });
  return mejor ? `${fmtDist(dm)} de ${mejor}` : null;
}
function aproxDe(p){ if(!p || p.lat==null) return null; const n=(S.pueblos||{})[clavePueblo(p)]; return n ? `cerca de ${n}` : cercanoConocido(p); }
const lugarDe = p => sitioDe(p) || aproxDe(p);
/* 1.4.1.2: el "Desde" de un tramo de carretera es el último sitio confirmado: si pulsas Carretera fuera de un sitio conocido es que se olvidó darle al salir */
const conSitio = x => x && x.modo==='campo' && ((x.campo && campo(x.campo)) || (x.lugar && lugar(x.lugar)));
function sesionAnterior(ini, tid, excluir){ let m=null; (S.sesiones||[]).forEach(s=>{ if(s!==excluir && s.tractor===tid && s.fin<=ini && (!m || s.fin>m.fin)) m=s; }); return m; }
function origenTramo(d, j, ses){
  const t=d[j], s=sitioDe(t.posIni); if(s) return s;
  const prev=d[j-1];
  if(!prev){
    const a = ses && sesionAnterior(t.inicio, ses.tractor, ses), u = a && a.tramos[a.tramos.length-1];
    return (u && (sitioDe(u.posFin) || (conSitio(u) && sitioTramo(u)) || aproxDe(u.posFin))) || aproxDe(t.posIni);
  }
  if(t.inicio - prev.fin > 60000) return sitioDe(prev.posFin) || aproxDe(prev.posFin) || (conSitio(prev) && sitioTramo(prev)) || aproxDe(t.posIni);
  if(conSitio(prev)) return sitioTramo(prev);
  if(prev.modo==='carretera') return origenTramo(d, j-1, ses);
  return aproxDe(t.posIni);
}
function destinoTramo(d, j){
  const t=d[j], s=sitioDe(t.posFin); if(s) return s;
  const nx=d[j+1], seguido = nx && nx.inicio - t.fin <= 60000;
  if(seguido && conSitio(nx)) return sitioTramo(nx);
  if(seguido && nx.modo==='carretera' && !t.posFin) return destinoTramo(d, j+1);
  return aproxDe(t.posFin);
}
const rutaTramo = (d, j, ses) => { const a=origenTramo(d,j,ses), b=destinoTramo(d,j); return (a||b) ? `${a||'?'} → ${b||'?'}` : ''; };
/* el pueblo se pide a OpenStreetMap (Nominatim) con internet: una petición por segundo como mucho, y solo de las posiciones fuera de sitios conocidos de los últimos 60 días */
let buscandoPueblos = false;
async function resolverPueblos(){
  if(buscandoPueblos || !navigator.onLine) return;
  buscandoPueblos = true; let cambio = false;
  try{
    if(!S.pueblos) S.pueblos = {};
    const desde = Date.now()-60*86400000, pend = new Map();
    const ver = p => { if(p && p.lat!=null && !sitioDe(p)){ const k=clavePueblo(p); if(S.pueblos[k]===undefined && !pend.has(k)) pend.set(k,p); } };
    [...(S.sesiones||[]).filter(x=>x.fin>=desde), ...(S.sesion?[S.sesion]:[])].forEach(x=>x.tramos.forEach(t=>{ ver(t.posIni); ver(t.posFin); }));
    let n = 0;
    for(const [k,p] of pend){
      if(n++ >= 20) break;
      const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), 8000);
      let r;
      try{ r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=es&lat=${p.lat}&lon=${p.lon}`, {signal:ctl.signal}); }
      catch(e){ break; } finally{ clearTimeout(to); }
      if(!r.ok) break;
      const a = ((await r.json())||{}).address || {};
      S.pueblos[k] = a.village || a.hamlet || a.town || a.city || a.municipality || '';
      cambio = true;
      await new Promise(ok=>setTimeout(ok, 1100));
    }
  }catch(e){}
  finally{ buscandoPueblos = false; if(cambio) guardar(); }
}
window.addEventListener('online', ()=>resolverPueblos());
setTimeout(()=>resolverPueblos(), 4000);
const sitioTramo = t => t.lugar && lugar(t.lugar) ? lugar(t.lugar).nombre : nombreCampo(t.campo);
function campoEn(p){ if(!p) return null; const c=(S.campos||[]).find(c=>c.recintos.some(k=>dentroRecinto(p,k))); return c ? c.id : null; }
function metros(a, b){ const r=Math.PI/180, x=(b.lon-a.lon)*r*Math.cos((a.lat+b.lat)/2*r), y=(b.lat-a.lat)*r; return Math.sqrt(x*x+y*y)*6371000; }
function distCampo(p, c){
  if(c.recintos.some(k=>dentroRecinto(p,k))) return 0;
  let m=Infinity; c.recintos.forEach(k=>poligonos(k).forEach(pol=>pol[0].forEach(([lon,lat])=>{ const d=metros(p,{lat,lon}); if(d<m) m=d; })));
  return m;
}
function centroCampo(c){ let x=0,y=0,n=0; c.recintos.forEach(k=>poligonos(k).forEach(pol=>pol[0].forEach(([lon,lat])=>{x+=lon;y+=lat;n++;}))); return n ? {lat:+(y/n).toFixed(6), lon:+(x/n).toFixed(6)} : null; }
const fmtDist = m => m<1000 ? `a ${Math.max(10,Math.round(m/10)*10)} m` : `a ${(m/1000).toLocaleString('es-ES',{maximumFractionDigits:1})} km`;

/* ---------- posición: una sola lectura del GPS al pulsar Carretera, Campo, Pausa o STOP ---------- */
function leerPosicion(cb){
  if(!S.posActiva) return cb(null,'off');
  if(!navigator.geolocation) return cb(null,'nogps');
  let hecho=false; const fin=(p,m)=>{ if(hecho) return; hecho=true; cb(p,m); };
  try{
    navigator.geolocation.getCurrentPosition(
      p=>fin({lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6), prec:Math.round(p.coords.accuracy||0), t:Date.now()}),
      e=>fin(null, e && e.code===1 ? 'permiso' : 'nogps'),
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  }catch(e){ fin(null,'nogps'); }
  setTimeout(()=>fin(null,'nogps'), 30000);
}
/* sin permiso: el aviso sale una vez por sesión; sin GPS: cada vez. Va un poco después, para no tapar el mensaje del botón */
function avisoSinPos(motivo){
  if(motivo==='off') return;
  const ses = S.sesion || S.sesiones[S.sesiones.length-1];
  if(motivo==='permiso'){ if(ses && ses.avisoPermiso) return; if(ses){ ses.avisoPermiso=true; guardar(); } }
  setTimeout(()=>toast(motivo==='permiso' ? 'Guardado sin posición: la app no tiene permiso de ubicación' : 'Guardado sin posición: no hay GPS'), 2400);
}
function registrarPos(trFin, trIni, alLeer){
  leerPosicion((p, motivo)=>{
    if(p){ if(trFin && !trFin.posFin) trFin.posFin = p; if(trIni) trIni.posIni = p; }
    else avisoSinPos(motivo);
    if(trIni && trIni.buscando){ delete trIni.buscando; if(p){ const c=campoEn(p); if(c) asignarCampo(trIni, c); else { const l=lugarEn(p); if(l) trIni.lugar=l; else { const sg=sugerirCampo(p, trIni); if(sg) trIni.sug=sg; } } } }
    if(trIni && trIni.viaNoti){ delete trIni.viaNoti; if(p && (trIni.modo!=='campo' || trIni.campo || trIni.lugar)) delete trIni.revisar; }
    if(alLeer) alLeer(p);
    guardar();
    if(p && !sitioDe(p)) setTimeout(()=>resolverPueblos(), 1500);
    if(seccion==='inicio' && !hojaAbierta) pintarInicio();
  });
}
/* volver a pulsar Campo estando en campo: si estás en otro campo, empieza un tramo nuevo en él */
function comprobarCambioCampo(){
  if(!S.posActiva){ toast('La posición está desactivada en Ajustes'); return; }
  const tr = S.sesion.tramos[S.sesion.tramos.length-1];
  toast('Mirando en qué campo estás…');
  const ahora = Date.now();
  leerPosicion((p, motivo)=>{
    if(!p){ avisoSinPos(motivo); return; }
    const act = S.sesion && !enPausa() && S.sesion.tramos[S.sesion.tramos.length-1];
    if(act!==tr || tr.fin) return;
    const c = campoEn(p), l = c ? null : lugarEn(p);
    if(!c && !l){ toast('No estás dentro de ningún campo conocido'); return; }
    if((c && c===tr.campo) || (l && l===tr.lugar)){ toast(`Sigues en ${c?nombreCampo(c):lugar(l).nombre}`); return; }
    cerrarTramo(ahora); tr.posFin = p;
    abrirTramo('campo', ahora);
    const nt = S.sesion.tramos[S.sesion.tramos.length-1]; nt.posIni = p;
    if(c) asignarCampo(nt, c); else nt.lugar = l;
    vibrar('campo'); guardar(); pintar(); toast(`Ahora en ${c?nombreCampo(c):lugar(l).nombre}`);
  });
}
/* al cambiar o quitar el apero en campo, el tramo nuevo sigue en el mismo campo */
function heredarCampo(){
  const l = S.sesion.tramos, n = l[l.length-1], p = l[l.length-2];
  if(p && n && p.modo==='campo' && n.modo==='campo'){ asignarCampo(n, p.campo||null); if(p.lugar) n.lugar=p.lugar; }
}

/* ---------- trabajos: el tiempo de un apero en un campo, para las hectáreas por hora ---------- */
const DIAS_SEGUIR = 30, CORTO = 0.8, MIN_RATO = 5*60000;
function tramosTodos(){ const l=[]; S.sesiones.forEach(s=>s.tramos.forEach(t=>l.push(t))); if(S.sesion) S.sesion.tramos.forEach(t=>l.push(t)); return l; }
const msTrabajo = id => tramosTodos().reduce((s,t)=> s + (t.trabajo===id && t.modo==='campo' ? Math.max(0,(t.fin||Date.now())-t.inicio) : 0), 0);
const finTrabajo = id => tramosTodos().reduce((m,t)=> t.trabajo===id ? Math.max(m, t.fin||Date.now()) : m, 0);
const trabajoAbierto = id => !!(S.sesion && S.sesion.tramos.some(t=>t.trabajo===id));
function quitarTrabajoSiVacio(id){ if(id && !tramosTodos().some(t=>t.trabajo===id)) S.trabajos = S.trabajos.filter(x=>x.id!==id); }
/* pone el campo a un tramo y lo apunta al trabajo de ese campo y ese apero en la sesión */
function asignarCampo(tr, campoId, sesKey, sinPreguntar){
  const viejo = tr.trabajo;
  tr.campo = campoId || null; delete tr.trabajo;
  const sk = sesKey!=null ? sesKey : (S.sesion && S.sesion.inicio);
  if(campoId && tr.apero && sk!=null){
    const fm = tr.forma || null;
    let tb = S.trabajos.find(x=>x.campo===campoId && x.apero===tr.apero && (x.forma||null)===fm && x.ses===sk);
    if(!tb){
      tb = {id:nuevoId('tb'), campo:campoId, apero:tr.apero, ses:sk, creado:Date.now()};
      if(fm) tb.forma = fm;
      S.trabajos.push(tb);
      if(!sinPreguntar){
        const prev = S.trabajos.filter(x=>x!==tb && !x.unido && x.campo===campoId && x.apero===tr.apero && (x.forma||null)===fm && x.ses!==sk && msTrabajo(x.id)>0 && finTrabajo(x.id) >= Date.now()-DIAS_SEGUIR*DIA)
          .sort((a,b)=>finTrabajo(b.id)-finTrabajo(a.id))[0];
        if(prev) setTimeout(()=>preguntarSeguir(tb, prev), 400);
      }
    }
    tr.trabajo = tb.unido || tb.id;
  }
  if(viejo && viejo!==tr.trabajo) quitarTrabajoSiVacio(viejo);
}
function preguntarSeguir(tb, prev, intentos){
  intentos = intentos||0;
  if(hojaAbierta){ if(intentos<40) setTimeout(()=>preguntarSeguir(tb, prev, intentos+1), 1500); return; }
  if(!S.sesion || tb.unido || !S.trabajos.includes(tb)) return;
  const c = campo(tb.campo), a = apero(tb.apero);
  abrirHoja(`<h3>¿Sigues con lo de ${esc(c?c.nombre:'este campo')} del otro día?</h3>
    <p>El ${fechaCorta(finTrabajo(prev.id))} estuviste ${durCorta(msTrabajo(prev.id))} en este campo con ${esc(a?a.nombre:'este apero')}. Si sigues con aquello, se juntan los ratos para calcular las hectáreas por hora.</p>
    <div class="acciones"><button id="no">No, es otro trabajo</button><button class="ok" id="si">Sí, sigo</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        tb.unido = prev.id;
        tramosTodos().forEach(t=>{ if(t.trabajo===tb.id) t.trabajo=prev.id; });
        guardar(); cerrarHoja(); pintar(); toast('Juntado con lo del otro día');
      };
  });
}
/* ritmo de un apero en un campo: un rato de menos del 80 % de lo normal queda a medias y no cuenta */
function ritmo(campoId, aperoId, forma){
  const c = campo(campoId), fm = forma || null;
  const todos = S.trabajos.filter(x=>x.campo===campoId && x.apero===aperoId && (x.forma||null)===fm && !x.unido).map(x=>({x, ms:msTrabajo(x.id), abierto:trabajoAbierto(x.id)})).filter(o=>o.ms>0);
  /* los ratos de menos de 5 minutos (un Campo pulsado sin querer) no cuentan */
  const l = todos.filter(o=>!o.abierto && o.ms>=MIN_RATO);
  const mediana = a => { const s=[...a].sort((p,q)=>p-q), n=s.length; return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
  /* 1.4.2: los trabajos hechos antes de juntar o partir campos (x.parte) llevan la superficie de la parte donde se hicieron;
     ni se marcan a medias ni sirven para decidir si uno nuevo lo está */
  l.forEach(o=>{ if(o.x.parte){ o.medias=false; return; } const otros=l.filter(q=>q!==o && !q.x.parte).map(q=>q.ms); o.medias = otros.length>0 && o.ms < CORTO*mediana(otros); });
  const ok = l.filter(o=>!o.medias), h = ok.reduce((s,o)=>s+o.ms,0)/H;
  const haDe = o => (o.x.ha!=null ? o.x.ha : (c ? c.ha : 0)) * (o.x.pasadas||1); /* nota 29: superficie × pasadas */
  return {campo:campoId, apero:aperoId, forma:fm, veces:ok.length, medias:l.length-ok.length, enCurso:todos.some(o=>o.abierto), hMedia: ok.length ? h/ok.length : null, haH: c && h>0 ? ok.reduce((s,o)=>s+haDe(o),0)/h : null};
}
const unicos = a => [...new Set(a)];
const ritmosCampo = cid => unicos(S.trabajos.filter(x=>x.campo===cid && x.apero && !x.unido).map(x=>x.apero+'|'+(x.forma||''))).map(k=>{ const [a,f]=k.split('|'); return ritmo(cid,a,f||null); }).filter(r=>r.veces||r.medias||r.enCurso).sort((a,b)=>b.veces-a.veces);
const ritmosApero = aid => unicos(S.trabajos.filter(x=>x.apero===aid && x.campo && !x.unido).map(x=>x.campo+'|'+(x.forma||''))).map(k=>{ const [c,f]=k.split('|'); return {c,f}; }).filter(o=>campo(o.c)).map(o=>ritmo(o.c,aid,o.f||null)).filter(r=>r.veces||r.medias||r.enCurso).sort((a,b)=>b.veces-a.veces);
function filaRitmo(nombre, r){
  const partes = [];
  partes.push(r.veces ? `${r.veces===1?'1 vez':r.veces+' veces'}, ${durCorta(r.hMedia*H)} de media` : 'Ninguna vez completa');
  if(r.medias) partes.push(`${r.medias} a medias`);
  if(r.enCurso) partes.push('uno en curso');
  return `<div class="mov"><span class="fx"><span class="n">${esc(nombre)}</span><span class="s">${partes.join(', ')}</span></span><span class="der">${r.haH ? fmtRitmo(r.haH) : '—'}</span></div>`;
}

/* ---------- elegir o cambiar el campo del tramo en curso ---------- */
/* 1.4.1.4 (nota 20): si al pulsar Campo no caes dentro de ningún campo, sugiere uno.
   Primero, donde elegiste tú el campo otras veces (a menos de 75 m); si no, el campo más cercano a menos de 100 m. Nunca se pone sin confirmar. */
const SUG_APR = 75, SUG_CERCA = 100;
function sugerirCampo(p, excluir){
  if(!p) return null;
  const votos = {};
  tramosTodos().forEach(t=>{
    if(t===excluir || t.modo!=='campo' || !t.campo || !campo(t.campo) || !t.posIni) return;
    if(campoEn(t.posIni)===t.campo) return;
    const d = metros(p, t.posIni);
    if(d<=SUG_APR && (!votos[t.campo] || d<votos[t.campo].d)) votos[t.campo] = {n:(votos[t.campo]?votos[t.campo].n:0)+1, d};
    else if(d<=SUG_APR) votos[t.campo].n++;
  });
  const apr = Object.entries(votos).sort((a,b)=> b[1].n-a[1].n || a[1].d-b[1].d)[0];
  if(apr) return apr[0];
  let mejor=null, dm=SUG_CERCA;
  (S.campos||[]).forEach(c=>{ const d=distCampo(p,c); if(d<=dm){ dm=d; mejor=c.id; } });
  return mejor;
}
function hojaSugerencia(){
  const tr = S.sesion && !enPausa() && S.sesion.tramos[S.sesion.tramos.length-1];
  if(!tr || tr.modo!=='campo' || !tr.sug || !campo(tr.sug)) return hojaElegirCampo();
  const c = campo(tr.sug), d = tr.posIni ? distCampo(tr.posIni, c) : null;
  abrirHoja(`<h3>¿Estás en ${esc(c.nombre)}?</h3>
    <p>La posición no cae dentro de ningún campo${d!=null?`; ${esc(c.nombre)} está ${d<1?'justo al lado':fmtDist(d)}`:''}.</p>
    <div class="acciones"><button id="otro">Elegir otro</button><button class="ok" id="si">Sí, estoy aquí</button></div>`,()=>{
      $('#otro').onclick=()=>{ cerrarHoja(); setTimeout(hojaElegirCampo, 150); };
      $('#si').onclick=()=>{
        cerrarHoja();
        if(!S.sesion || S.sesion.tramos[S.sesion.tramos.length-1]!==tr || tr.fin) return;
        delete tr.sug; delete tr.lugar;
        asignarCampo(tr, c.id);
        guardar(); pintar(); toast(`Campo: ${c.nombre}`);
      };
  });
}
function hojaElegirCampo(){
  const tr = S.sesion && !enPausa() && S.sesion.tramos[S.sesion.tramos.length-1];
  if(!tr || tr.modo!=='campo') return;
  const p = tr.posIni;
  const l = S.campos.map(c=>({c, d: p ? distCampo(p,c) : null}));
  if(p) l.sort((a,b)=>a.d-b.d);
  if(tr.sug){ const i=l.findIndex(x=>x.c.id===tr.sug); if(i>0) l.unshift(l.splice(i,1)[0]); }
  abrirHoja(`<h3>¿En qué campo estás?</h3>
    <p>${p ? 'Primero, los más cercanos a donde pulsaste Campo.' : 'No hay posición de este tramo, así que salen en el orden de la lista.'}</p>
    ${l.map(({c,d})=>`<button class="opc ${c.id===tr.campo?'sel':''}" data-c="${c.id}"><span class="ico t">${I.parcela}</span><span><span class="n">${esc(c.nombre)}</span><br><span class="s">${c.id===tr.sug?'Sugerido. ':''}${fmtHa(c.ha)} ha${d==null?'':d===0?', estás dentro':', '+fmtDist(d)}</span></span></button>`).join('')}
    <button class="opc ${!tr.campo?'sel':''}" data-c=""><span><span class="n">Campo sin identificar</span><br><span class="s">No cuenta para las hectáreas por hora</span></span></button>
    <div class="acciones"><button id="no">Cancelar</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#hoja').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
        const id = b.dataset.c || null;
        cerrarHoja();
        if(id===(tr.campo||null) && !tr.buscando && !tr.lugar) return;
        delete tr.buscando; delete tr.lugar; delete tr.sug;
        asignarCampo(tr, id);
        guardar(); pintar(); toast(id ? `Campo: ${nombreCampo(id)}` : 'Campo sin identificar');
      });
  });
}

/* ---------- 1.4.2: campos de Luca (migración con confirmación) ---------- */
const UNIONES_142 = {cp19:'cp17', cp20:'cp18', cp26:'cp24'};
const nombreAperoForma = (aid, fid) => { const a=apero(aid); if(!a) return 'Sin apero'; const f = fid && (a.formas||[]).find(x=>x.id===fid); return f ? f.nombre : a.nombre; };
const fmtHa3 = n => (n||0).toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:3});
/* aplica el cambio a un estado X: sobre S al confirmar, y sobre una copia para contar lo que se mueve */
function transformarCamposLuca(X){
  const viejos = X.campos||[], vv = id => viejos.find(c=>c.id===id);
  const nuevoDe = id => CAMPOS_BASE.find(c=>c.id===id);
  const st = {tramos:0, trabajos:0};
  const haParte = {};
  ['cp17','cp18','cp24','cp19','cp20','cp26'].forEach(id=>{ const c=vv(id); if(c) haParte[id]=c.ha; });
  /* notas: al juntar, una detrás de otra con el nombre de la parte delante; si solo una tiene, se queda tal cual */
  const nota = {};
  viejos.forEach(c=>{ if(c.nota) nota[c.id]=c.nota; });
  [['cp17','cp19'],['cp18','cp20'],['cp24','cp26']].forEach(([a,b])=>{
    const ca=vv(a), cb=vv(b);
    if(ca && cb && ca.nota && cb.nota) nota[a] = `${ca.nombre}: ${ca.nota}\n\n${cb.nombre}: ${cb.nota}`;
    else if(cb && cb.nota && !(ca && ca.nota)) nota[a] = cb.nota;
    delete nota[b];
  });
  if(!X.trabajos) X.trabajos = [];
  const sesiones = [...(X.sesiones||[])]; if(X.sesion) sesiones.push(X.sesion);
  const trab = id => X.trabajos.find(x=>x.id===id);
  /* Mosquera alta: cada tramo va al campo donde cae su posición; sin posición, o a más de 50 m de los dos, a Carr. Javier grande */
  const eligeMosq = t => {
    const p = t.posIni || t.posFin; if(!p) return 'cp28';
    const d28 = distCampo(p, nuevoDe('cp28')), d33 = distCampo(p, nuevoDe('cp33'));
    if(d28===0) return 'cp28'; if(d33===0) return 'cp33';
    return (Math.min(d28,d33)<=50 && d33<d28) ? 'cp33' : 'cp28';
  };
  sesiones.forEach(ses=>(ses.tramos||[]).forEach(t=>{
    if(t.campo && UNIONES_142[t.campo]){ t.campo = UNIONES_142[t.campo]; st.tramos++; }
    if(t.sug && UNIONES_142[t.sug]) t.sug = UNIONES_142[t.sug];
    if(t.campo==='cp28' && eligeMosq(t)==='cp33'){
      t.campo = 'cp33'; st.tramos++;
      const viejo = t.trabajo ? trab(t.trabajo) : null;
      if(viejo){
        const clave = viejo.id+'|cp33';
        let nb = X.trabajos.find(x=>x.clave142===clave);
        if(!nb){
          nb = {id:'tb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), campo:'cp33', apero:viejo.apero, ses:viejo.ses, creado:viejo.creado||Date.now(), ha:nuevoDe('cp33').ha, parte:true, clave142:clave};
          if(viejo.forma) nb.forma = viejo.forma;
          X.trabajos.push(nb);
        }
        t.trabajo = nb.id;
      }
    }
  }));
  /* trabajos: al juntar, cada uno conserva la superficie de la parte donde se hizo; los de Mosquera alta, la de su parte */
  X.trabajos.forEach(tb=>{
    if(UNIONES_142[tb.campo] || ['cp17','cp18','cp24'].includes(tb.campo)){
      if(tb.ha==null && haParte[tb.campo]!=null){ tb.ha = haParte[tb.campo]; tb.parte = true; st.trabajos++; }
      if(UNIONES_142[tb.campo]) tb.campo = UNIONES_142[tb.campo];
    } else if(tb.campo==='cp28' && tb.ha==null){ tb.ha = nuevoDe('cp28').ha; tb.parte = true; st.trabajos++; }
    delete tb.clave142;
  });
  X.campos = CAMPOS_BASE.map(n=>{ const v=vv(n.id); const c={...(v||{}), ...n, recintos:[...n.recintos]}; delete c.nota; if(nota[n.id]) c.nota=nota[n.id]; return c; });
  X.campos142 = true;
  return st;
}

function filasCamposLuca(){
  const vv = id => (S.campos||[]).find(c=>c.id===id), filas = [];

    const v = vv(n.id), det = [];
    if(!v) det.push(n.id==='cp33' ? 'Sale de partir Mosquera alta; dibujo de Luca' : 'Campo nuevo; dibujo de Luca');
    else {
      if(v.nombre!==n.nombre) det.push(`Antes: «${v.nombre}»`);
      if(Math.abs((v.ha||0)-n.ha)>0.0005) det.push(`${fmtHa3(v.ha)} → ${fmtHa3(n.ha)} ha`);
      const ab = Object.keys(UNIONES_142).find(k=>UNIONES_142[k]===n.id);

function horasEntre(d0, d1){
  const por = {campo:0, carretera:0, nose:0, parado:0};
  todasSesiones().forEach(({s})=>s.tramos.forEach(t=>{
    const a=Math.max(t.inicio,d0), b=Math.min(t.fin,d1);
    if(b>a){ const k = por[t.modo]!=null ? t.modo : 'carretera'; por[k]+=b-a; }
  }));
  por.total = por.campo+por.carretera+por.nose; /* el parado no entra en el total trabajado */
  return por;
}
function frasePartes(p, km){
  const l = [];
  if(p.campo>=60000) l.push(`${durTxt(p.campo)} en campo`);
  if(p.carretera>=60000) l.push(`${durTxt(p.carretera)} en carretera${km>=0.1?` (${kmTxt(km)})`:''}`);
  if(p.nose>=60000) l.push(`${durTxt(p.nose)} sin saber`);
  if(p.parado>=60000) l.push(`${durTxt(p.parado)} parado`);
  return l.length>1 ? l.slice(0,-1).join(', ')+' y '+l[l.length-1] : (l[0]||'');
}
/* Inicio: lo que llevas hoy, también de las sesiones ya cerradas */
function pintarHoy(){
  const el = $('#hoyl'); if(!el) return;
  const d0 = inicioDia(Date.now()), p = horasEntre(d0, Date.now());
  if(p.total < 60000){ el.innerHTML = ''; el.style.display='none'; return; }
  el.style.display='';
  el.innerHTML = `Hoy llevas <b>${durTxt(p.total)}</b>: ${frasePartes(p, kmEntre(d0, Date.now()))}`;
}
/* Días: total del día, arriba de la agenda */
function resumenDia(bl){
  const por = {campo:0, carretera:0, nose:0, parado:0};
  bl.forEach(x=>{ const k = por[x.t.modo]!=null ? x.t.modo : 'carretera'; por[k]+=x.b-x.a; });
  const tot = por.campo+por.carretera+por.nose;
  const partes = [['campo','Campo',por.campo],['carretera','Carretera',por.carretera]];
  if(por.nose) partes.push(['nose','Sin saber',por.nose]);
  if(por.parado) partes.push(['parado','Parado',por.parado]);
  return `<div class="resu" aria-label="Horas del día"><div class="tot"><span class="v">${durTxt(tot)}</span><br><span class="k">Total trabajado este día</span></div><div class="partes" style="grid-template-columns:repeat(${partes.length},1fr)">${partes.map(([c,k,v])=>`<div class="${c}"><span class="v">${durTxt(v)}</span><br><span class="k">${k}</span></div>`).join('')}</div></div>`;
}

/* última vez: el tramo más reciente que cumple la condición, con su sesión */
function ultimoTramo(cond){
  let m = null;
  todasSesiones().forEach(({s,i})=>s.tramos.forEach(t=>{ if(cond(t) && (!m || t.fin>m.t.fin)) m={s,t,enCurso:i===-1}; }));
  return m;
}
const fechaLarga = ms => { const d=new Date(ms), mismo=d.getFullYear()===new Date().getFullYear(); return d.toLocaleDateString('es-ES', mismo?{day:'numeric',month:'long'}:{day:'numeric',month:'long',year:'numeric'}); };
function hace(ms){
  const n = Math.round((inicioDia(Date.now()) - inicioDia(ms))/DIA);
  return n<=0 ? 'hoy' : n===1 ? 'ayer' : `hace ${n} días`;
}
const cuando = ms => { const h=hace(ms); return h==='hoy'?'Hoy':h==='ayer'?'Ayer':`${fechaLarga(ms)} (${h})`; };
function ultimaCampo(cid){
  const u = ultimoTramo(t=>t.modo==='campo' && t.campo===cid);
  if(!u) return null;
  const ms = u.s.tramos.filter(t=>t.modo==='campo' && t.campo===cid).reduce((x,t)=>x+Math.max(0,t.fin-t.inicio),0);
  return {fin:u.t.fin, apero:u.t.apero, ms, enCurso:u.enCurso};
}
function textoUltimaCampo(cid){
  const u = ultimaCampo(cid);
  if(!u) return 'Todavía no lo has trabajado con la app';
  return `${u.enCurso ? 'Ahora' : cuando(u.fin)}, con ${esc(nombreApero(u.apero))}, ${durTxt(u.ms)}`;
}
function textoUltimaApero(aid){
  const u = ultimoTramo(t=>t.apero===aid);
  if(!u) return 'Todavía no lo has usado con la app';
  const suyos = u.s.tramos.filter(t=>t.apero===aid);
  const ms = suyos.reduce((x,t)=>x+Math.max(0,t.fin-t.inicio),0);
  const enCampo = suyos.filter(t=>t.modo==='campo' && ((t.campo && campo(t.campo)) || (t.lugar && lugar(t.lugar))));
  const donde = enCampo.length ? 'en '+unicos(enCampo.map(sitioTramo)).map(esc).join(', ') : 'en carretera';
  return `${u.enCurso ? 'Ahora' : cuando(u.t.fin)}, ${donde}, ${durTxt(ms)}`;
}

/* Campos: lugares al final de la lista, con su mapa */
function filaLugar(l){
  const ctr = l.centro || (l.recintos ? centroCampo(l) : null);
  const tam = l.centro ? `círculo de ${Math.round(l.radio*2)} m` : `${fmtHa(l.recintos.reduce((x,k)=>x+(GEO[k]?GEO[k].s:0),0))} ha`;
  const u = ultimoTramo(t=>t.lugar===l.id);
  const aqui = !S.sesion ? S.tractores.filter(t=>t.dondeQueda && t.dondeQueda.lugar===l.id).map(t=>t.nombre) : [];
  const partes = [tam, u ? (u.enCurso ? 'ahora' : hace(u.t.fin)) : null, aqui.length ? `aquí está ${aqui.map(esc).join(' y ')}` : null].filter(Boolean);
  const dentro = `<span class="ico a">${I.home}</span><span><span class="n">${esc(l.nombre)}</span><br><span class="s">${partes.join(' · ')}${ctr?' · ver en el mapa':''}</span></span>`;
  return ctr ? `<a class="maq" href="${mapa(ctr)}" target="_blank" rel="noopener">${dentro}</a>` : `<div class="maq">${dentro}</div>`;
}
function hojaNotaCampo(id){
  const c = campo(id);
  abrirHoja(`<h3>Nota de ${esc(c.nombre)}</h3><p>Lo que quieras recordar de este campo: entradas, piedras, zonas húmedas…</p>
    <textarea id="tn" rows="5" placeholder="Entrada por el camino de abajo">${esc(c.nota||'')}</textarea>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{ const v=$('#tn').value.trim(); if(v) c.nota=v; else delete c.nota; guardar(); cerrarHoja(); pintar(); toast(v?'Nota guardada':'Nota quitada'); };
  });
}

/* Combustible: precio del último gasoil y del último AdBlue, comparado con la compra anterior */
function textoPrecios(){
  const compras = prod => {
    const l = S.repostajes.filter(r=>r.producto===prod && r.origen!=='dep' && r.importe>0 && r.litros>0).map(r=>({f:r.fecha, p:r.importe/r.litros, d:'cooperativa'}));
    if(prod==='gasoil') S.deposito.movs.filter(m=>(m.tipo==='compra'||m.tipo==='inicio') && m.importe>0 && m.litros>0).forEach(m=>l.push({f:m.fecha, p:m.importe/m.litros, d:'pedido a la bajera'}));
    return l.sort((a,b)=>b.f-a.f);
  };
  const linea = (nom, l) => {
    if(!l.length) return '';
    const [u, ant] = l, dif = ant ? Math.round((u.p-ant.p)*100) : 0;
    const cmp = !ant ? '' : dif===0 ? ', igual que la vez anterior' : `, ${Math.abs(dif)} ${Math.abs(dif)===1?'céntimo':'céntimos'} ${dif>0?'más':'menos'} que la vez anterior`;
    return `<p class="precio">${nom}: <b>${eurL(u.p)}</b> (${fechaLarga(u.f)}, ${u.d})${cmp}</p>`;
  };
  return linea('Último gasoil', compras('gasoil')) + linea('Último AdBlue', compras('adblue'));
}

/* Avisos: todo lo amarillo y rojo de todas las máquinas, también lo del taller, por cuándo toca */
const maqExiste = id => !!(tractor(id) || apero(id));
const listaAvisos = () => S.mants.filter(m=>maqExiste(m.maq)).map(info).filter(x=>x.e || marcaM(x.m));
function cuentaAvisos(){ const l = listaAvisos(); return {n:l.length + averiasPendTractor().length, r:l.some(x=>x.e==='r')}; }
/* horas al día que ha trabajado una máquina en los últimos 30 días */
function ritmoDiario(id){
  const d0 = Date.now()-30*DIA, esT = !!tractor(id); let h = 0;
  todasSesiones().forEach(({s})=>s.tramos.forEach(t=>{ if(t.modo!=='parado' && (esT ? t.tractor===id : t.apero===id) && t.fin>d0) h += (t.fin-Math.max(t.inicio,d0))/H; }));
  return h/30;
}
function pintarAvisos(){
  const rit = {};
  const l = listaAvisos().map(x=>{
    const kr = x.m.reloj+'|'+x.m.maq, rd = rit[kr] ?? (rit[kr] = x.m.reloj==='ha' ? haDiario(x.m.maq) : ritmoDiario(x.m.maq));
    let dh = Infinity;
    if(isFinite(x.r)) dh = x.r<0 ? (rd>0 ? x.r/rd : -1e6+x.r) : (rd>0 ? x.r/rd : Infinity);
    x.dias = Math.min(dh, x.d); x.porHoras = dh < x.d && isFinite(dh) && x.r>=0 && rd>0;
    x.g = x.e==='r' ? 0 : x.e==='y' ? 1 : 2;
    return x;
  }).sort((a,b)=> a.g-b.g || (a.dias===b.dias ? (a.r-b.r)||porUrgencia(a,b) : a.dias-b.dias));
  const fila = x => `<div class="avw"><button class="mov" data-m="${x.m.id}" style="align-items:center"><span class="dot ${x.e||'n'}"></span>${marcaM(x.m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}<span class="fx"><span class="n">${esc(x.m.nombre)}${x.m.quien==='taller'?'<span class="tag">Taller</span>':''}</span><span class="s" style="font-size:13px;color:var(--text2)">${esc(nombreMaq(x.m.maq))}${x.porHoras?`, unos ${fmtDias(x.dias)} a tu ritmo`:''}${!x.e&&marcaM(x.m)?', manual: le tocaría ya':''}</span></span><span class="der">${textoMant(x.m)}</span></button><div class="ahw"><button class="ahora" data-ahora="${x.m.id}">Hecho ahora</button></div></div>`;
  const r = l.filter(x=>x.e==='r').length, y = l.filter(x=>x.e==='y').length;
  $('#vista').innerHTML = `<h2 class="secc" style="margin-top:6px">${l.length ? [r?`${r} ${r===1?'pasado':'pasados'}`:'', y?`${y} a punto`:'', l.length-r-y?`${l.length-r-y} con M`:''].filter(Boolean).join(', ') : 'Avisos'}</h2>
    ${botonTallerGrande()}
    <div class="lista">${l.length ? l.map(fila).join('') : '<div class="vacio" style="padding:16px">Todo al día en todas tus máquinas.</div>'}</div>
    ${averiasPendTractor().length ? `<h2 class="secc">Averías pendientes (${averiasPendTractor().length})</h2><div class="lista">${averiasPendTractor().sort((a,b)=>b.fecha-a.fecha).map(filaAveria).join('')}</div>` : ''}
    <p class="nota">Todas tus máquinas y aperos, también lo del taller. Primero lo pasado y después lo que está a punto, por cuándo toca: lo que va por horas se calcula con lo que has trabajado esa máquina en los últimos 30 días. Toca uno para verlo.</p>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>hojaDetalle(b.dataset.m));
  document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>hojaAveria(b.dataset.av));
  $('#btaller').onclick=()=>abrirTallerDe(S.sel.tractor && tractor(S.sel.tractor) ? S.sel.tractor : (S.tractores[0]||{}).id);
  enlazarAhora();
}

let cfg = {url:'', clave:''}, sync = {pendiente:false, ultimo:null, error:null, cambios:0};
try{ cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFG))||{}); }catch(e){}
try{ sync = Object.assign(sync, JSON.parse(localStorage.getItem(SYN))||{}); }catch(e){}
function guardarSync(){ try{ localStorage.setItem(SYN, JSON.stringify(sync)); }catch(e){} }
let tSubir=null, subiendo=false;
function marcarPendiente(){
  sync.pendiente = true; sync.cambios++; guardarSync(); pintarSync();
  clearTimeout(tSubir); tSubir = setTimeout(subir, 1500);
}
async function llamar(cuerpo){
  const r = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...cuerpo, clave:cfg.clave})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Error desconocido');
  return j;
}
/* 1.4.2.3: control de versiones con Drive. Cada subida lleva un número (S.rev) y qué móvil la hizo.
   Antes de subir se mira Drive: si cambió desde la última vez que este móvil sincronizó, no se pisa: se pregunta.
   Al abrir la app sin nada pendiente, si Drive es más nuevo, se baja solo. No junta datos de dos móviles. */
const DISP = (()=>{ let d=null; try{ d=localStorage.getItem('mant-disp'); if(!d){ d='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('mant-disp', d); } }catch(e){ d='m0'; } return d; })();
function guardarLocal(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
async function leerDrive(){
  const j = await llamar({accion:'leer'});
  const e = j.estado || null;
  return {estado:e, rev: e && e.rev ? e.rev : 0, disp: e ? e.revDisp : null, fecha: e ? e.revFecha : null};
}
const tieneDatos = e => !!(e && ((e.tractores && e.tractores.length) || (e.aperos && e.aperos.length > 1)));
function hayConflicto(dr){
  if(!dr.estado) return false;
  if(sync.base == null){
    if(!sync.ultimo) return tieneDatos(dr.estado);   /* móvil que nunca ha sincronizado: no pisar lo de Drive */
    return dr.rev > 0 && dr.disp !== DISP;            /* móviles de antes de la 1.4.2.3 */
  }
  return dr.rev > sync.base;
}
async function subir(){
  if(!cfg.url || !cfg.clave || !sync.pendiente){ pintarSync(); return; }
  if(!navigator.onLine){ pintarSync(); return; }
  if(subiendo || sync.conflicto) { pintarSync(); return; }
  subiendo = true; pintarSync();
  const n = sync.cambios;
  try{
    const dr = await leerDrive();
    if(hayConflicto(dr)){
      subiendo = false; sync.conflicto = {rev:dr.rev, disp:dr.disp||null, fecha:dr.fecha||null}; sync.error = null; guardarSync(); pintarSync();
      hojaConflicto(dr); return;
    }
    S.rev = dr.rev + 1; S.revDisp = DISP; S.revFecha = Date.now(); guardarLocal();
    await llamar({accion:'guardar', estado:S});
    sync.base = S.rev; sync.ultimo = Date.now(); sync.error = null;
    if(sync.cambios===n) sync.pendiente = false;
  }catch(e){ sync.error = String(e.message||e); }
  subiendo = false; guardarSync(); pintarSync();
  if(sync.pendiente && !sync.error && !sync.conflicto) setTimeout(subir, 500);
}
/* sustituir los datos de este móvil por los de Drive (se guarda antes una copia de los de este móvil) */
function aplicarDrive(dr, texto){
  try{ localStorage.setItem('mant-copia-antes-drive', JSON.stringify({fecha:Date.now(), estado:S})); }catch(e){}
  if(typeof rutaAb!=='undefined'){ rutaAb = null; rutaUlt = null; rutaFin = null; }
  S = dr.estado; migrar();
  sync.base = dr.rev; sync.pendiente = false; sync.conflicto = null; sync.error = null; sync.ultimo = Date.now();
  guardarSync(); guardarLocal();
  if(seccion==='maquinas') maqFicha = null; if(seccion==='campos') campoFicha = null;
  pintar(); pintarSync(); if(typeof notiSesion==='function') notiSesion(true);
  toast(texto || 'Puesto al día desde Drive', 3500);
}
let comprobando = false, ultComprobar = 0;
async function comprobarDrive(forzar){
  if(!cfg.url || !cfg.clave || !navigator.onLine || comprobando || subiendo) return;
  if(sync.conflicto){ pintarSync(); return; }
  if(sync.pendiente){ subir(); return; }
  if(!forzar && Date.now()-ultComprobar < 2*MIN1) return;
  comprobando = true; ultComprobar = Date.now();
  const n = sync.cambios;
  try{
    const dr = await leerDrive();
    if(dr.estado && !sync.pendiente && sync.cambios===n){
      let bajar = false;
      if(sync.base == null){
        if(dr.rev > 0 && dr.disp !== DISP && (sync.ultimo || !tieneDatos(S))) bajar = true;
        else if(!sync.ultimo && tieneDatos(S) && tieneDatos(dr.estado)) { sync.conflicto = {rev:dr.rev, disp:dr.disp||null, fecha:dr.fecha||null}; guardarSync(); pintarSync(); if(!hojaAbierta) hojaConflicto(dr); }
        else if(sync.ultimo || !tieneDatos(S)) { if(!tieneDatos(S)) bajar = true; else { sync.base = dr.rev; guardarSync(); } }
      } else if(dr.rev > sync.base) bajar = true;
      if(bajar){
        if(hojaAbierta) ultComprobar = 0;   /* con una ventana abierta, se deja para luego */
        else aplicarDrive(dr, 'Puesto al día desde Drive');
      }
    }
  }catch(e){}
  comprobando = false;
}
const quienDrive = c => c && c.disp && c.disp===DISP ? 'este móvil' : 'otro móvil';
async function hojaConflicto(dr){
  if(hojaAbierta && !$('#confl')) { pintarSync(); return; }
  if(!dr){
    abrirHoja(`<h3 id="confl">Cambios en dos sitios</h3><p class="nota">Mirando Drive…</p>`);
    try{ dr = await leerDrive(); }catch(e){ abrirHoja(`<h3 id="confl">Cambios en dos sitios</h3><p class="nota">No se ha podido leer Drive: ${esc(String(e.message||e))}</p><div class="acciones"><button id="cn">Cerrar</button></div>`,()=>{ $('#cn').onclick=()=>cerrarHoja(); }); return; }
    if(!hayConflicto(dr)){ sync.conflicto = null; guardarSync(); cerrarHoja(); subir(); toast('Ya no hay conflicto: subiendo'); return; }
  }
  const cuando = dr.fecha ? `${fechaCorta(dr.fecha)} a las ${hhmm(dr.fecha)}` : 'antes';
  const vacio = !tieneDatos(S);
  abrirHoja(`<h3 id="confl">${vacio ? 'Drive ya tiene datos' : 'Cambios en dos sitios'}</h3>
    <p>${vacio ? `Este móvil todavía no tiene datos y Drive sí (de ${quienDrive(dr)}, ${esc(cuando)}). Lo normal es quedarse con los de Drive.` : `Este móvil tiene cosas sin subir y Drive tiene una versión más nueva, de ${quienDrive(dr)} (${esc(cuando)}). La app no puede juntarlas: elige cuál se queda.`}</p>
    <p class="nota">La que no elijas se pierde. Si eliges Drive, se guarda en este móvil una copia de lo que tenía.</p>
    <div class="acciones" style="flex-direction:column"><button class="${vacio?'':'ok'}" id="cfM">Quedarme con los de este móvil${vacio?' (borra Drive)':''}</button><button class="${vacio?'ok':''}" id="cfD">Quedarme con los de Drive</button><button id="cfN">Ahora no</button></div>`,()=>{
    $('#cfM').onclick=()=>{ sync.base = dr.rev; sync.conflicto = null; sync.pendiente = true; sync.cambios++; guardarSync(); cerrarHoja(); subir(); toast('Se quedan los de este móvil: subiendo'); };
    $('#cfD').onclick=()=>{ cerrarHoja(); aplicarDrive(dr, 'Se quedan los de Drive. Lo de este móvil queda en una copia'); };
    $('#cfN').onclick=()=>{ cerrarHoja(); toast('No se sube nada hasta que elijas. Toca la nube para elegir', 3500); };
  });
}
function pintarSync(){
  const b = $('#sync'); if(!b) return;
  let t, ok=false;
  if(!cfg.url || !cfg.clave) t='Sin conectar a Drive';
  else if(sync.conflicto) t='Cambios en este móvil y en Drive: toca para elegir';
  else if(subiendo) t='Subiendo\u2026';
  else if(sync.pendiente && !navigator.onLine) t='Sin cobertura, pendiente de subir';
  else if(sync.pendiente && sync.error) t='Error al subir, toca para ver';
  else if(sync.pendiente) t='Pendiente de subir';
  else { t='Todo subido'; ok=true; }
  b.classList.toggle('ok', ok); b.classList.toggle('pend', !ok && !!(cfg.url && cfg.clave));
  b.setAttribute('aria-label', 'Drive: '+t); b.title = t;
}
function textoSync(){
  if(!cfg.url || !cfg.clave) return 'Sin conectar a Drive';
  if(sync.conflicto) return 'Cambios en este móvil y en Drive, sin elegir';
  if(subiendo) return 'Subiendo\u2026';
  if(sync.pendiente && !navigator.onLine) return 'Sin cobertura, pendiente de subir';
  if(sync.pendiente && sync.error) return 'Error al subir';
  if(sync.pendiente) return 'Pendiente de subir';
  return 'Todo subido';
}
window.addEventListener('online', ()=>{ pintarSync(); comprobarDrive(true); });
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') comprobarDrive(); });

const notiPermiso = () => ('Notification' in window) ? Notification.permission : 'no';
function textoNoti(){
  const p = notiPermiso();
  if(p==='no') return 'Este navegador no permite notificaciones.';
  if(p==='denied') return 'Android tiene bloqueadas las notificaciones de esta app. Para verla, permítelas en los ajustes de notificaciones del móvil para esta app.';
  if(p==='default') return 'Desactivada. Mientras haya una sesión abierta, sale en el móvil, también con la pantalla bloqueada, y dice si estás en campo, en carretera o en pausa.';
  return S.notiSesion ? 'Activada. Sale mientras haya una sesión abierta. Si la quitas deslizando, vuelve a salir al abrir la app.' : 'Desactivada.';
}

/* ============ 1.4.2 parte 3: agenda de arrastrar, sesión olvidada y sesiones a mano ============ */
const MIN1 = 60000;
const aporteTr = (m,tr) => cuentaEnTramo(m,tr) ? Math.max(0,((tr.fin||Date.now()) - Math.max(tr.inicio, m.desde||0))/H) : 0;
function restarTramo(tr){ if(!tr.fin) return; S.mants.forEach(m=>{ m.acum = Math.max(0, m.acum - aporteTr(m,tr)); }); }
function sumarTramo(tr){ if(!tr.fin) return; S.mants.forEach(m=>{ m.acum += aporteTr(m,tr); }); }

/* base: línea de tiempo vertical con un dedo (elegir/pintar) y dos dedos (zoom y desplazar) */
function agendaBase(cont, cfg){
  const alto = cfg.alto || 340, MINP = 4, MAXP = 1500;
  cont.innerHTML = `<div class="ag" style="height:${alto}px" role="application" aria-label="Agenda"><div class="ag-in"></div><div class="ag-burb" hidden></div></div>`;
  const ag = cont.querySelector('.ag'), inn = ag.querySelector('.ag-in'), burb = ag.querySelector('.ag-burb');
  const view = {t0:cfg.t0, pph: Math.min(MAXP, Math.max(MINP, alto/((cfg.t1-cfg.t0)/H)))};
  const yDe = t => (t-view.t0)/H*view.pph, tDe = y => view.t0 + y/view.pph*H;
  const paso = () => view.pph>=400 ? 10*MIN1 : view.pph>=60 ? 30*MIN1 : view.pph>=25 ? H : 3*H;
  function pintar(){
    const st = paso(), fin = tDe(alto); let h = '';
    for(let t=Math.ceil(view.t0/st)*st; t<=fin; t+=st){ const d=new Date(t); h += `<div class="ag-l ${d.getMinutes()===0?'h':''}" style="top:${yDe(t).toFixed(1)}px"><span>${hhmm(t)}</span></div>`; }
    const lim = cfg.limites ? cfg.limites() : {};
    if(lim.min!=null && yDe(lim.min)>0) h += `<div class="ag-sh" style="top:0;height:${Math.min(alto,yDe(lim.min)).toFixed(1)}px"></div>`;
    if(lim.max!=null && yDe(lim.max)<alto) h += `<div class="ag-sh" style="top:${Math.max(0,yDe(lim.max)).toFixed(1)}px;height:${alto}px"></div>`;
    (cfg.bloques?cfg.bloques():[]).forEach(b=>{
      const y0 = yDe(b.a), y1 = yDe(b.b); if(y1<0 || y0>alto) return;
      const top = Math.max(0,y0), alt = Math.max(3, Math.min(alto,y1)-top);
      h += `<div class="ag-b ${b.modo} ${b.clase||''}" style="top:${top.toFixed(1)}px;height:${alt.toFixed(1)}px">${alt>=18 && b.txt!==''?(b.txt||nombreModo(b.modo)):''}</div>`;
    });
    (cfg.lineas?cfg.lineas():[]).forEach(l=>{ const y=yDe(l.t); if(y>=-2 && y<=alto+2) h += `<div class="ag-t" style="top:${y.toFixed(1)}px"></div>`; });
    inn.innerHTML = h;
  }
  const ptr = new Map(); let pinch = null, tuvoDos = false;
  const pos = e => { const r = ag.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  ag.addEventListener('pointerdown', e=>{
    try{ ag.setPointerCapture(e.pointerId); }catch(_){}
    ptr.set(e.pointerId, pos(e));
    if(ptr.size===1 && !tuvoDos){ const p=ptr.get(e.pointerId); cfg.puntero('down', tDe(p.y), p.x, p.y); }
    else if(ptr.size===2){
      tuvoDos = true; cfg.puntero('cancel'); burb.hidden = true;
      const [a,b] = [...ptr.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y) || 1, my = (a.y+b.y)/2;
      pinch = {d0:d, pph0:view.pph, tMid:tDe(my)};
    }
  });
  ag.addEventListener('pointermove', e=>{
    if(!ptr.has(e.pointerId)) return;
    ptr.set(e.pointerId, pos(e));
    if(ptr.size===2 && pinch){
      const [a,b] = [...ptr.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y) || 1, my = (a.y+b.y)/2;
      view.pph = Math.min(MAXP, Math.max(MINP, pinch.pph0*d/pinch.d0));
      view.t0 = pinch.tMid - my/view.pph*H;
      pintar();
    } else if(ptr.size===1 && !tuvoDos){ const p=ptr.get(e.pointerId); cfg.puntero('move', tDe(p.y), p.x, p.y); }
  });
  const soltar = e => {
    if(!ptr.has(e.pointerId)) return;
    const p = ptr.get(e.pointerId); ptr.delete(e.pointerId);
    if(ptr.size===0){ if(!tuvoDos) cfg.puntero(e.type==='pointercancel'?'cancel':'up', tDe(p.y), p.x, p.y); tuvoDos=false; pinch=null; }
  };
  ag.addEventListener('pointerup', soltar); ag.addEventListener('pointercancel', soltar);
  ag.addEventListener('wheel', e=>{ e.preventDefault(); const y=pos(e).y, t=tDe(y); view.pph = Math.min(MAXP, Math.max(MINP, view.pph*(e.deltaY<0?1.25:0.8))); view.t0 = t - y/view.pph*H; pintar(); }, {passive:false});
  const api = {
    view, pintar, alto,
    ver(a,b){ view.t0=a; view.pph=Math.min(MAXP, Math.max(MINP, alto/((b-a)/H))); pintar(); },
    fin: () => tDe(alto),
    zoom(f){ const y=alto/2, t=tDe(y); view.pph=Math.min(MAXP, Math.max(MINP, view.pph*f)); view.t0=t-y/view.pph*H; pintar(); },
    burbuja(x,y,txt){ burb.hidden=false; burb.textContent=txt; burb.style.left=Math.min(ag.clientWidth-40, Math.max(40,x))+'px'; burb.style.top=Math.max(44, y-26)+'px'; },
    quitarBurbuja(){ burb.hidden=true; },
    tDe, yDe
  };
  pintar();
  cont._ag = api;
  return api;
}

/* elegir una hora con la agenda: mantener y arrastrar, relojito sobre el dedo, zoom con dos dedos */
function hojaAgenda(o){
  const ahora = Date.now();
  const max = Math.min(o.max!=null ? o.max : ahora, ahora), min = o.min!=null ? o.min : null;
  let t1 = max + 30*MIN1, t0 = max - 3.5*H;
  if(o.ventana){ t0 = o.ventana[0]; t1 = o.ventana[1]; }
  else if(min!=null && min-15*MIN1 > t0) t0 = min - 15*MIN1;
  if(t1-t0 < H) t0 = t1 - H;
  let t = o.valor!=null ? o.valor : max;
  t = Math.min(max, Math.max(min!=null?min:-Infinity, t));
  let ag;
  abrirHoja(`<h3>${o.titulo}</h3>${o.texto?`<p>${o.texto}</p>`:''}
    <div class="ag-lectura"><b id="agh"></b><span id="agd"></span></div>
    <div id="agc"></div>
    <div class="ag-aj"><button id="am">−1 min</button><button id="ap">+1 min</button><button id="az1">Zoom −</button><button id="az2">Zoom +</button><button id="aat">Más atrás</button></div>
    <div class="nota" id="agi"></div><div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">${o.textoOk||'Guardar'}</button></div>`, ()=>{
      const leer = () => {
        $('#agh').textContent = hhmm(t);
        const dif = Date.now()-t;
        $('#agd').textContent = (new Date(t).toDateString()!==new Date().toDateString() ? fechaCorta(t)+' · ' : '') + (dif<MIN1 ? 'ahora' : `hace ${durTxt(dif)}`);
        $('#agi').innerHTML = o.info ? o.info(t) : '';
      };
      const poner = (tt, redondear) => {
        let v = redondear===false ? tt : Math.round(tt/MIN1)*MIN1;
        if(min!=null && v<min) v = min;
        if(v>max) v = max;
        t = v; $('#err').textContent=''; leer(); ag.pintar();
      };
      ag = agendaBase($('#agc'), {t0, t1,
        bloques: () => [...(o.bloques?o.bloques():[]), ...(o.previa?o.previa(t).map(b=>({...b, clase:'previa', txt:b.txt!=null?b.txt:''})):[])],
        lineas: () => [{t}],
        limites: () => ({min:min!=null?min:null, max}),
        puntero: (f,tt,x,y) => { if(f==='down'||f==='move'){ poner(tt); ag.burbuja(x,y,hhmm(t)); } else ag.quitarBurbuja(); }
      });
      leer();
      $('#am').onclick=()=>poner(t-MIN1); $('#ap').onclick=()=>poner(t+MIN1);
      $('#az1').onclick=()=>ag.zoom(0.6); $('#az2').onclick=()=>ag.zoom(1.6);
      $('#aat').onclick=()=>{ if(min!=null && ag.view.t0<=min-15*MIN1){ toast('No se puede ir más atrás'); return; } ag.ver(ag.view.t0-4*H, ag.fin()); };
      $('#no').onclick=()=>{ cerrarHoja(); if(o.alCancelar) o.alCancelar(); };
      $('#si').onclick=()=>{
        if(min!=null && t<min){ $('#err').textContent='Esa hora es demasiado pronto.'; return; }
        if(t>Date.now()+MIN1){ $('#err').textContent='La hora no puede ser futura.'; return; }
        o.ok(Math.min(t, Date.now()));
      };
  });
}

/* ---- tramos de la sesión abierta para dibujar ---- */
const bloquesTodas = () => todasSesiones().flatMap(({s})=>s.tramos.map(x=>({a:x.inicio, b:x.fin||Date.now(), modo:x.modo})));

/* ---- nota 28: mover el inicio del tramo actual (el anterior se ajusta) ---- */
function moverInicioTramo(t){
  const ses = S.sesion; if(!ses) return;
  const i = ses.tramos.length-1, tr = ses.tramos[i], prev = ses.tramos[i-1];
  if(prev){ restarTramo(prev); prev.fin = t; sumarTramo(prev); delete prev.posFin; }
  else { const viejo = ses.inicio; ses.inicio = t; S.trabajos.forEach(x=>{ if(x.ses===viejo) x.ses = t; }); }
  tr.inicio = t; delete tr.posIni;
  vibrar(tr.modo); guardar(); pintar(); toast(`${nombreModo(tr.modo)} desde las ${hhmm(t)}`);
}
/* ---- nota 27: quitar el Parado y seguir ---- */
function quitarParadoYSeguir(modo, t){
  const ses = S.sesion, i = ses.tramos.length-1, par = ses.tramos[i], prev = ses.tramos[i-1];
  if(!par || par.modo!=='parado' || !prev) return;
  ses.tramos.pop();
  restarTramo(prev);
  let trFin = null, trIni;
  if(prev.modo===modo){ prev.fin = null; delete prev.posFin; trIni = prev; }
  else { prev.fin = t; sumarTramo(prev); delete prev.posFin; trFin = prev; abrirTramo(modo, t); trIni = ses.tramos[ses.tramos.length-1]; if(modo==='campo' && S.posActiva) trIni.buscando = true; }
  vibrar(); guardar(); pintar();
  toast(prev.modo===modo ? `Parado quitado: sigues en ${modoTxt(modo)}` : `Parado quitado: ${nombreModo(modo)} desde las ${hhmm(t)}`);
  if(trFin) registrarPos(trFin, trIni);
}
function hojaHora(accion, modo){
  const ahora = Date.now(), ses = S.sesion;
  const tr = ses && ses.tramos[ses.tramos.length-1];
  if(accion==='pausa') modo = 'parado';
  const ult = S.sesiones.reduce((m,s)=>Math.max(m, s.fin||0), 0);
  const ctx = () => bloquesTodas();
  if(!ses){
    hojaAgenda({titulo: modo==='parado' ? 'Empezar la jornada a una hora anterior' : `Empezar en ${modoTxt(modo)} a una hora anterior`, texto:'La jornada empezará a esa hora.',
      min: ult ? ult+MIN1 : null, bloques: ctx, previa: t=>[{a:t, b:Date.now(), modo, txt:nombreModo(modo)}],
      info: t => ult ? `La sesión anterior acabó a las ${hhmm(ult)}${new Date(ult).toDateString()!==new Date().toDateString()?' del '+fechaCorta(ult):''}.` : '',
      textoOk:'Empezar', ok: t => { cerrarHoja(); setTimeout(()=>pulsarModo(modo, false, t), 80); }});
    return;
  }
  if(tr.modo===modo){
    /* nota 28: mover el inicio del tramo en el que ya estás */
    const prev = ses.tramos[ses.tramos.length-2];
    const min = prev ? prev.inicio + MIN1 : (ult ? ult+MIN1 : null);
    hojaAgenda({titulo:`Mover el inicio de ${modoTxt(modo)}`, texto:`Elige a qué hora empezó este tramo${prev?`. El de ${modoTxt(prev.modo)} anterior se ajusta`:''}.`,
      min, valor: tr.inicio, bloques: ctx, previa: t=>[{a:t, b:Date.now(), modo, txt:nombreModo(modo)}],
      info: t => `${nombreModo(modo)} empieza a las <b>${hhmm(t)}</b>${prev?`; ${nombreModo(prev.modo)} acaba a esa hora`:'; la jornada empieza a esa hora'}.`,
      textoOk:'Mover', ok: t => { cerrarHoja(); setTimeout(()=>moverInicioTramo(t), 80); }});
    return;
  }
  if(enPausa() && modo!=='parado'){
    /* nota 27: una hora anterior al inicio del Parado pregunta si se quita */

/* ---- cerrar la sesión (STOP) con la lógica de siempre ---- */
function cerrarSesion(fin){
  const antes = JSON.stringify(S), marca = {}, ses = S.sesion;
  const quitar = tr => { if(!tr.fin) return; S.mants.forEach(m=>{ if(cuentaEnTramo(m,tr)) m.acum = Math.max(0, m.acum - Math.max(0,(tr.fin - Math.max(tr.inicio, m.desde||0))/H)); }); tr.fin=null; };
  ses.tramos.filter(t=>t.inicio >= fin).forEach(quitar);
  ses.tramos = ses.tramos.filter(t=>t.inicio < fin);
  const ult = ses.tramos[ses.tramos.length-1];
  if(ult.fin && ult.fin > fin) quitar(ult);
  cerrarTramo(fin);
  delete ses.pausa;
  ses.fin = ses.tramos[ses.tramos.length-1].fin;
  S.sesiones.push(ses); S.sesion = null;
  guardar(); pintar();
  hojaResumenStop(ses, antes, marca);
  registrarPos(ses.tramos[ses.tramos.length-1], null, p=>{ if(marca.deshecho) return; if(p) ses.posStop = p; apuntarDondeQueda(ses.tractor, p); avisosGranja(ses, p); });
}

  if(!t || t.revisado || !t.fin || t.modo==='parado' || t.modo==='nose') return false;

  if(t.modo==='campo') return !(t.campo && campo(t.campo)) && !(t.lugar && lugar(t.lugar));

/* ---- cambio automático por GPS (nota 30): solo con la app abierta en pantalla ---- */
const GPS_MIN_MS = {v:10000}, GPS_PREC = 60, DIST_SALIR = 50;
let gpsWatch = null, gpsDenegado = false, gpsE = {fuera:null, dentro:0, salir:0, prev:null, ult:0};
function distBordeCampo(p, c){
  if(c.recintos.some(k=>dentroRecinto(p,k))) return 0;
  const kx = Math.cos(p.lat*Math.PI/180)*111320, ky = 110540; let m = Infinity;
  c.recintos.forEach(k=>poligonos(k).forEach(pol=>{
    const r = pol[0];
    for(let i=0;i<r.length-1;i++){
      const x1=(r[i][0]-p.lon)*kx, y1=(r[i][1]-p.lat)*ky, x2=(r[i+1][0]-p.lon)*kx, y2=(r[i+1][1]-p.lat)*ky;
      const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy; const u = l2 ? Math.max(0, Math.min(1, -(x1*dx+y1*dy)/l2)) : 0;
      const d = Math.hypot(x1+u*dx, y1+u*dy); if(d<m) m=d;
    }
  }));
  return m;
}
function autoCambio(modo, texto){
  pulsarModo(modo, true);
  const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1];
  if(tr && tr.modo===modo){ tr.auto = true; guardar(); }
  try{ if(navigator.vibrate) navigator.vibrate([150,80,150]); }catch(e){}
  setTimeout(()=>toast(texto, 4000), 50);
}
function evaluarGps(p, vel){
  const ses = S.sesion; if(!ses) return;
  const tr = ses.tramos[ses.tramos.length-1]; if(!tr || tr.fin) return;
  const ahora = Date.now();
  /* velocidad: la del GPS o la que sale de dos lecturas seguidas */
  let v = vel;
  if(v==null && gpsE.prev && ahora-gpsE.prev.t >= 4000) v = metros(gpsE.prev, p) / ((ahora-gpsE.prev.t)/1000);
  gpsE.prev = {lat:p.lat, lon:p.lon, t:ahora};
  const c = campoEn(p);
  if(!c) gpsE.fuera = true;
  if(ahora - tr.inicio < 2*MIN1){ gpsE.dentro = 0; gpsE.salir = 0; return; } /* enfriamiento tras cualquier cambio */
  if(tr.modo==='carretera'){
    gpsE.salir = 0;
    if(c && gpsE.fuera){
      gpsE.dentro++;
      if(gpsE.dentro>=2){ gpsE.dentro=0; gpsE.fuera=false; autoCambio('campo', `Entras en ${nombreCampo(c)}: pasa a Campo (automático)`); }
    } else if(!c) gpsE.dentro = 0;
  } else if(tr.modo==='campo' && tr.campo && campo(tr.campo)){
    gpsE.dentro = 0;
    const d = distBordeCampo(p, campo(tr.campo));
    if(d > DIST_SALIR && v!=null && v >= 1.5){
      gpsE.salir++;
      if(gpsE.salir>=2){ gpsE.salir=0; autoCambio('carretera', `Sales de ${nombreCampo(tr.campo)}: pasa a Carretera (automático)`); }
    } else gpsE.salir = 0;
  } else { gpsE.dentro = 0; gpsE.salir = 0; }
}
/* ============ 1.4.2.2: Seguirme, ruta en carretera, aviso sin jornada, salir con atrás y pantalla horizontal ============ */
/* Seguirme encendido: el GPS lee todo el rato (con la app a la vista) y la pantalla no se apaga.
   Con jornada: cambio automático Campo/Carretera (el de la 1.4.2) y, en carretera, ruta con un punto cada 100 m.
   Apagado: solo botones, con la lectura de cada botón (Guardar la posición). */
const RUTA_PASO = 100, RUTA_HUECO = 3*MIN1, RUTA_TOL = 10, SEN_VIEJA = 30000;
var gpsSen = null, gpsVelo = null, rutaAb = null, rutaUlt = null, rutaFin = null, wl = null, actx = null;
var sinJor = {n:0, ult:0};
const r5 = x => Math.round(x*1e5);
function guardarLigero(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} if(typeof sync!=='undefined' && !sync.pendiente){ sync.pendiente = true; sync.cambios++; guardarSync(); pintarSync(); } }
/* ruta compacta: [lat, lon, 0, dlat, dlon, dseg, ...] en cienmilésimas de grado (≈1 m) y segundos */
function rutaPuntos(seg){
  const p = seg.p, out = []; let la=0, lo=0, t=seg.a;
  for(let i=0;i+2<p.length;i+=3){ la += p[i]; lo += p[i+1]; t += p[i+2]*1000; out.push({lat:la/1e5, lon:lo/1e5, t}); }
  return out;
}
function rutaCodificar(pts){
  const p = []; let la=0, lo=0, t=pts.length?pts[0].t:0;
  pts.forEach(q=>{ const a=r5(q.lat), b=r5(q.lon), s=Math.round((q.t-t)/1000); p.push(a-la, b-lo, s); la=a; lo=b; t+=s*1000; });
  return {a: pts.length?pts[0].t:0, p};
}
/* quitar puntos en las rectas (Douglas-Peucker, 10 m): curvas y cruces se quedan */
function simplificar(pts){
  if(pts.length<3) return pts;
  const kx = Math.cos(pts[0].lat*Math.PI/180)*111320, ky = 110540;
  const xy = pts.map(q=>[q.lon*kx, q.lat*ky]), keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length-1] = true;
  const pila = [[0, pts.length-1]];
  while(pila.length){
    const [i,j] = pila.pop(); let dm = 0, im = -1;
    const [x1,y1]=xy[i], [x2,y2]=xy[j], dx=x2-x1, dy=y2-y1, l=Math.hypot(dx,dy);
    for(let k=i+1;k<j;k++){ const d = l ? Math.abs(dy*xy[k][0]-dx*xy[k][1]+x2*y1-y2*x1)/l : Math.hypot(xy[k][0]-x1, xy[k][1]-y1); if(d>dm){ dm=d; im=k; } }
    if(dm > RUTA_TOL){ keep[im]=true; pila.push([i,im],[im,j]); }
  }
  return pts.filter((_,k)=>keep[k]);
}
function rutaPunto(p){
  if(!S.rutas) S.rutas = [];
  rutaFin = p;
  if(rutaAb!=null && rutaUlt){
    if(p.t - rutaUlt.t > RUTA_HUECO) rutaCerrar(); /* la app estuvo fuera: tramo nuevo, sin raya recta por medio */
    else if(metros(rutaUlt, p) < RUTA_PASO) return;
  }
  if(rutaAb==null){
    S.rutas.push({a:p.t, p:[r5(p.lat), r5(p.lon), 0]}); rutaAb = S.rutas.length-1;
    rutaUlt = {lat:r5(p.lat)/1e5, lon:r5(p.lon)/1e5, t:p.t};
  } else {
    const seg = S.rutas[rutaAb], s = Math.round((p.t-rutaUlt.t)/1000);
    seg.p.push(r5(p.lat)-r5(rutaUlt.lat), r5(p.lon)-r5(rutaUlt.lon), s);
    rutaUlt = {lat:r5(p.lat)/1e5, lon:r5(p.lon)/1e5, t:rutaUlt.t+s*1000};
  }
  guardarLigero();
}
function rutaCerrar(){
  if(rutaAb==null) return;
  const seg = S.rutas && S.rutas[rutaAb];
  if(seg){
    let pts = rutaPuntos(seg);
    if(rutaFin && rutaUlt && rutaFin.t-rutaUlt.t <= RUTA_HUECO && metros(rutaUlt, rutaFin) >= 20) pts.push({lat:rutaFin.lat, lon:rutaFin.lon, t:rutaFin.t});
    if(pts.length<2) S.rutas.splice(rutaAb,1);
    else Object.assign(seg, rutaCodificar(simplificar(pts)));
  }
  rutaAb = null; rutaUlt = null; rutaFin = null;
  guardarLigero();
}
const enCarretera = () => { const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1]; return !!(tr && !tr.fin && tr.modo==='carretera'); };
function kmEntre(d0, d1){
  let m = 0;
  (S.rutas||[]).forEach(seg=>{ const pts = rutaPuntos(seg); for(let i=1;i<pts.length;i++) if(pts[i].t>d0 && pts[i].t<=d1) m += metros(pts[i-1], pts[i]); });
  return m/1000;
}
const kmTxt = km => (km<10 ? km.toFixed(1) : String(Math.round(km))).replace('.', ',') + ' km';

/* cada lectura del GPS: señal, velocidad y ruta; cada 10 s como mínimo: aviso sin jornada y cambio automático */
function gpsLectura(pos){
  const ahora = Date.now(), prec = pos.coords.accuracy||0;
  const p = {lat:pos.coords.latitude, lon:pos.coords.longitude, prec:Math.round(prec), t:ahora};
  const vel = pos.coords.speed!=null && !isNaN(pos.coords.speed) ? pos.coords.speed : null;
  const buena = !prec || prec <= GPS_PREC;
  if(buena){
    let v = vel;
    if(v==null && gpsSen && gpsSen.p && ahora-gpsSen.t >= 2000 && ahora-gpsSen.t < 20000) v = metros(gpsSen.p, p)/((ahora-gpsSen.t)/1000);
    gpsVelo = v;
    gpsSen = {t:ahora, prec:p.prec, p};
  } else gpsSen = Object.assign({}, gpsSen||{}, {mala:ahora});
  pintarSenal(); pintarVelo();
  if(!buena) return;
  if(S.seguirme && enCarretera()) rutaPunto(p); else if(rutaAb!=null) rutaCerrar();
  if(ahora - gpsE.ult < GPS_MIN_MS.v) return;
  gpsE.ult = ahora;
  let v = vel;
  if(v==null && gpsE.pv && ahora-gpsE.pv.t >= 4000) v = metros(gpsE.pv, p)/((ahora-gpsE.pv.t)/1000);
  gpsE.pv = p;
  avisoSinJornada(v);
  evaluarGps(p, v);
}
function gestionarGps(){
  const quiere = !!S.seguirme && document.visibilityState==='visible' && !gpsDenegado && !!navigator.geolocation;
  if(quiere && gpsWatch==null){
    gpsE = {fuera:null, dentro:0, salir:0, prev:null, ult:0, pv:null};
    try{ gpsWatch = navigator.geolocation.watchPosition(gpsLectura, e=>{ if(e && e.code===1){ gpsDenegado = true; if(S.seguirme) toast('Sin permiso de ubicación: Seguirme no puede leer el GPS', 4000); } }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000}); }catch(e){ gpsWatch = null; }
  } else if(!quiere && gpsWatch!=null){
    try{ navigator.geolocation.clearWatch(gpsWatch); }catch(e){} gpsWatch = null;
  }
  if(rutaAb!=null && !(S.seguirme && enCarretera())) rutaCerrar();
  if(S.seguirme && document.visibilityState==='visible') pedirWake(); else soltarWake();
  pintarSenal();
}

/* pantalla siempre encendida mientras Seguirme está encendido y la app a la vista */
async function pedirWake(){
  if(wl || !('wakeLock' in navigator)) return;
  try{ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', ()=>{ wl = null; }); }catch(e){ wl = null; }
}
function soltarWake(){ if(wl){ try{ wl.release(); }catch(e){} wl = null; } }

/* aviso: te mueves y no has empezado la jornada */
function avisoSinJornada(v){
  if(S.sesion || !S.seguirme){ sinJor.n = 0; return; }
  if(v!=null && v > 5/3.6) sinJor.n++; else sinJor.n = 0;
  if(sinJor.n >= 2 && Date.now()-sinJor.ult >= 5*MIN1){ sinJor.n = 0; sinJor.ult = Date.now(); mostrarAvisoSinJornada(); }
}
function mostrarAvisoSinJornada(){
  let el = $('#avisoSeg');
  if(!el){ el = document.createElement('div'); el.id='avisoSeg'; el.className='avisoseg'; el.setAttribute('role','alert'); document.body.appendChild(el); }
  el.innerHTML = `<b>Te estás moviendo y no has empezado la jornada</b><br>Pulsa Inicio si ya estás trabajando.`;
  el.classList.add('on');
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
  pitido();
  clearTimeout(mostrarAvisoSinJornada.k); mostrarAvisoSinJornada.k = setTimeout(()=>el.classList.remove('on'), 8000);
}
function desbloquearAudio(){
  try{ if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
}
function pitido(){
  if(!actx) return;
  try{
    if(actx.state==='suspended') actx.resume();
    [0, .35].forEach(d=>{
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + d;
      o.type='square'; o.frequency.value = 1100; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+.02); g.gain.exponentialRampToValueAtTime(0.0001, t+.25);
      o.start(t); o.stop(t+.27);
    });
  }catch(e){}
}

/* botón Seguirme: flecha al lado del calendario de Días */
const ICO_FLECHA = '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M20 4 4 11l7 2 2 7z"/></svg>';
function pintarSeguirmeBtn(){

  b.classList.toggle('on', !!S.seguirme);
  b.setAttribute('aria-pressed', S.seguirme ? 'true' : 'false');

}

}
setInterval(()=>{ pintarSenal(); pintarVelo(); }, 5000);
function cambiarSeguirme(){
  S.seguirme = !S.seguirme;

$('#btnSeg').innerHTML = ICO_FLECHA;
$('#btnSeg').onclick = cambiarSeguirme;
pintarSeguirmeBtn();

/* pantalla horizontal fija, a pantalla completa (desde el engranaje) */
const enHorizontalFijo = () => !!document.fullscreenElement;
async function cambiarHorizontal(){
  try{
    if(enHorizontalFijo()){
      try{ screen.orientation.unlock(); }catch(e){}
      await document.exitFullscreen();
      toast('Vuelta a vertical');
    } else {
      if(!document.documentElement.requestFullscreen){ toast('Este móvil no deja poner la app a pantalla completa'); return; }
      await document.documentElement.requestFullscreen({navigationUI:'hide'});
      try{ await screen.orientation.lock('landscape'); }
      catch(e){ toast('Pantalla completa, pero el móvil no deja fijar la horizontal: gíralo a mano', 4000); return; }
    }
  }catch(e){ toast('No se ha podido cambiar la pantalla'); }
}

/* Días: ruta del día dibujada sobre los contornos de los campos, sin internet */
function mapaRutaDia(d0, d1){
  const segs = [];
  (S.rutas||[]).forEach(seg=>{ const pts = rutaPuntos(seg).filter(q=>q.t>=d0 && q.t<d1); if(pts.length>=2) segs.push(pts); });
  if(!segs.length) return '';
  const km = kmEntre(d0, d1);
  const hechos = new Set();
  todasSesiones().forEach(({s})=>s.tramos.forEach(t=>{ if(t.modo==='campo' && t.campo && t.inicio<d1 && (t.fin||Date.now())>d0) hechos.add(t.campo); }));
  let mnx=Infinity, mxx=-Infinity, mny=Infinity, mxy=-Infinity;
  const ext = (lon,lat) => { if(lon<mnx) mnx=lon; if(lon>mxx) mxx=lon; if(lat<mny) mny=lat; if(lat>mxy) mxy=lat; };
  segs.forEach(pts=>pts.forEach(q=>ext(q.lon,q.lat)));
  (S.campos||[]).filter(c=>hechos.has(c.id)).forEach(c=>c.recintos.forEach(k=>poligonos(k).forEach(pol=>pol[0].forEach(([x,y])=>ext(x,y)))));
  const lat0 = (mny+mxy)/2, kx = Math.cos(lat0*Math.PI/180)*111320, ky = 110540;
  let w = (mxx-mnx)*kx, h = (mxy-mny)*ky, cx = (mnx+mxx)/2, cy = lat0;
  w = Math.max(w, 400) + 300; h = Math.max(h, 300) + 300;
  if(h < w*0.55) h = w*0.55; if(h > w*1.1) w = h/1.1;
  const W = 1000, sc = W/w, Hh = Math.round(h*sc);
  const px = (lon,lat) => [((lon-cx)*kx + w/2)*sc, (h/2 - (lat-cy)*ky)*sc];
  const dentroVista = (lon,lat) => { const [x,y]=px(lon,lat); return x>-200 && x<W+200 && y>-200 && y<Hh+200; };
  let campos = '', nombres = '';
  (S.campos||[]).forEach(c=>{
    const polis = []; let visto = false;
    c.recintos.forEach(k=>poligonos(k).forEach(pol=>{ pol.forEach(r=>{ if(r.some(([x,y])=>dentroVista(x,y))) visto = true; polis.push(r); }); }));
    if(!visto) return;
    const d = polis.map(r=>'M'+r.map(([x,y])=>px(x,y).map(n=>n.toFixed(1)).join(',')).join('L')+'Z').join('');
    const hecho = hechos.has(c.id);
    campos += `<path d="${d}" class="${hecho?'ch':'cn'}" fill-rule="evenodd"/>`;
    if(hecho){ const r = polis[0]; let sx=0, sy=0; r.forEach(([x,y])=>{ const [a,b]=px(x,y); sx+=a; sy+=b; }); nombres += `<text x="${(sx/r.length).toFixed(0)}" y="${(sy/r.length).toFixed(0)}">${esc(c.nombre)}</text>`; }
  });
  const rutas = segs.map(pts=>`<polyline points="${pts.map(q=>px(q.lon,q.lat).map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`).join('');
  const ini = segs[0][0], fin = segs[segs.length-1][segs[segs.length-1].length-1];
  const [ix,iy] = px(ini.lon,ini.lat), [fx,fy] = px(fin.lon,fin.lat);
  return `<section class="mapadia" aria-label="Ruta del día"><h3>Ruta del día: ${kmTxt(km)} por carretera</h3>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Mapa con la ruta por carretera de este día y los campos">${campos}<g class="ru">${rutas}</g><circle cx="${ix.toFixed(1)}" cy="${iy.toFixed(1)}" r="9" class="pi"/><circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="9" class="pf"/><g class="nm">${nombres}</g></svg>
    <p class="nota">En verde, los campos trabajados este día. Círculo claro: salida; oscuro: llegada. Solo se guarda la ruta por carretera con Seguirme encendido. Contornos: SIGPAC (FEGA), CC BY 4.0.</p></section>`;
}
