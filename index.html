<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantenimiento</title>
<meta name="theme-color" content="#3B6D11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --line:#DEDCD3; --text:#1F2A1F; --text2:#5F6B5C;
  --campo:#3B6D11; --campo-bg:#EAF3DE; --campo-on:#FFFFFF;
  --tierra:#A0640F; --tierra-bg:#FAEEDA; --tierra-on:#FFFFFF;
  --stop:#B3261E; --stop-off:#D9A6A2;
  --rojo:#E24B4A; --amarillo:#EF9F27;
  --scrim:rgba(20,25,20,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A15; --card:#1F261F; --line:#34402F; --text:#E8EDE4; --text2:#A9B5A3;
    --campo:#6FA83A; --campo-bg:#27361C; --campo-on:#0E140B;
    --tierra:#D69A45; --tierra-bg:#3A2C17; --tierra-on:#1A1206;
    --stop:#E0453B; --stop-off:#5A2E2B;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A15; --card:#1F261F; --line:#34402F; --text:#E8EDE4; --text2:#A9B5A3;
  --campo:#6FA83A; --campo-bg:#27361C; --campo-on:#0E140B;
  --tierra:#D69A45; --tierra-bg:#3A2C17; --tierra-on:#1A1206;
  --stop:#E0453B; --stop-off:#5A2E2B;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:"Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;font-size:14px;color:var(--text2)}
.badge{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:0;cursor:pointer;background:var(--tierra-bg);color:var(--tierra)}
.badge.ok{background:var(--campo-bg);color:var(--campo)}
.bienv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:8px}
.bienv h2{margin:0 0 6px;font-size:20px;font-weight:500}
.bienv p{color:var(--text2);margin:0 0 14px}
main{flex:1;padding:6px 14px 120px}
.maquinas{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.maq{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.maq + .maq{border-top:1px solid var(--line)}
.maq:focus-visible,.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:3px solid var(--campo);outline-offset:2px}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px}
.ico.t{background:var(--campo-bg);color:var(--campo)}
.ico.a{background:var(--tierra-bg);color:var(--tierra)}
.maq .n{font-size:17px;font-weight:500}
.maq .s{font-size:13px;color:var(--text2)}
.maq .sw{margin-left:auto;color:var(--text2);width:22px;height:22px}
.aviso-largo{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--tierra-bg);color:var(--tierra);font-size:14px;display:none}
.reloj{text-align:center;margin:22px 0 4px;font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.reloj.parado{color:var(--text2)}
.reloj.campo{color:var(--campo)} .reloj.carretera{color:var(--tierra)} .reloj.enpausa{color:var(--text2)}
.reloj-sub.campo{color:var(--campo)} .reloj-sub.carretera{color:var(--tierra)}
.parciales{display:grid;grid-template-columns:1fr 86px 1fr;gap:12px;margin:14px 0 -8px;text-align:center}
.parcial.oculto{visibility:hidden}
.parcial{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text2);opacity:.75}
.parcial.on{opacity:1}
.parcial.campo.on{color:var(--campo)} .parcial.carretera.on{color:var(--tierra)}
.centro{display:flex;flex-direction:column;align-items:center;gap:8px}
button.pausa{width:86px;white-space:nowrap;display:flex;flex-direction:column;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;align-items:center;justify-content:center;gap:1px;padding:7px 4px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.pausa .pl{display:flex;align-items:center;gap:4px}
.pausa .pcont{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.controles .btn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button.pausa svg{width:16px;height:16px}
button.pausa:disabled{opacity:.4;cursor:default}
button.pausa.on{background:var(--text);border-color:var(--text);color:var(--bg)}
button.pausa:focus-visible{outline:3px solid var(--campo);outline-offset:2px}
.reloj-sub{text-align:center;font-size:13px;color:var(--text2);min-height:18px}
.controles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:16px 0 0}
.btn{border-radius:14px;padding:14px 8px;border:2px solid;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:500;transition:background .15s,color .15s,opacity .15s}
.btn svg{width:26px;height:26px}
.btn.carretera{border-color:var(--tierra);color:var(--tierra)}
.btn.campo{border-color:var(--campo);color:var(--campo)}
.btn.carretera.on{background:var(--tierra);color:var(--tierra-on)}
.btn.campo.on{background:var(--campo);color:var(--campo-on)}
.btn.tenue{opacity:.45}
.stop{width:86px;height:86px;border:0;cursor:pointer;background:var(--stop-off);color:#fff;font-weight:700;font-size:17px;letter-spacing:.04em;clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);display:grid;place-items:center;transition:background .15s,transform .1s}
.stop.on{background:var(--stop)}
.stop:active{transform:scale(.96)}
.stop:focus-visible{outline:3px solid var(--stop);outline-offset:4px}
.rapidos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 0}
.rapidos .chip:last-child:nth-child(odd){grid-column:1/-1}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--campo);font-size:15px;cursor:pointer}
.chip svg{width:20px;height:20px}
.avisos{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.avisos h2{font-size:14px;font-weight:500;color:var(--text2);margin:8px 0 4px}
.av{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px}
.av + .av{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.dot.r{background:var(--rojo)} .dot.y{background:var(--amarillo)}
.av .q{margin-left:auto;color:var(--text2);font-size:14px;white-space:nowrap}
.vacio{color:var(--text2);font-size:15px;padding:8px 0 10px}
.navwrap{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.navin{max-width:480px;margin:0 auto;display:flex;align-items:stretch}
.nav{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;mask-image:linear-gradient(to right,#000 85%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 22%;scroll-snap-align:start;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--text2);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button.act{color:var(--campo);font-weight:500}
.topizq{display:flex;align-items:center;gap:10px}
.top{flex-wrap:wrap;row-gap:6px;column-gap:8px} #fecha,.top .badge{white-space:nowrap} .topder{margin-left:auto}
#btnDias.act{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.hoja{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.hoja h3{margin:0 0 6px;font-size:19px;font-weight:500}
.hoja p{margin:4px 0 12px;color:var(--text2);font-size:15px}
.opc{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:none;cursor:pointer;margin:0 0 8px;text-align:left}
.opc.sel{border-color:var(--campo);background:var(--campo-bg)}
.opc .s{font-size:13px;color:var(--text2)}
label.f{display:block;font-size:14px;color:var(--text2);margin:10px 0 4px}
.campo-num{display:flex;gap:8px}
.campo-num input,.hoja input,.hoja select{flex:1;width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.cam{width:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.cam svg{width:22px;height:22px}
.acciones{display:flex;gap:10px;margin-top:16px}
.acciones button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:none}
.acciones .ok{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.acciones .peligro{background:var(--stop);border-color:var(--stop);color:#fff}
.enlace{background:none;border:0;padding:0;color:var(--campo);text-decoration:underline;font-size:inherit;cursor:pointer}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.err{color:var(--stop);font-size:14px;margin-top:6px;min-height:18px}
.nota{font-size:13px;color:var(--text2);margin-top:8px}
.seg{display:flex;gap:6px;margin:4px 0}
.seg button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-size:14px}
.seg button.sel{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:1}
.prox{padding:60px 20px;text-align:center;color:var(--text2)}
.filtros{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.filtros select{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.filtros .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.filtros .dot{width:10px;height:10px}
.pista{font-size:13px;color:var(--text2);margin:6px 2px 8px}
.lista{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fwrap{position:relative;overflow:hidden}
.fwrap+.fwrap{border-top:1px solid var(--line)}
.fondo{position:absolute;inset:0;background:var(--campo);color:var(--campo-on);display:flex;align-items:center;padding-left:18px;font-weight:500}
.fila{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:12px 14px;touch-action:pan-y;cursor:pointer;user-select:none}
.fila:focus-visible{outline:3px solid var(--campo);outline-offset:-3px}
.fx{display:flex;flex-direction:column;min-width:0}
.fx .n{font-size:16px}
.fx .s{font-size:13px;color:var(--text2)}
.fq{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);white-space:nowrap}
.rel svg{width:16px;height:16px;display:block}
.dot.n{background:transparent;border:1px solid var(--line)}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:8px 0 4px}
.det dt{color:var(--text2)} .det dd{margin:0}
.dep{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.dep .tit{font-size:14px;color:var(--text2)}
.dep .big{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;margin:2px 0}
.dep .s{font-size:14px;color:var(--text2)}
.dep .des{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:14px;background:var(--bg)}
.dep .des.alerta{background:var(--tierra-bg);color:var(--tierra)}
.barra{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.barra span{display:block;height:100%;background:var(--campo)}
.acc3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.acc3 .chip:last-child:nth-child(odd){grid-column:1/-1}
.hist{margin-top:16px}
.hist h2{font-size:14px;font-weight:500;color:var(--text2);margin:0 4px 8px}
.mov{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
.mov + .mov{border-top:1px solid var(--line)}
.mov .fx{flex:1}
.mov .der{text-align:right;font-size:14px;white-space:nowrap}
.mov .der .s{display:block;font-size:13px;color:var(--text2)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tierra-bg);color:var(--tierra);margin-top:4px}
.tag.ok{background:var(--campo-bg);color:var(--campo)}
button.mov{cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--campo)}
.mes{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mes h2{font-size:18px;font-weight:500;margin:0}
.flecha{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.flecha svg{width:22px;height:22px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--text2);padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.cal button.hoy{outline:2px solid var(--campo);outline-offset:-2px}
.cal button.con{background:var(--campo-bg);font-weight:500}
.cal .pt{width:6px;height:6px;border-radius:50%;background:var(--campo)}
.agenda{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:4px;overflow:hidden}
.agenda .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--text2);padding-left:6px}
.blk{position:absolute;left:52px;right:10px;border-radius:8px;padding:4px 8px;font-size:13px;overflow:hidden;border:0;text-align:left;cursor:pointer;line-height:1.25}
.blk.campo{background:var(--campo);color:var(--campo-on)}
.blk.carretera{background:var(--tierra);color:var(--tierra-on)}
.blk.abierta{opacity:.7}
.tramos{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.tramo{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tramo+.tramo{border-top:1px solid var(--line)}
.tramo .bar{width:6px;align-self:stretch;border-radius:3px}
.tramo .bar.campo{background:var(--campo)} .tramo .bar.carretera{background:var(--tierra)}
.tramo .der{margin-left:auto;font-size:14px;color:var(--text2);white-space:nowrap}
.cambio{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:15px}
.cambio+.cambio{border-top:1px solid var(--line)}
.cambio .s{color:var(--text2);font-size:13px}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0 8px}
.peq{font-size:14px;font-weight:500;margin:0 0 4px}
.cnt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.cnt .dot{width:10px;height:10px}
.secc{font-size:14px;font-weight:500;color:var(--text2);margin:18px 4px 8px}
.wz{font-size:13px;color:var(--text2);margin:0 0 2px}
.mitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mitem .s{display:block;font-size:13px;color:var(--text2)}
.mitem button{margin-left:auto;border:0;background:none;color:var(--text2);cursor:pointer;width:40px;height:40px;font-size:22px;flex:none}
.caja{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--text2);color:var(--text2);font-size:11px;font-weight:700;flex:none;line-height:1}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tierra-bg);color:var(--tierra);margin-left:6px;vertical-align:1px}
.taller{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--tierra);border-radius:14px;background:var(--tierra-bg);color:var(--text);cursor:pointer;font:inherit;margin:0 0 10px}
.taller .n{font-weight:500}
.taller .s{font-size:13px;color:var(--text2)}
.taller .q{margin-left:auto;font-size:14px;color:var(--tierra);white-space:nowrap}
.salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:20px 0 0;padding:13px;border-radius:12px;border:1.5px solid var(--campo);background:var(--card);color:var(--campo);font:inherit;font-size:16px;font-weight:500;cursor:pointer;position:relative}
.salir svg{width:20px;height:20px}
.salir .pto{width:10px;height:10px;border-radius:50%;background:var(--rojo);position:absolute;top:9px;right:12px}
.salir + .rapidos{margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px 12px}
.rut{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.rut:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:12px;flex:1;width:100%;padding:12px 2px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.hoja .chk + .chk{border-top:1px solid var(--line)}
.chk .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on .box{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.chk.fallo .box{background:var(--stop);border-color:var(--stop);color:#fff}
.chk .s{display:block;font-size:13px;color:var(--text2)}
.chk .der{margin-left:auto;font-size:13px;color:var(--text2);white-space:nowrap;text-align:right}
.falla{border:1px solid var(--line);background:none;color:var(--text2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;flex:none}
.ventana{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:4px 2px 10px}
.ventana button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.ventana b{color:var(--text);font-weight:500;min-width:56px;text-align:center}

.mapadia svg{display:block;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mapadia .cn{fill:none;stroke:var(--line);stroke-width:2}

.mapadia .pf{fill:var(--tierra)}
.mapadia .nm text{font-size:36px;fill:var(--text);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:6px}

  };
  (S.sesiones||[]).forEach(x=>{ if(x.tramos&&x.tramos.length) rellenar(x); });
  if(S.sesion){

  }

}

function cuentaEnTramo(m, tramo){
  if(m.reloj!=='trabajo') return false;
  if(tramo.modo==='parado') return false; /* 1.4.2: el parado cuenta en la jornada, no en los mantenimientos */
  const ap = apero(tramo.apero);
  /* modo 'nose': horas igualadas con "No lo sé"; solo cuenta lo que vale igual en carretera y en campo */
  if(m.maq===tramo.tractor){
    if(m.cuenta==='siempre') return true;
    if(m.cuenta==='campo') return tramo.modo==='campo';
    if(m.cuenta==='alza') return tramo.modo==='campo' && !!ap && ap.tipo==='suspendido';
    if(m.cuenta==='arrastrado') return !!ap && ap.tipo==='arrastrado';
    if(m.cuenta==='carretera') return tramo.modo==='carretera';
    return false;
  }
  if(m.maq===tramo.apero){
    if(m.cuenta==='siempre') return ap.tipo==='arrastrado' || tramo.modo==='campo';
    if(m.cuenta==='campo') return tramo.modo==='campo';
    if(m.cuenta==='carretera') return tramo.modo==='carretera';
  }
  return false;
}

function horasRestantes(m){
  if(!m.intervalo) return Infinity;
  if(m.reloj==='motor'){
    const t = tractor(m.maq);
    return m.intervalo - (t.horometro - m.ultima);
  }
  if(m.reloj==='ha') return m.intervalo - (m.acum||0) - haDesde(m.maq, m.desde||m.fecha);
  let acum = m.acum;
  const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1];
  if(tr && !tr.fin && cuentaEnTramo(m,tr)) acum += Math.max(0,(Date.now()-Math.max(tr.inicio, m.desde||0))/H);
  return m.intervalo - acum;
}
const DIA = 86400000;
function venceFecha(m){ if(!m.meses) return null; const d=new Date(m.fecha||Date.now()); d.setMonth(d.getMonth()+m.meses); return d.getTime(); }
function diasRestantes(m){ const v=venceFecha(m); return v==null ? Infinity : (v-Date.now())/DIA; }
const umbralDe = m => m.intervalo ? Math.min(S.umbralAmarillo, m.intervalo/4) : 0;
const umbralDias = m => m.meses ? Math.min(S.diasAmarillo, m.meses*30.4/4) : 0;
function estadoMant(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  if(r < 0 || d < 0) return 'r';
  if(r < umbralDe(m) || d < umbralDias(m)) return 'y';
  return '';
}
function urgencia(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  return Math.min(isFinite(r) ? r/m.intervalo : Infinity, isFinite(d) ? d/(m.meses*30.4) : Infinity);
}
const info = m => ({m, r:horasRestantes(m), d:diasRestantes(m), e:estadoMant(m), u:urgencia(m)});
const porUrgencia = (a,b) => a.u - b.u;
/* aviso "M": lo que va por horas de trabajo pero el manual pide por horómetro */
function restanManual(m){
  if(m.reloj!=='trabajo' || !m.manualH || m.ultimaHoro==null) return Infinity;
  const t = tractor(m.maq); if(!t) return Infinity;
  return m.manualH - (t.horometro - m.ultimaHoro);
}
const marcaM = m => restanManual(m) <= 0;
const textoManual = m => { const r=restanManual(m); return r<=0 ? 'le tocaría ya' : `faltan ${fmtH(r)} h de horómetro`; };
const esc = x => String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function fmtDias(d){ const a=Math.abs(d); if(a<45){ const n=Math.max(1,Math.round(a)); return n===1?'1 día':`${n} días`; } const n=Math.round(a/30.4); return n===1?'1 mes':`${n} meses`; }
const fmtMeses = n => n%12===0 ? (n===12?'1 año':`${n/12} años`) : (n===1?'1 mes':`${n} meses`);
const uM = m => m.reloj==='ha' ? 'ha' : 'h';
function cadaTexto(m){
  const p = [];
  if(m.intervalo) p.push(`${fmtH(m.intervalo)} ${uM(m)}`);
  if(m.meses) p.push(fmtMeses(m.meses));
  return 'cada ' + p.join(' o ');
}
function textoMant(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  if(r < 0 && (!isFinite(d) || d >= 0 || -r/m.intervalo >= -d/(m.meses*30.4))) return `pasado ${fmtH(-r)} ${uM(m)}`;
  if(d < 0) return `pasado ${fmtDias(d)}`;
  if(isFinite(r) && isFinite(d)) return `faltan ${fmtH(r)} ${uM(m)} o ${fmtDias(d)}`;
  if(isFinite(r)) return `faltan ${fmtH(r)} ${uM(m)}`;
  if(isFinite(d)) return `faltan ${fmtDias(d)}`;
  return 'sin plazo';
}
const hoyISO = () => isoDe(Date.now());
function isoDe(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaDe(v){ if(!v || v===hoyISO()) return Date.now(); return new Date(v+'T12:00').getTime(); }

function cerrarTramo(fin){

/* ---------- pulsación larga: cambiar, empezar, seguir o pausar a una hora anterior ---------- */
function pulsacionLarga(el, corta, larga){
  if(!el) return;

  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev, parar));

}

async function notiSesion(forzar){

    else { titulo = tr.modo==='campo' ? (tr.campo && campo(tr.campo) ? `Trabajando en ${campo(tr.campo).nombre}` : 'Sesión abierta en campo') : 'Sesión abierta en carretera'; cuerpo=`${tr.modo==='campo'?'En campo':'En carretera'} desde las ${hhmm(tr.inicio)}. ${maq}. Sesión desde las ${hhmm(S.sesion.inicio)}.`; }

/* 1.4.1.4: tecla "Siguiente" del teclado. Si hay otra casilla debajo, salta a ella; si es la última, cierra el teclado.
   No guarda nada: para eso está el botón. En los textos largos (textarea) la tecla sigue haciendo una línea nueva. */
const TIPOS_TECLADO = ['text','number','search','email','tel','url','password',''];
const escribible = el => el && el.tagName==='INPUT' && TIPOS_TECLADO.includes((el.getAttribute('type')||'').toLowerCase());
function siguienteCasilla(el){
  const zona = el.closest('#hoja') || el.closest('#vista') || document.body;
  const l = [...zona.querySelectorAll('input,textarea')].filter(x=>(escribible(x) || x.tagName==='TEXTAREA') && !x.disabled && !x.readOnly && x.offsetParent!==null);
  const i = l.indexOf(el);
  return i>=0 ? l[i+1] || null : null;
}
document.addEventListener('focusin', e=>{ const el=e.target; if(escribible(el)) el.setAttribute('enterkeyhint', siguienteCasilla(el) ? 'next' : 'done'); });
document.addEventListener('keydown', e=>{
  const el = e.target;
  if(e.key!=='Enter' || !escribible(el) || e.isComposing) return;
  e.preventDefault();
  const sig = siguienteCasilla(el);
  if(sig) sig.focus(); else el.blur();
});

function ponerApero(id){

/* última vez que se usó una máquina: enganche o tramo de sesión */
function ultimoUso(id){

  return u;
}
/* orden de las máquinas: tractor y apero enganchados, el último apero usado, y el resto por uso */
function bloquesMaquinas(){
  const t = S.sel.tractor, a = S.sel.apero;
  const resto = [...S.tractores, ...S.aperos].map(x=>x.id).filter(id=>id!==t && id!==a)
    .map(id=>({id, u:ultimoUso(id)})).sort((x,y)=>y.u-x.u).map(x=>x.id);
  const ultimoAp = resto.find(id=>apero(id) && ultimoUso(id)>0);
  const bloques = [];
  const b1 = [t, a].filter(id=>id && (tractor(id)||apero(id)));
  if(b1.length) bloques.push({titulo: a ? 'Tractor y apero enganchado' : 'Tractor', ids:b1});
  if(ultimoAp) bloques.push({titulo:`Último apero usado: ${nombreMaq(ultimoAp)}`, ids:[ultimoAp]});
  resto.filter(id=>id!==ultimoAp).forEach(id=>bloques.push({titulo:nombreMaq(id), ids:[id]}));
  return bloques;
}
/* orden por horas que faltan; lo que va solo por tiempo, al final, por días */
function porHoras(a, b){
  const k = x => isFinite(x.r) ? (x.d < 0 ? Math.min(x.r, 0) : x.r) : null;
  const ka = k(a), kb = k(b);
  if(ka!==null && kb!==null) return ka - kb;
  if(ka!==null) return -1;
  if(kb!==null) return 1;
  return a.d - b.d;
}
/* al enganchar un apero: lo que le vence pronto */
function hojaEnganche(id){
  const ap = apero(id); if(!ap) return;
  const l = S.mants.filter(m=>m.maq===id).map(info)
    .filter(x=>x.e==='r' || x.r <= S.engancheH || x.d <= S.engancheD || marcaM(x.m)).sort(porHoras);
  if(!l.length) return;
  setTimeout(()=>abrirHoja(`<h3>${esc(ap.nombre)}: vence pronto</h3><p>Lo que le falta en las próximas ${fmtH(S.engancheH)} h o ${fmtH(S.engancheD)} días.</p>

/* 1.4.1.4 (nota 14): resumen al pulsar STOP, con "Deshacer" durante unos segundos.
   Deshacer solo anula el STOP: vuelve todo a como estaba justo antes (mismo modo, campo y apero), el tramo sigue abierto
   y el tiempo hasta deshacer cuenta seguido. Se quitan la posición del STOP, dónde quedó el tractor y el aviso de la granja. */
const SEG_DESHACER = 10;
function hojaResumenStop(ses, antes, marca){
  const camposT = [...new Set(ses.tramos.filter(t=>t.modo==='campo').map(t=> t.campo&&campo(t.campo) ? campo(t.campo).nombre : t.lugar&&lugar(t.lugar) ? lugar(t.lugar).nombre : null).filter(Boolean))];
  const aperosT = [...new Set(ses.tramos.map(t=>t.apero&&apero(t.apero) ? apero(t.apero).nombre : null).filter(Boolean))];
  const nRev = ses.tramos.filter(tramoPorRevisar).length;
  let quedan = SEG_DESHACER, tm = null;
  abrirHoja(`<h3>Sesión cerrada</h3>
    ${resumenSesion(ses.tramos)}
    ${htmlPasadas(ses.tramos)}
    ${nRev?`<div class="aviso-rev">Hay ${nRev} tramo${nRev>1?'s':''} por revisar.<button id="vr">Revisar en Días</button></div>`:''}
    <p style="margin-top:12px">${camposT.length ? `<b>${camposT.length>1?'Campos':'Campo'}:</b> ${camposT.map(esc).join(', ')}` : 'Sin campos identificados.'}<br>
    ${aperosT.length ? `<b>${aperosT.length>1?'Aperos':'Apero'}:</b> ${aperosT.map(esc).join(', ')}` : 'Sin apero.'}</p>
    <div class="acciones"><button id="desh">Deshacer (${quedan})</button><button class="ok" id="okr">Cerrar</button></div>`, ()=>{
      const fin = ()=>{ clearInterval(tm); const b=$('#desh'); if(b) b.remove(); };
      tm = setInterval(()=>{
        quedan--;
        const b = $('#desh');
        if(!b || !hojaAbierta){ clearInterval(tm); return; }
        if(quedan<=0) fin(); else b.textContent = `Deshacer (${quedan})`;
      }, 1000);
      enlazarPasadas();
      if($('#vr')) $('#vr').onclick=()=>{ clearInterval(tm); cerrarHoja(); setTimeout(()=>verDia(ses.inicio), 80); };
      $('#okr').onclick=()=>{ clearInterval(tm); cerrarHoja(); };
      $('#desh').onclick=()=>{
        clearInterval(tm);

  });
}

/* horas del horómetro sin ninguna sesión desde la lectura anterior (0 si hubo sesiones) */
function huecoSinSesiones(t, nuevo){
  const dif = nuevo - t.horometro;
  if(!(dif > 0)) return 0;
  const ult = S.lecturas.filter(l=>l.tractor===t.id).sort((a,b)=>b.fecha-a.fecha)[0];
  const desde = ult ? ult.fecha : (t.fechaAlta || 0);
  if(S.sesion && S.sesion.tractor===t.id) return 0;
  if(S.sesiones.some(s=>s.tractor===t.id && s.fin > desde)) return 0;
  return Math.round(dif*10)/10;
}
function hojaIgualar(t, horas, fin, seguir){
  const ap = apero(S.sel.apero), a = ap && esCompat(ap, t.id) ? ap : null;
  abrirHoja(`<h3>Han pasado ${fmtH(horas)} h sin sesiones</h3>
    <p>¿Qué hiciste? Se apuntan como una sesión para que cuenten los mantenimientos por horas de trabajo.</p>
    <p class="nota" style="margin-top:0">Apero enganchado: ${a ? `${esc(a.nombre)} (${a.tipo==='suspendido'?'suspendido':'arrastrado'})` : 'ninguno'}.</p>
    <button class="opc" data-m="campo"><span class="ico t">${I.campo}</span><span><span class="n">Campo</span><br><span class="s">${a?'Con '+esc(a.nombre):'Sin apero'}</span></span></button>
    <button class="opc" data-m="carretera"><span class="ico a">${I.road}</span><span><span class="n">Carretera</span><br><span class="s">${a?'Con '+esc(a.nombre):'Sin apero'}</span></span></button>
    <button class="opc" data-m="nose"><span class="ico a">?</span><span><span class="n">No lo sé</span><br><span class="s">Solo cuenta lo que vale igual en carretera y en campo</span></span></button>
    <div class="acciones"><button id="no">Ahora no</button></div>`,()=>{
      $('#no').onclick=()=>{ cerrarHoja(); setTimeout(seguir, 80); };
      $('#hoja').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
        /* la sesión acaba justo en la lectura del horómetro, para que la siguiente lectura sepa que después no hubo sesiones */
        const ini = fin - horas*H;
        const tr = {modo:b.dataset.m, tractor:t.id, apero:a?a.id:null, inicio:ini, fin}; if(a && a.forma) tr.forma = a.forma;
        /* las horas se suman enteras, aunque el mantenimiento se haya puesto a cero hace poco: el aviso sale antes, nunca tarde */
        S.mants.forEach(m=>{ if(cuentaEnTramo(m,tr)) m.acum += horas; });
        S.sesiones.push({inicio:ini, fin, tractor:t.id, tramos:[tr], igualada:true});
        guardar(); pintar(); toast(`${fmtH(horas)} h apuntadas`);
        seguir();
      });
  });
}

        $('#hoja').querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{ tocado=true; }));
        $('#no').onclick=()=>cerrarHoja();

          const r = {fecha:Date.now(), producto:prod, origen: prod==='adblue'?'coop':orig, tractor:t.id, apero:S.sel.apero};
          if(dep){
            const a=parseFloat($('#a').value), b=parseFloat($('#b').value);

/* 1.4.1.4 (nota 21): litros que quedan en el depósito del tractor, escritos a mano (mantener pulsado Repostar).
   Se guardan solos la hora, el horómetro (última lectura), el tractor, el apero, el modo, el campo o lugar y la posición.
   Servirán en Estadísticas (1.4.3) para el consumo por campo y apero; entre lecturas se reparte por horas. */
function nivelActual(){
  const tr = S.sesion ? S.sesion.tramos[S.sesion.tramos.length-1] : null;
  return {modo: !S.sesion ? null : tr.modo, campo: tr && tr.modo==='campo' ? (tr.campo||null) : null, lugar: tr && tr.modo==='campo' ? (tr.lugar||null) : null};
}
function textoNivel(n){
  const sitio = n.campo&&campo(n.campo) ? campo(n.campo).nombre : n.lugar&&lugar(n.lugar) ? lugar(n.lugar).nombre : n.pos ? lugarDe(n.pos) : null;
  const h = hace(n.fecha);
  return `${fmtH(n.litros)} L, ${h==='hoy'||h==='ayer'?h:fechaLarga(n.fecha)} a las ${hora(n.fecha)}${sitio?`, ${esc(sitio)}`:''}`;
}
function hojaLitros(){
  const t = tractor(S.sel.tractor); if(!t) return;
  const ult = S.niveles.filter(n=>n.tractor===t.id).sort((a,b)=>b.fecha-a.fecha)[0];
  abrirHoja(`<h3>Litros en el depósito del ${esc(t.nombre)}</h3>
    <p>Lo que marca ahora el tractor. Sirve para calcular el gasto por campo y apero: cuantas más veces lo apuntes, más exacto.</p>
    <label class="f" for="lt">Litros que quedan</label>
    <input id="lt" type="number" inputmode="decimal" step="1" min="0">
    ${t.capDeposito?`<button class="falla" id="lleno" type="button" style="margin-top:8px">Lleno (${fmtH(t.capDeposito)} L)</button>`:''}
    ${ult?`<p class="nota">Última vez: ${textoNivel(ult)}. <button class="enlace" id="borrarult" type="button">Borrar esa</button></p>`:''}
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`, ()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#lt').oninput=()=>{$('#err').textContent='';};
      if($('#lleno')) $('#lleno').onclick=()=>{ $('#lt').value=t.capDeposito; };
      if($('#borrarult')) $('#borrarult').onclick=()=>{
        abrirHoja(`<h3>Borrar la última lectura</h3><p>${textoNivel(ult)}. ¿La borras?</p><div class="acciones"><button id="no2">Cancelar</button><button class="peligro" id="si2">Borrar</button></div>`,()=>{
          $('#no2').onclick=hojaLitros;
          $('#si2').onclick=()=>{ S.niveles = S.niveles.filter(n=>n!==ult); guardar(); cerrarHoja(); toast('Lectura borrada'); };
        });
      };
      $('#si').onclick=()=>{
        const v = parseFloat(String($('#lt').value).replace(',','.'));
        if(isNaN(v)){ $('#err').textContent='Escribe los litros que marca el tractor.'; return; }
        if(v<0){ $('#err').textContent='Los litros no pueden ser negativos.'; return; }
        if(t.capDeposito && v>t.capDeposito){ $('#err').textContent=`Es más de lo que cabe en el depósito (${fmtH(t.capDeposito)} L).`; return; }
        const n = {fecha:Date.now(), tractor:t.id, apero:S.sel.apero||null, litros:v, horometro:t.horometro, ...nivelActual()};
        S.niveles.push(n); guardar(); cerrarHoja(); if(seccion==='gasoil') pintar(); toast(`${fmtH(v)} L apuntados`);
        leerPosicion(p=>{
          if(!p) return;
          n.pos = p;
          if(!n.campo && !n.lugar){ const c=campoEn(p); if(c) n.campo=c; else { const l=lugarEn(p); if(l) n.lugar=l; } }
          guardar();
        });
      };
  });
}

function horasTrabajo(id){

  },0),0);
}

    ${esT ? '' : `<h2 class="secc">Hectáreas por hora</h2><div class="lista">${ritmosApero(id).map(r=>filaRitmo(nombreCampo(r.campo)+(r.forma?' ('+nombreAperoForma(id, r.forma)+')':''), r)).join('') || '<div class="vacio" style="padding:14px">Todavía no has trabajado ningún campo con este apero.</div>'}</div>`}

function leerFormMant(tipo, estado, horometro){
  const rel = $('#mr') ? valSeg('#mr') : 'trabajo';

function crearMant(maqId, d, horometro){

  if(d.reloj==='motor') m.ultima = d.ultimo!=null ? d.ultimo : horometro;
  else {

function hojaNuevoMant(maqId){
  const tipo = tipoDe(maqId), t = tractor(maqId);
  abrirHoja(`<h3>Nuevo mantenimiento</h3><p>${(t||apero(maqId)).nombre}. Indica cuándo se hizo por última vez para que el aviso salga cuadrado.</p>${formMant(tipo,'usada',t?t.horometro:null)}<div class="err" id="err"></div><div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Añadir</button></div>`,()=>{
    enlazarCamaras(); enlazarFormMant('usada', t?t.horometro:null);
    $('#no').onclick=()=>cerrarHoja();
    $('#si').onclick=()=>{ const d=leerFormMant(tipo,'usada',t?t.horometro:null); if(d.error){ $('#err').textContent=d.error; return; } crearMant(maqId,d,t?t.horometro:null); guardar(); cerrarHoja(); pintar(); toast('Mantenimiento añadido'); };
  });
}

function hojaEditarMant(id){
  const m = S.mants.find(x=>x.id===id), t = tractor(m.maq), trab = m.reloj==='trabajo', esHa = m.reloj==='ha';
  const acumVis = trab ? Math.round(m.acum*10)/10 : esHa ? Math.round(((m.acum||0)+haDesde(m.maq, m.desde||m.fecha))*10)/10 : null;
  abrirHoja(`<h3>Editar mantenimiento</h3>
    <label class="f" for="mn">Nombre</label><input id="mn" value="${esc(m.nombre)}">
    <label class="f" for="mi">Cada cuántas ${esHa?'hectáreas':'horas'}</label>${campoNumero('mi', m.intervalo??undefined)}
    <label class="f" for="mm">O cada cuántos meses (opcional)</label><input id="mm" type="number" inputmode="numeric" min="1" step="1" placeholder="Sin límite por tiempo" value="${m.meses??''}">
    ${segQuien(m.quien)}
    ${trab ? `<label class="f" for="mc">Cuándo cuentan las horas</label><select id="mc">${opsCuenta(tipoDe(m.maq)).map(([v,x])=>`<option value="${v}" ${v===(m.cuenta||'campo')?'selected':''}>${x}</option>`).join('')}</select><p class="nota" style="margin-top:2px">Si la cambias, lo ya contado se queda y desde ahora cuenta con la nueva.</p>` : ''}
    ${trab && t ? `<label class="f" for="mh">Según el manual, cada (h de horómetro)</label>${campoNumero('mh', m.manualH??undefined)}` : ''}
    <label class="f" for="mo">Referencia del manual (opcional)</label><input id="mo" value="${esc(m.nota)}">
    <label class="f" for="md">Detalles (opcional)</label><textarea id="md" rows="4">${esc(m.detalles)}</textarea>
    <hr class="sep"><p class="peq">Última vez que se hizo</p>
    <label class="f" for="mu">${trab ? 'Horas de trabajo desde entonces' : esHa ? 'Hectáreas desde entonces' : 'Horómetro cuando se hizo'}</label>${campoNumero('mu', (trab||esHa) ? acumVis : (m.ultima??undefined))}
    <label class="f" for="mf">Fecha</label><input id="mf" type="date" value="${isoDe(m.fecha||Date.now())}" max="${hoyISO()}">
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div><div class="acciones"><button class="peligro" id="del">Borrar mantenimiento</button></div>`,()=>{
    enlazarCamaras(); enlazarSeg('#mq');
    $('#no').onclick=()=>cerrarHoja();
    $('#si').onclick=()=>{
      const n=$('#mn').value.trim(), iv=leerNum('mi'), me=leerMeses(), u=leerNum('mu'), mh=$('#mh')?leerNum('mh'):null;
      const err = t=>{ $('#err').textContent=t; };
      if(!n) return err('Escribe un nombre.');
      if(me.error) return err(me.error);
      if(iv==null && me.v==null) return err('Indica cada cuántas horas o cada cuántos meses toca.');
      if(iv!=null && !(iv>0)) return err('Las horas deben ser más de 0.');
      if(mh!=null && !(mh>0)) return err('Las horas del manual deben ser más de 0.');
      if(u!=null && u<0) return err('La última vez no puede ser negativa.');
      if(!trab && !esHa && t && u!=null && u>t.horometro) return err(`No puede ser mayor que el horómetro actual (${fmtH(t.horometro)} h).`);
      const f = fechaDe($('#mf').value);
      if(f > Date.now()+60000) return err('La fecha no puede ser futura.');
      const q=valSeg('#mq'), mo=$('#mo').value.trim(), md=$('#md').value.trim(), nc=$('#mc')?$('#mc').value:null;
      const aplicar = ()=>{
      m.nombre=n; m.intervalo=iv; m.meses=me.v; m.quien=q; m.nota=mo; m.detalles=md; m.fecha=f;
      if(trab && nc && nc!==(m.cuenta||'campo')){
        /* lo que llevaba el tramo abierto se cuenta con la regla vieja; desde ahora, con la nueva */
        const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1];
        if(tr && !tr.fin && cuentaEnTramo(m,tr)) m.acum += Math.max(0,(Date.now()-Math.max(tr.inicio, m.desde||0))/H);
        m.desde = Date.now(); m.cuenta = nc;
      }
      if(esHa){
        if(u!=null && Math.abs(u-acumVis)>0.05){ m.acum=u; m.desde=Date.now(); }
      } else if(trab){
        if(u!=null && Math.abs(u-acumVis)>0.05){ m.acum=u; m.desde=Date.now(); if(t) m.ultimaHoro=Math.max(0,t.horometro-u); }
        if(t){ m.manualH = mh||null; if(m.manualH && m.ultimaHoro==null) m.ultimaHoro=Math.max(0,t.horometro-m.acum); }
      } else if(u!=null) m.ultima=u;
      else if(m.ultima==null && t) m.ultima=t.horometro;
      guardar(); cerrarHoja(); pintar(); toast('Mantenimiento actualizado');
      };
      if(trab && nc && nc!==(m.cuenta||'campo')){
        const ops = Object.fromEntries(opsCuenta(tipoDe(m.maq)));
        abrirHoja(`<h3>¿Cambiar cuándo cuentan las horas?</h3><p>${esc(m.nombre)}: de «${esc(ops[m.cuenta||'campo']||m.cuenta)}» a «${esc(ops[nc])}». Lo ya contado se queda; desde ahora cuenta con la nueva.</p><div class="acciones"><button id="no3">Cancelar</button><button class="ok" id="si3">Cambiar</button></div>`,()=>{
          $('#no3').onclick=()=>cerrarHoja(); $('#si3').onclick=aplicar; });
      } else aplicar();
    };
    $('#del').onclick=()=>abrirHoja(`<h3>¿Borrar ${esc(m.nombre)}?</h3><p>Deja de contar y desaparece de los avisos. El historial de veces que se hizo se conserva.</p><div class="acciones"><button id="no2">Cancelar</button><button class="peligro" id="si2">Borrar</button></div>`,()=>{
      $('#no2').onclick=()=>cerrarHoja();
      $('#si2').onclick=()=>{ S.mants=S.mants.filter(x=>x.id!==id); guardar(); cerrarHoja(); pintar(); toast('Mantenimiento borrado'); };
    });
  });
}

function asistente(base){
  const w = base || {paso:1, nombre:'', tipo:'autopropulsada', estado:'nueva', horometro:'', mants:[]};
  const total = () => w.tipo==='autopropulsada' ? 3 : 4;
  const cab = t => `<p class="wz">Paso ${w.paso} de ${total()}</p><h3>${t}</h3>`;
  const pie = (sig) => `<div class="err" id="err"></div><div class="acciones"><button id="atr">${w.paso===1?'Cancelar':'Atrás'}</button><button class="ok" id="sig">${sig}</button></div>`;
  const atras = () => { if(w.paso===1) cerrarHoja(); else { w.paso--; asistente(w); } };
  const horo = () => w.tipo==='autopropulsada' ? parseFloat(w.horometro) : null;
  if(w.paso===1){
    abrirHoja(`${cab('Nueva máquina')}<label class="f" for="nm">Nombre</label><input id="nm" placeholder="Puma 240" value="${w.nombre.replace(/"/g,'&quot;')}">
      <label class="f">Tipo</label><div class="seg" id="tp">${Object.entries(TIPOS).map(([v,t])=>`<button data-v="${v}" class="${w.tipo===v?'sel':''}">${t}</button>`).join('')}</div>
      <p class="nota">Autopropulsada: tractores, cosechadora. Arrastrado: va sobre sus ruedas. Suspendido: va colgado del alza.</p>${pie('Siguiente')}`,()=>{
        $('#tp').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(w.tipo!==b.dataset.v){ w.tipo=b.dataset.v; w.mants=[]; } w.nombre=$('#nm').value; asistente(w); });
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{ w.nombre=$('#nm').value.trim(); if(!w.nombre){ $('#err').textContent='Escribe un nombre.'; return; } w.paso=2; asistente(w); };
    });
  } else if(w.paso===2){
    abrirHoja(`${cab('¿Nueva o usada?')}<div class="seg" id="es"><button data-v="nueva" class="${w.estado==='nueva'?'sel':''}">Nueva</button><button data-v="usada" class="${w.estado==='usada'?'sel':''}">Usada</button></div>
      <p class="nota">${w.estado==='nueva'?'Los mantenimientos empiezan desde cero.':'En el siguiente paso indicarás cuándo se hizo cada mantenimiento por última vez.'}</p>
      ${w.tipo==='autopropulsada'?`<label class="f" for="ho">Horas del horómetro ahora</label>${campoNumero('ho', w.horometro===''?undefined:w.horometro)}<p class="nota">Aunque sea nueva, puede traer algunas horas.</p>`:'<p class="nota">Los aperos no tienen horómetro: sus horas las cuenta la app con las sesiones.</p>'}${pie('Siguiente')}`,()=>{
        enlazarCamaras();
        $('#es').querySelectorAll('button').forEach(b=>b.onclick=()=>{ w.estado=b.dataset.v; if($('#ho')) w.horometro=$('#ho').value; asistente(w); });
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{
          if(w.tipo==='autopropulsada'){ w.horometro=$('#ho').value; const h=parseFloat(w.horometro); if(isNaN(h)||h<0){ $('#err').textContent='Indica las horas del horómetro.'; return; } }
          w.paso=3; asistente(w);
        };
    });
  } else if(w.paso===3){
    const lista = w.mants.map((m,k)=>`<div class="mitem"><span>${esc(m.nombre)}<span class="s">${cadaTexto(m)}${m.intervalo?(m.reloj==='motor'?', horómetro':m.reloj==='ha'?', hectáreas':', horas de trabajo'):''}${m.quien==='taller'?', taller':''}${w.estado==='usada'&&m.intervalo&&m.ultimo!=null&&!m.plantilla?(m.reloj==='motor'?`, última a las ${fmtH(m.ultimo)} h`:`, hace ${fmtH(m.ultimo)} h`):''}${w.estado==='usada'&&m.ultimo==null?', falta la última vez':''}</span></span><button data-k="${k}" aria-label="Quitar ${esc(m.nombre)}">×</button></div>`).join('');
    const hayPlantilla = w.mants.some(m=>m.plantilla);
    abrirHoja(`${cab('Mantenimientos')}<p>Añade los que quieras ahora; más adelante puedes añadir otros desde la ficha.</p>
      ${w.tipo==='autopropulsada' && !hayPlantilla ? `<button class="chip" id="pl" style="width:100%;margin-bottom:10px">Cargar plantilla ${PLANTILLA.nombre}</button>` : ''}
      ${hayPlantilla && w.estado==='usada' ? `<p class="nota">Los de la plantilla empiezan a contar desde hoy. Después, en la ficha, corrige la última vez de cada uno con Editar.</p>` : ''}
      ${lista?`<div>${lista}</div>`:''}
      <div class="caja">${formMant(w.tipo, w.estado, horo())}<div class="err" id="err2"></div><div class="acciones"><button id="add">Añadir a la lista</button></div></div>
      ${pie(total()===3?'Guardar máquina':'Siguiente')}`,()=>{
        enlazarCamaras(); enlazarFormMant(w.estado, horo());
        document.querySelectorAll('.mitem button').forEach(b=>b.onclick=()=>{ w.mants.splice(+b.dataset.k,1); asistente(w); });
        if($('#pl')) $('#pl').onclick=()=>{
          PLANTILLA.mants.forEach(p=>{ if(!w.mants.some(m=>m.nombre===p.nombre)) w.mants.push({...p, plantilla:true, ultimo: w.estado==='usada' ? (p.reloj==='motor' ? horo() : 0) : null, fecha:Date.now()}); });
          w.rutina = [...PLANTILLA.rutina]; asistente(w);
        };
        $('#add').onclick=()=>{ const d=leerFormMant(w.tipo, w.estado, horo()); if(d.error){ $('#err2').textContent=d.error; return; } w.mants.push(d); asistente(w); };
        $('#atr').onclick=atras;
        $('#sig').onclick=()=>{
          if(w.estado==='usada' && w.mants.some(m=>m.ultimo==null)){ $('#err').textContent='Falta indicar la última vez de algún mantenimiento: quítalo y vuelve a añadirlo.'; return; }
          if(total()===3) finalizar(); else { w.paso=4; asistente(w); }
        };
    });
  } else {
    abrirHoja(`${cab('Compatibilidad')}<p>Con qué tractores se puede usar este apero.</p><div class="seg"><button class="sel">Todos los tractores</button></div><p class="nota">Elegir tractores concretos llegará en una versión siguiente.</p>${pie('Guardar apero')}`,()=>{
      $('#atr').onclick=atras;
      $('#sig').onclick=finalizar;
    });
  }
  function finalizar(){
    const id = nuevoId(w.tipo==='autopropulsada'?'t':'a');
    if(w.tipo==='autopropulsada'){ const h=parseFloat(w.horometro); S.tractores.push({id, nombre:w.nombre, horometro:h, horometroAlta:h, fechaAlta:Date.now(), rutina:w.rutina||[]}); if(!S.sel.tractor) S.sel.tractor=id; }
    else { S.aperos.push({id, nombre:w.nombre, tipo:w.tipo, compatTodos:true, compat:[]}); if(!S.sel.apero) S.sel.apero=id; }
    w.mants.forEach(d=>crearMant(id, w.estado==='usada'?d:{...d, ultimo:null}, horo()));
    guardar(); cerrarHoja(); toast(`${w.nombre} añadido`);
    setTimeout(()=>{ seccion='maquinas'; maqFicha=id; history.pushState({s:'maquinas'},''); pintar(); }, 80);
  }
}

/* ---------- días pasados ---------- */
const FL = {
  izq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  der:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
let diasModo='cal', calMes=null, diaSel=null;
const inicioDia = ms => { const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const sumarDias = (ms,n) => { const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); };
const hora = ms => new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const nombreApero = id => { const a=apero(id); return a ? a.nombre : 'Sin apero'; };
const formaDe = a => a && a.formas ? (a.formas.find(f=>f.id===a.forma) || a.formas[0]) : null;
const nombreModo = m => m==='campo' ? 'Campo' : m==='nose' ? 'Sin saber (igualado)' : m==='parado' ? 'Parado' : 'Carretera';
function todasSesiones(){
  const l = S.sesiones.map((s,i)=>({s,i}));
  if(S.sesion){ const tr=S.sesion.tramos.map(t=>({...t, fin:t.fin||Date.now()})); l.push({s:{...S.sesion, tramos:tr, fin:Date.now()}, i:-1}); }
  return l;
}
function diasTrabajados(){
  const set = new Set();
  todasSesiones().forEach(({s})=>{ for(let d=inicioDia(s.inicio); d<s.fin; d=sumarDias(d,1)) set.add(d); });
  return set;
}

function pintarDias(){
  if(diasModo==='dia') return pintarDia();
  if(calMes==null){ const d=new Date(); calMes=new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  const m = new Date(calMes), anio=m.getFullYear(), mes=m.getMonth();
  const primero = (new Date(anio,mes,1).getDay()+6)%7, nd = new Date(anio,mes+1,0).getDate();
  const trab = diasTrabajados(), hoy = inicioDia(Date.now()), revd = diasPorRevisar();
  let celdas = ['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<primero;i++) celdas += '<div></div>';
  for(let d=1; d<=nd; d++){
    const ms = new Date(anio,mes,d).getTime(), con = trab.has(ms);
    celdas += `<button data-d="${ms}" class="${con?'con':''} ${ms===hoy?'hoy':''} ${revd.has(ms)?'rev':''}" aria-label="${d}${con?', con trabajo':''}${revd.has(ms)?', con tramos por revisar':''}">${d}${con?'<span class="pt"></span>':''}</button>`;
  }
  const titulo = m.toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="pm" aria-label="Mes anterior">${FL.izq}</button><h2>${titulo}</h2><button class="flecha" id="sm" aria-label="Mes siguiente">${FL.der}</button></div><div class="cal">${celdas}</div><p class="pista">Toca un día para verlo en formato agenda.</p><button class="btn-add" id="addses">+ Añadir sesión a mano</button>`;
  $('#addses').onclick=()=>hojaSesionManual();
  $('#pm').onclick=()=>{ const x=new Date(calMes); x.setMonth(x.getMonth()-1); calMes=x.getTime(); pintarDias(); };
  $('#sm').onclick=()=>{ const x=new Date(calMes); x.setMonth(x.getMonth()+1); calMes=x.getTime(); pintarDias(); };
  document.querySelectorAll('.cal button').forEach(b=>b.onclick=()=>{ diaSel=+b.dataset.d; diasModo='dia'; history.pushState({s:'dias'},''); pintarDias(); });
}

function pintarDia(){
  const d0=diaSel, d1=sumarDias(d0,1), PX=56;
  const bloques=[];
  todasSesiones().forEach(({s,i})=>{
    s.tramos.forEach(t=>{
      const a=Math.max(t.inicio,d0), b=Math.min(t.fin,d1);
      if(b>a) bloques.push({a,b,t,i,partida: t.inicio<d0 || t.fin>d1});
    });
  });
  const titulo = new Date(d0).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
  let cuerpo;
  if(!bloques.length){ cuerpo = '<div class="lista"><div class="vacio" style="padding:16px">Este día no hay sesiones.</div></div>'; }
  else {
    const hIni = Math.max(0, Math.floor((Math.min(...bloques.map(x=>x.a))-d0)/H)-1);
    const hFin = Math.min(24, Math.ceil((Math.max(...bloques.map(x=>x.b))-d0)/H)+1);
    let html = '';
    for(let h=hIni; h<=hFin; h++) html += `<div class="hl" style="top:${(h-hIni)*PX}px">${String(h).padStart(2,'0')}:00</div>`;
    bloques.forEach(x=>{
      const top=((x.a-d0)/H-hIni)*PX, alto=Math.max(24,(x.b-x.a)/H*PX-2);
      const txt=`${nombreModo(x.t.modo)}, ${nombreApero(x.t.apero)}<br>${hora(x.a)} a ${x.i===-1&&x.t.fin>=Date.now()-1000?'ahora':hora(x.b)} (${durTxt(x.t.fin-x.t.inicio)})${x.partida?' (sesión partida)':''}`;
      html += `<button class="blk ${x.t.modo} ${x.i===-1?'abierta':''} ${x.i>=0&&tramoPorRevisar(x.t)?'rev':''}" data-i="${x.i}" style="top:${top+1}px;height:${alto}px">${txt}</button>`;
    });
    cuerpo = `${resumenDia(bloques)}<div class="agenda" style="height:${(hFin-hIni)*PX+8}px">${html}</div>${mapaRutaDia(d0, d1)}`;
  }
  $('#vista').innerHTML = `<div class="mes"><button class="flecha" id="pd" aria-label="Día anterior">${FL.izq}</button><h2>${titulo}</h2><button class="flecha" id="sd" aria-label="Día siguiente">${FL.der}</button></div>${cuerpo}<p class="pista">Toca un tramo para ver y corregir su sesión. Para volver al calendario, usa atrás.</p><button class="btn-add" id="addses">+ Añadir sesión a este día</button><button class="btn-add" id="bluca" style="margin-top:8px">Datos para Luca</button>`;
  $('#addses').onclick=()=>hojaSesionManual(diaSel);
  $('#bluca').onclick=()=>hojaLuca(diaSel);
  $('#pd').onclick=()=>{ diaSel=sumarDias(diaSel,-1); pintarDias(); };
  $('#sd').onclick=()=>{ diaSel=sumarDias(diaSel,1); pintarDias(); };
  document.querySelectorAll('.blk').forEach(b=>b.onclick=()=>hojaSesion(+b.dataset.i));
}

function aporte(m, tramos){
  return tramos.reduce((s,t)=> s + (cuentaEnTramo(m,t) ? Math.max(0,(t.fin - Math.max(t.inicio, m.desde||0))/H) : 0), 0);
}

/* 1.4.1.1 (nota 19): horas de la sesión: total trabajado y, aparte, campo, carretera, sin saber y pausas */
const durTxt = ms => { const m=Math.round(ms/60000), h=Math.floor(m/60), r=m%60; return h ? `${h} h${r?` ${r} min`:''}` : `${r} min`; };
function resumenSesion(d){
  const ini=d[0].inicio, fin=d[d.length-1].fin, por={campo:0,carretera:0,nose:0,parado:0};
  d.forEach(t=>{ const k = por[t.modo]!=null ? t.modo : 'carretera'; por[k]+=Math.max(0,t.fin-t.inicio); });
  const trab = por.campo+por.carretera+por.nose, pausa = Math.max(0, (fin-ini)-trab); /* parado = tramos de parado + huecos sueltos */
  const partes = [['campo','Campo',por.campo],['carretera','Carretera',por.carretera]];
  if(por.nose) partes.push(['nose','Sin saber',por.nose]);
  partes.push(['parado','Parado',pausa]);
  return `<div class="resu" aria-label="Horas de la sesión"><div class="tot"><span class="v">${durTxt(trab)}</span><br><span class="k">Total trabajado</span></div><div class="partes" style="grid-template-columns:repeat(${partes.length},1fr)">${partes.map(([c,k,v])=>`<div class="${c}"><span class="v">${durTxt(v)}</span><br><span class="k">${k}</span></div>`).join('')}</div></div>`;
}
function hojaSesion(i, borrador){
  if(i===-1){
    const sa = todasSesiones().find(x=>x.i===-1);
    abrirHoja(`<h3>Sesión en curso</h3>${sa?resumenSesion(sa.s.tramos):''}<p>Esta sesión sigue abierta. Podrás ajustarla al pararla o, después, desde aquí.</p><div class="acciones"><button id="no">Cerrar</button></div>`,()=>$('#no').onclick=()=>cerrarHoja());
    return;
  }
  const ses = S.sesiones[i];
  const d = borrador || ses.tramos.map(t=>({...t}));
  const cambiado = JSON.stringify(d)!==JSON.stringify(ses.tramos);
  const ini=d[0].inicio, fin=d[d.length-1].fin, total=d.reduce((s,t)=>s+(t.fin-t.inicio),0)/H;
  const cruza = inicioDia(ini)!==inicioDia(fin-1);
  const lista = d.map((t,j)=>`<button class="tramo" data-j="${j}"><span class="bar ${t.modo}"></span><span>${nombreModo(t.modo)}${tramoPorRevisar(t)?'<span class="rvtag">Por revisar</span>':''}<br><span class="s" style="font-size:13px;color:var(--text2)">${nombreApero(t.apero)}${t.modo==='campo'?', '+esc(sitioTramo(t)):rutaTramo(d,j,ses)?', '+esc(rutaTramo(d,j,ses)):''}${tramoPorRevisar(t)?' · '+esc(motivoRevision(t)):''}</span></span><span class="der">${hora(t.inicio)} a ${hora(t.fin)}<br><span class="dur">${durTxt(t.fin-t.inicio)}</span></span></button>`).join('');
  abrirHoja(`<h3>Sesión de ${hora(ini)} a ${hora(fin)}</h3>
    ${resumenSesion(d)}${htmlPasadas(d)}
    <p>${tractor(ses.tractor).nombre}.${ses.aMano?' Sesión a mano.':''}${cruza?' Cruza la medianoche: se ve en los dos días.':''}${cambiado?' Tienes cambios sin guardar.':''}</p>
    <div class="tramos">${lista}</div>
    <p class="nota">Toca un tramo para cambiar sus horas, su modo o su apero, o para meter un cambio de apero a una hora.</p>
    <div class="acciones"><button id="no">${cambiado?'Descartar':'Cerrar'}</button><button class="ok" id="si" ${cambiado?'':'style="display:none"'}>Revisar y guardar</button></div>
    ${!cambiado && d.some(tramoPorRevisar) ? '<div class="acciones"><button id="rv">Marcar todo como revisado</button></div>' : ''}
    <div class="acciones"><button class="peligro" id="del">Borrar sesión</button></div>`,()=>{
      enlazarPasadas();
      if($('#rv')) $('#rv').onclick=()=>{ ses.tramos.forEach(t=>{ if(t.fin) t.revisado=true; }); guardar(); pintar(); hojaSesion(i); toast('Tramos marcados como revisados'); };
      document.querySelectorAll('.tramo').forEach(b=>b.onclick=()=>hojaTramo(i, d, +b.dataset.j));
      $('#no').onclick=()=>cerrarHoja();

function hojaTramo(i, d, j){
  const t = d[j], ses = S.sesiones[i];
  const aps = S.aperos.filter(a=>esCompat(a, ses.tractor));
  const opsAp = sel => `<option value="" ${!sel?'selected':''}>Sin apero</option>` + aps.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.nombre}</option>`).join('');
  abrirHoja(`<h3>Tramo ${j+1} de ${d.length}</h3>
    <div class="seg" id="md"><button data-v="carretera" class="${t.modo==='carretera'?'sel':''}">Carretera</button><button data-v="campo" class="${t.modo==='campo'?'sel':''}">Campo</button><button data-v="parado" class="${t.modo==='parado'?'sel':''}">Parado</button></div>
    <label class="f" for="ti">Empieza</label><input type="datetime-local" id="ti" value="${aLocal(t.inicio)}">
    <label class="f" for="tf">Termina</label><input type="datetime-local" id="tf" value="${aLocal(t.fin)}">
    <label class="f" for="ta">Apero</label><select id="ta">${opsAp(t.apero)}</select><div id="fmw"></div>
    <div id="cmpw" ${t.modo==='campo'?'':'style="display:none"'}><label class="f" for="tc">Campo</label><select id="tc"><option value="">Sin identificar</option>${S.campos.map(c=>`<option value="${c.id}" ${c.id===t.campo?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <p class="nota posic">${t.modo==='carretera' ? `Desde: ${filaPos(origenTramo(d,j,ses), t.posIni)}<br>Hasta: ${filaPos(destinoTramo(d,j), t.posFin)}` : `Desde: ${textoPos(t.posIni)}<br>Hasta: ${textoPos(t.posFin)}`}</p>
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Volver</button><button class="ok" id="si">Aplicar</button></div>
    <hr class="sep"><p class="peq">Cambio de apero dentro de este tramo</p>
    <p class="nota" style="margin-top:0">Si a mitad del tramo cambiaste de apero y no lo marcaste.</p>
    <label class="f" for="dh">A qué hora</label><input type="datetime-local" id="dh" value="${aLocal(t.inicio+(t.fin-t.inicio)/2)}">
    <label class="f" for="da">Nuevo apero</label><select id="da">${opsAp(t.apero ? null : aps[0]?.id)}</select>
    <div class="err" id="err2"></div>
    <div class="acciones"><button id="div">Meter cambio de apero</button></div>`,()=>{
      const pintarFm = ()=>{
        const ap = apero($('#ta').value), w = $('#fmw');
        if(ap && ap.formas){ const sel = ap.id===t.apero && t.forma ? t.forma : ap.forma; w.innerHTML = `<label class="f" for="tfm">Forma de uso</label><select id="tfm">${ap.formas.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.nombre)}</option>`).join('')}</select>`; }
        else w.innerHTML = '';
      };
      pintarFm(); $('#ta').onchange = pintarFm;
      let modo=t.modo;
      $('#md').querySelectorAll('button').forEach(b=>b.onclick=()=>{ modo=b.dataset.v; $('#md').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b)); $('#cmpw').style.display = modo==='campo' ? '' : 'none'; });
      $('#no').onclick=()=>hojaSesion(i, d);
      $('#si').onclick=()=>{
        const ni = $('#ti').value===aLocal(t.inicio) ? t.inicio : new Date($('#ti').value).getTime(), nf = $('#tf').value===aLocal(t.fin) ? t.fin : new Date($('#tf').value).getTime();
        if(isNaN(ni)||isNaN(nf)){ $('#err').textContent='Indica las dos horas.'; return; }
        if(nf<=ni){ $('#err').textContent='El final debe ser posterior al inicio.'; return; }
        if(j>0 && ni<=d[j-1].inicio){ $('#err').textContent=`No puede empezar antes de que empiece el tramo anterior (${hora(d[j-1].inicio)}).`; return; }
        if(j<d.length-1 && nf>=d[j+1].fin){ $('#err').textContent=`No puede terminar después de que termine el tramo siguiente (${hora(d[j+1].fin)}).`; return; }
        if(nf>Date.now()){ $('#err').textContent='No puede terminar en el futuro.'; return; }
        const oi=t.inicio, of=t.fin, oa=t.apero||null, oc=t.campo||null, ofm=t.forma||null;
        t.inicio=ni; t.fin=nf; t.modo=modo; t.apero=$('#ta').value||null; t.revisado=true; delete t.revisar;
        { const ap=apero(t.apero); if(ap && ap.formas){ const e=$('#tfm'); t.forma = e ? e.value : ap.forma; } else delete t.forma; }
        if(modo==='campo'){ const nc=$('#tc').value||null; if(nc!==oc || t.apero!==oa || (t.forma||null)!==ofm || (nc && t.apero && !t.trabajo)) asignarCampo(t, nc, ses.inicio, true); }
        /* si había una pausa entre tramos, se respeta; solo se mueve el vecino si iba pegado o si se pisan */
        if(j>0 && (d[j-1].fin===oi || d[j-1].fin>ni)) d[j-1].fin=ni;
        if(j<d.length-1 && (d[j+1].inicio===of || d[j+1].inicio<nf)) d[j+1].inicio=nf;
        hojaSesion(i, d);
      };
      $('#div').onclick=()=>{
        const h=new Date($('#dh').value).getTime(), na=$('#da').value||null;
        if(isNaN(h)){ $('#err2').textContent='Indica la hora del cambio.'; return; }
        if(h<=t.inicio || h>=t.fin){ $('#err2').textContent=`La hora debe estar entre ${hora(t.inicio)} y ${hora(t.fin)}.`; return; }
        if(na===t.apero){ $('#err2').textContent='Elige un apero distinto del que ya lleva el tramo.'; return; }
        const nt = {...t, inicio:h, apero:na, posIni:null}; delete nt.trabajo; { const apn=apero(na); if(apn && apn.formas) nt.forma=apn.forma; else delete nt.forma; } t.fin=h; t.posFin=null;
        if(nt.modo==='campo') asignarCampo(nt, t.campo||null, ses.inicio, true);
        d.splice(j+1,0,nt);
        hojaSesion(i, d);
      };
  });
}

function hojaPrevia(i, d, borrar){
  const ses = S.sesiones[i];
  const cambios = S.mants.map(m=>{
    const delta = aporte(m,d) - aporte(m,ses.tramos);
    return {m, delta, antes:horasRestantes(m), despues:horasRestantes(m)-delta};
  }).filter(x=>Math.abs(x.delta)>0.001);
  const est = (r,m) => r<0 ? 'pasado' : r<umbralDe(m) ? 'inminente' : 'al día';
  const lista = cambios.length ? cambios.map(x=>`<div class="cambio"><span>${x.m.nombre}<br><span class="s">${nombreMaq(x.m.maq)}</span></span><span style="text-align:right">${textoRestante(x.antes)}<br><span class="s">pasa a ${textoRestante(x.despues)}${est(x.antes,x.m)!==est(x.despues,x.m)?', '+est(x.despues,x.m):''}</span></span></div>`).join('') : '<p>No cambia ningún mantenimiento.</p>';
  abrirHoja(`<h3>${borrar?'¿Borrar esta sesión?':'Revisa los cambios'}</h3><p>${borrar?'Se quitan sus horas de los mantenimientos que aún no se han hecho desde entonces.':'Así quedan los mantenimientos afectados. Los hechos después de esta sesión no cambian.'}</p>${lista}
    <div class="acciones"><button id="no">Volver</button><button class="${borrar?'peligro':'ok'}" id="si">${borrar?'Borrar':'Guardar'}</button></div>`,()=>{
      $('#no').onclick=()=>hojaSesion(i, borrar?undefined:d);
      $('#si').onclick=()=>{
        cambios.forEach(x=>{ if(x.m.reloj==='trabajo') x.m.acum=Math.max(0,x.m.acum+x.delta); });
        if(!S.cambios) S.cambios=[];
        S.cambios.push({fecha:Date.now(), tipo:borrar?'borrar-sesion':'editar-sesion', sesionInicio:ses.inicio, antes:ses.tramos, despues:d});
        if(borrar) S.sesiones.splice(i,1);
        else { ses.tramos=d; ses.inicio=d[0].inicio; ses.fin=d[d.length-1].fin; }
        guardar(); cerrarHoja(); pintar(); toast(borrar?'Sesión borrada':'Sesión corregida');
      };
  });
}

const eur = n => n==null ? '' : n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const eurL = n => n==null ? '' : n.toLocaleString('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3})+' €/L';
const fecha = ms => new Date(ms).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+', '+new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

function calcDeposito(){
  const D=S.deposito, cap=D.capacidad;
  const evs=[...D.movs.map(m=>({...m})),
    ...S.repostajes.map((r,i)=>({r,i})).filter(x=>x.r.producto==='gasoil'&&x.r.origen==='dep').map(x=>({tipo:'salida',fecha:x.r.fecha,litros:x.r.litros,key:'r'+x.i}))
  ].sort((a,b)=>a.fecha-b.fecha);
  let stock=null, pm=null, pendiente=false, salidas=[], iniciado=false, ultimoAjuste=null, ultimoLleno=null;
  const info={};
  for(const e of evs){
    if(e.tipo==='inicio'){ iniciado=true; pm=e.importe/e.litros; stock=cap; salidas=[]; ultimoLleno=e.fecha; }
    else if(e.tipo==='compra'){
      if(e.litros==null||e.importe==null){ pendiente=true; info[e.id]={pendiente:true}; if(e.lleno&&iniciado){ stock=cap; salidas=[]; ultimoLleno=e.fecha; } continue; }
      if(!iniciado){ info[e.id]={}; continue; }
      const base=Math.max(stock,0); pm=(base*pm+e.importe)/(base+e.litros); stock+=e.litros;
      if(e.lleno){
        const des=cap-stock, suma=salidas.reduce((s,x)=>s+x.litros,0);
        const f = suma>0 ? Math.max(0,(suma-des)/suma) : 1;
        salidas.forEach(x=>{ info[x.key].ajustados=x.litros*f; });
        ultimoAjuste={fecha:e.fecha, litros:des, pct: suma>0 ? Math.abs(des)/suma*100 : 0};
        info[e.id]={desajuste:des}; stock=cap; salidas=[]; ultimoLleno=e.fecha;
      } else info[e.id]={};
    }
    else if(e.tipo==='salida'||e.tipo==='otro'){
      const key = e.tipo==='salida' ? e.key : e.id;
      info[key]={coste: pm!=null ? e.litros*pm : null, provisional:pendiente};
      if(iniciado){ stock-=e.litros; salidas.push({key,litros:e.litros}); }
    }
  }
  return {iniciado, stock, pm, pendiente, info, ultimoAjuste, ultimoLleno, cap};
}

function pintarComb(){
  const C = calcDeposito();
  const items = [
    ...S.repostajes.map((r,i)=>({fecha:r.fecha, k:'r'+i, r})),
    ...S.deposito.movs.map(m=>({fecha:m.fecha, k:m.id, m}))
  ].sort((a,b)=>b.fecha-a.fecha);
  const fila = it => {
    const inf = C.info[it.k] || {};
    if(it.r){
      const r=it.r, t=tractor(r.tractor);
      const tit = r.producto==='adblue' ? 'AdBlue, cooperativa' : (r.origen==='dep' ? 'Gasoil del depósito' : 'Gasoil, cooperativa');
      let der = `${fmtH(r.litros)} L`, sub='';
      if(r.origen==='dep'){
        if(inf.ajustados!=null) der = `${fmtH(inf.ajustados)} L`, sub = `marcados ${fmtH(r.litros)} L`;
        else if(inf.coste!=null) sub = `${inf.provisional?'≈ ':''}${eur(inf.coste)}`;
      } else sub = eur(r.importe);
      return `<div class="mov"><span class="fx"><span class="n">${tit}</span><br><span class="s">${t?t.nombre:''}, ${fecha(r.fecha)}</span></span><span class="der">${der}<span class="s">${sub}</span></span></div>`;
    }
    const m = it.m;
    if(m.tipo==='inicio') return `<div class="mov"><span class="fx"><span class="n">Puesta en marcha del depósito</span><br><span class="s">${fecha(m.fecha)}</span><br><span class="tag ok">Lleno, ${fmtH(C.cap)} L</span></span><span class="der">${fmtH(m.litros)} L<span class="s">${eur(m.importe)}</span></span></div>`;
    if(m.tipo==='otro') return `<div class="mov"><span class="fx"><span class="n">Salida del depósito</span><br><span class="s">${m.nota||'Otros usos'}, ${fecha(m.fecha)}</span></span><span class="der">${fmtH(m.litros)} L<span class="s">${inf.coste!=null?(inf.provisional?'≈ ':'')+eur(inf.coste):''}</span></span></div>`;
    if(inf.pendiente) return `<button class="mov" data-comp="${m.id}"><span class="fx"><span class="n">Pedido de gasoil</span><br><span class="s">${fecha(m.fecha)}</span><br><span class="tag">Faltan datos, toca para completar</span>${m.lleno?' <span class="tag ok">Lleno</span>':''}</span><span class="der">${m.litros!=null?fmtH(m.litros)+' L':''}</span></button>`;
    const des = inf.desajuste!=null ? `<br><span class="s">Desajuste ${inf.desajuste>=0?'+':''}${fmtH(inf.desajuste)} L</span>` : '';
    return `<div class="mov"><span class="fx"><span class="n">Pedido de gasoil</span><br><span class="s">${fecha(m.fecha)}</span>${m.lleno?'<br><span class="tag ok">Lleno</span>':''}${des}</span><span class="der">${fmtH(m.litros)} L<span class="s">${eur(m.importe)}</span></span></div>`;
  };
  let dep;
  if(!C.iniciado){
    dep = `<section class="dep"><div class="tit">Depósito de la bajera</div><p class="s" style="margin:6px 0 10px">Ponlo en marcha el día que lo llenes entero: así la app sabrá cuánto hay.</p><button class="chip" id="bi" style="width:100%">Poner en marcha el depósito</button></section>`;
  } else {
    const st = Math.max(0, C.stock), pct = Math.min(100, st/C.cap*100);
    const a = C.ultimoAjuste;
    const desHtml = a ? `<div class="des ${a.pct>S.umbralDesajuste?'alerta':''}">Último llenado: desajuste de ${a.litros>=0?'+':''}${fmtH(a.litros)} L${a.pct?` (${fmtH(a.pct)} % de lo repostado)`:''}${a.pct>S.umbralDesajuste?'. Revisa si falta algún repostaje por apuntar.':''}</div>` : '';
    dep = `<section class="dep" aria-label="Depósito de la bajera"><div class="tit">Depósito de la bajera</div><div class="big">≈ ${Math.round(st).toLocaleString('es-ES')} L</div><div class="barra" aria-hidden="true"><span style="width:${pct}%"></span></div><div class="s">De ${C.cap.toLocaleString('es-ES')} L. Precio medio ${C.pendiente?'provisional ':''}${eurL(C.pm)}</div>${desHtml}</section>`;
  }
  $('#vista').innerHTML = `${dep}
    <div class="acc3">
      <button class="chip" id="brp">${I.gas}Repostar</button>
      <button class="chip" id="bpd">Pedido a domicilio</button>
      ${C.iniciado?`<button class="chip" id="bot">Otra salida del depósito</button>`:''}
    </div>
    ${textoPrecios()}
    ${seccionLecturas()}
    ${seccionGasoilCampos()}
    <section class="hist"><h2>Historial</h2><div class="lista">${items.length?items.map(fila).join(''):'<div class="vacio" style="padding:16px">Todavía no hay repostajes. Empieza con el botón Repostar.</div>'}</div></section>`;
  if($('#bi')) $('#bi').onclick=hojaInicioDeposito;
  enlazarLecturas();
  pulsacionLarga($('#brp'), hojaRepostar, hojaLitros);
  $('#bpd').onclick=()=> C.iniciado ? hojaPedido() : hojaInicioDeposito();
  if($('#bot')) $('#bot').onclick=hojaOtraSalida;
  document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>hojaCompletar(b.dataset.comp));
}

function leerNum(id){ const v=$('#'+id).value; return v==='' ? null : parseFloat(v); }

function hojaInicioDeposito(){
  abrirHoja(`<h3>Poner en marcha el depósito</h3><p>Usa el día que el camión lo deje lleno. Lo que ya había dentro se valora al precio de esta compra.</p>
    <label class="f" for="cap">Capacidad del depósito (L)</label>${campoNumero('cap', S.deposito.capacidad)}
    <label class="f" for="l">Litros que ha traído el camión</label>${campoNumero('l')}
    <label class="f" for="p">Importe total (€)</label>${campoNumero('p',undefined,'step="0.01"')}
    <label class="f" for="fd">Fecha</label><input type="datetime-local" id="fd" value="${aLocal(Date.now())}">
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Poner en marcha</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{
        const cap=leerNum('cap'), l=leerNum('l'), p=leerNum('p'), f=new Date($('#fd').value).getTime();
        if(!cap||cap<=0){ $('#err').textContent='Indica la capacidad del depósito.'; return; }
        if(!l||l<=0){ $('#err').textContent='Indica los litros que ha traído el camión.'; return; }
        if(l>cap){ $('#err').textContent='Los litros no pueden superar la capacidad.'; return; }
        if(p==null||p<=0){ $('#err').textContent='Indica el importe total.'; return; }
        if(isNaN(f)){ $('#err').textContent='Indica la fecha.'; return; }
        S.deposito.capacidad=cap;
        S.deposito.movs.push({id:'d'+Date.now(), tipo:'inicio', fecha:f, litros:l, importe:p});
        guardar(); cerrarHoja(); pintar(); toast('Depósito en marcha');
      };
  });
}

function hojaPedido(){

    <label class="f" for="fd">Fecha de entrega</label><input type="datetime-local" id="fd" value="${aLocal(Date.now())}">
    <label class="f" for="l">Litros</label>${campoNumero('l')}

    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`,()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#si').onclick=()=>{

function hojaCompletar(id){
  const m = S.deposito.movs.find(x=>x.id===id);
  abrirHoja(`<h3>Completar pedido</h3><p>Pedido del ${fecha(m.fecha)}. Al guardar se recalculan el precio medio y los costes.</p>

/* ---------- mantenimientos ---------- */
let filtroEstado='todos', filtroMaq='todas';
const nombreMaq = id => (tractor(id)||apero(id)||{}).nombre || '';
function textoRestante(r){ return r<0 ? `pasado ${fmtH(-r)} h` : `faltan ${fmtH(r)} h`; }

function pintarMant(){
  const enMaq = m => filtroMaq==='todas' || m.maq===filtroMaq;
  const todas = S.mants.filter(enMaq).map(info);
  const cuenta = e => todas.filter(x=>x.e===e).length;
  const pasa = x => filtroEstado==='todos' || (filtroEstado==='pasados'&&x.e==='r') || (filtroEstado==='inminentes'&&x.e==='y');
  const maqs = [...S.tractores, ...S.aperos];
  const bloques = bloquesMaquinas();
  const orden = bloques.flatMap(b=>b.ids);
  const tarjetas = orden.filter(id=>filtroMaq==='todas'||id===filtroMaq).map(id=>{
    const l = tallerDe(id);
    return (l.length && (filtroEstado==='todos' || l.some(pasa))) ? tarjetaTaller(id) : '';
  }).join('');
  const filaHtml = ({m,e})=>`
      <div class="fwrap"><div class="fondo" aria-hidden="true">Hecho</div>
        <div class="fila" data-id="${m.id}" tabindex="0" role="button" aria-label="${esc(m.nombre)}, ${esc(nombreMaq(m.maq))}, ${textoMant(m)}">
          <span class="dot ${e||'n'}"></span>${marcaM(m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}
          <span class="fx"><span class="n">${m.nombre}</span><span class="s">${nombreMaq(m.maq)}, ${cadaTexto(m)}${m.manualH?`<br>Trabajo: ${textoMant(m)}. Manual: ${textoManual(m)}`:''}</span></span>
          <span class="fq">${m.intervalo?`<span class="rel" title="${m.reloj==='motor'?'Horas de motor':m.reloj==='ha'?'Hectáreas trabajadas':'Horas de trabajo'}">${m.reloj==='motor'?I.motor:I.reloj}</span>`:`<span class="rel" title="Por tiempo">${I.cal}</span>`}${textoMant(m)}</span>
        </div></div>`;
  const grupos = bloques.map(b=>({titulo:b.titulo, filas: todas.filter(x=>b.ids.includes(x.m.maq) && x.m.quien!=='taller' && pasa(x)).sort(porHoras)})).filter(g=>g.filas.length);
  const unaSola = filtroMaq!=='todas';
  $('#vista').innerHTML = `
    <div class="filtros">
      <div class="seg" id="fe">
        <button data-v="todos" class="${filtroEstado==='todos'?'sel':''}">Todos</button>
        <button data-v="pasados" class="${filtroEstado==='pasados'?'sel':''}"><span class="dot r"></span>Pasados (${cuenta('r')})</button>
        <button data-v="inminentes" class="${filtroEstado==='inminentes'?'sel':''}"><span class="dot y"></span>Inminentes (${cuenta('y')})</button>
      </div>
      <select id="fm" aria-label="Filtrar por máquina"><option value="todas">Todas las máquinas</option>${maqs.map(x=>`<option value="${x.id}" ${x.id===filtroMaq?'selected':''}>${x.nombre}</option>`).join('')}</select>
    </div>
    <div style="display:flex;justify-content:flex-end;margin:0 0 6px"><button class="tallerchip" id="btallerm">${I.tool}Taller</button></div>
    <p class="pista">Arriba, lo del tractor y el apero enganchado, por horas que faltan. Desliza una línea a la derecha para marcarla como hecha, o tócala para ver el detalle. Lo del taller va junto en su tarjeta.</p>
    ${tarjetas}
    ${grupos.length ? grupos.map(g=>`${unaSola?'':`<h2 class="secc">${esc(g.titulo)}</h2>`}<div class="lista" style="margin-bottom:6px">${g.filas.map(filaHtml).join('')}</div>`).join('') : `<div class="lista"><div class="vacio" style="padding:16px">${tarjetas?'Nada más con este filtro.':'No hay mantenimientos con este filtro.'}</div></div>`}`;
  $('#fe').querySelectorAll('button').forEach(b=>b.onclick=()=>{ filtroEstado=b.dataset.v; pintarMant(); });
  $('#fm').onchange=e=>{ filtroMaq=e.target.value; pintarMant(); };
  document.querySelectorAll('.fila').forEach(enlazarDeslizar);
  $('#btallerm').onclick=()=>abrirTallerDe((filtroMaq!=='todas'&&maqExiste(filtroMaq)) ? filtroMaq : (S.sel.tractor||(S.tractores[0]||{}).id));
  document.querySelectorAll('[data-taller]').forEach(b=>b.onclick=()=>hojaTaller(b.dataset.taller));
}

function enlazarDeslizar(el){
  let x0=null, dx=0, movido=false; const id=el.dataset.id;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; movido=false; el.setPointerCapture(e.pointerId); el.style.transition='none'; });
  el.addEventListener('pointermove',e=>{ if(x0===null) return; dx=Math.max(0,e.clientX-x0); if(dx>6) movido=true; el.style.transform=`translateX(${dx}px)`; });
  el.addEventListener('pointerup',()=>{
    if(x0===null) return; x0=null;
    el.style.transition='transform .2s'; const w=el.offsetWidth; el.style.transform='translateX(0)';
    if(dx > w*0.35) hojaHecho(id); else if(!movido) hojaDetalle(id);
  });
  el.addEventListener('pointercancel',()=>{ x0=null; el.style.transform='translateX(0)'; });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hojaDetalle(id); } });
}

      <dt>Última vez</dt><dd>${ultimo}</dd>
