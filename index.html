<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantenimiento</title>
<meta name="theme-color" content="#3B6D11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F2; --card:#FFFFFF; --line:#DEDCD3; --text:#1F2A1F; --text2:#5F6B5C;
  --campo:#3B6D11; --campo-bg:#EAF3DE; --campo-on:#FFFFFF;
  --tierra:#A0640F; --tierra-bg:#FAEEDA; --tierra-on:#FFFFFF;
  --stop:#B3261E; --stop-off:#D9A6A2;
  --rojo:#E24B4A; --amarillo:#EF9F27;
  --scrim:rgba(20,25,20,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A15; --card:#1F261F; --line:#34402F; --text:#E8EDE4; --text2:#A9B5A3;
    --campo:#6FA83A; --campo-bg:#27361C; --campo-on:#0E140B;
    --tierra:#D69A45; --tierra-bg:#3A2C17; --tierra-on:#1A1206;
    --stop:#E0453B; --stop-off:#5A2E2B;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A15; --card:#1F261F; --line:#34402F; --text:#E8EDE4; --text2:#A9B5A3;
  --campo:#6FA83A; --campo-bg:#27361C; --campo-on:#0E140B;
  --tierra:#D69A45; --tierra-bg:#3A2C17; --tierra-on:#1A1206;
  --stop:#E0453B; --stop-off:#5A2E2B;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:"Roboto Flex",Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;font-size:14px;color:var(--text2)}
.badge{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:0;cursor:pointer;background:var(--tierra-bg);color:var(--tierra)}
.badge.ok{background:var(--campo-bg);color:var(--campo)}
.bienv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:8px}
.bienv h2{margin:0 0 6px;font-size:20px;font-weight:500}
.bienv p{color:var(--text2);margin:0 0 14px}
main{flex:1;padding:6px 14px 120px}
.maquinas{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.maq{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.maq + .maq{border-top:1px solid var(--line)}
.maq:focus-visible,.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:3px solid var(--campo);outline-offset:2px}
.ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px}
.ico.t{background:var(--campo-bg);color:var(--campo)}
.ico.a{background:var(--tierra-bg);color:var(--tierra)}
.maq .n{font-size:17px;font-weight:500}
.maq .s{font-size:13px;color:var(--text2)}
.maq .sw{margin-left:auto;color:var(--text2);width:22px;height:22px}
.aviso-largo{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--tierra-bg);color:var(--tierra);font-size:14px;display:none}
.reloj{text-align:center;margin:22px 0 4px;font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.reloj.parado{color:var(--text2)}
.reloj.campo{color:var(--campo)} .reloj.carretera{color:var(--tierra)} .reloj.enpausa{color:var(--text2)}
.reloj-sub.campo{color:var(--campo)} .reloj-sub.carretera{color:var(--tierra)}
.parciales{display:grid;grid-template-columns:1fr 86px 1fr;gap:12px;margin:14px 0 -8px;text-align:center}
.parciales.ocultos{visibility:hidden}
.parcial{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text2);opacity:.75}
.parcial.on{opacity:1}
.parcial.campo.on{color:var(--campo)} .parcial.carretera.on{color:var(--tierra)}
.centro{display:flex;flex-direction:column;align-items:center;gap:8px}
button.pausa{width:86px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
button.pausa svg{width:16px;height:16px}
button.pausa:disabled{opacity:.4;cursor:default}
button.pausa.on{background:var(--text);border-color:var(--text);color:var(--bg)}
button.pausa:focus-visible{outline:3px solid var(--campo);outline-offset:2px}
.reloj-sub{text-align:center;font-size:13px;color:var(--text2);min-height:18px}
.controles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:16px 0 0}
.btn{border-radius:14px;padding:14px 8px;border:2px solid;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:500;transition:background .15s,color .15s,opacity .15s}
.btn svg{width:26px;height:26px}
.btn.carretera{border-color:var(--tierra);color:var(--tierra)}
.btn.campo{border-color:var(--campo);color:var(--campo)}
.btn.carretera.on{background:var(--tierra);color:var(--tierra-on)}
.btn.campo.on{background:var(--campo);color:var(--campo-on)}
.btn.tenue{opacity:.45}
.stop{width:86px;height:86px;border:0;cursor:pointer;background:var(--stop-off);color:#fff;font-weight:700;font-size:17px;letter-spacing:.04em;clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);display:grid;place-items:center;transition:background .15s,transform .1s}
.stop.on{background:var(--stop)}
.stop:active{transform:scale(.96)}
.stop:focus-visible{outline:3px solid var(--stop);outline-offset:4px}
.rapidos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 0}
.rapidos .chip:last-child:nth-child(odd){grid-column:1/-1}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--campo);font-size:15px;cursor:pointer}
.chip svg{width:20px;height:20px}
.avisos{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.avisos h2{font-size:14px;font-weight:500;color:var(--text2);margin:8px 0 4px}
.av{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px}
.av + .av{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.dot.r{background:var(--rojo)} .dot.y{background:var(--amarillo)}
.av .q{margin-left:auto;color:var(--text2);font-size:14px;white-space:nowrap}
.vacio{color:var(--text2);font-size:15px;padding:8px 0 10px}
.navwrap{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.navin{max-width:480px;margin:0 auto;display:flex;align-items:stretch}
.nav{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;mask-image:linear-gradient(to right,#000 85%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 22%;scroll-snap-align:start;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--text2);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button.act{color:var(--campo);font-weight:500}
.fijos{display:flex;border-left:1px solid var(--line)}
.fijos button{background:none;border:0;width:52px;display:grid;place-items:center;color:var(--text2);cursor:pointer}
.fijos svg{width:24px;height:24px}
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.hoja{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.hoja h3{margin:0 0 6px;font-size:19px;font-weight:500}
.hoja p{margin:4px 0 12px;color:var(--text2);font-size:15px}
.opc{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:none;cursor:pointer;margin:0 0 8px;text-align:left}
.opc.sel{border-color:var(--campo);background:var(--campo-bg)}
.opc .s{font-size:13px;color:var(--text2)}
label.f{display:block;font-size:14px;color:var(--text2);margin:10px 0 4px}
.campo-num{display:flex;gap:8px}
.campo-num input,.hoja input,.hoja select{flex:1;width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.cam{width:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text2);display:grid;place-items:center;cursor:pointer}
.cam svg{width:22px;height:22px}
.acciones{display:flex;gap:10px;margin-top:16px}
.acciones button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:none}
.acciones .ok{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.acciones .peligro{background:var(--stop);border-color:var(--stop);color:#fff}
.err{color:var(--stop);font-size:14px;margin-top:6px;min-height:18px}
.nota{font-size:13px;color:var(--text2);margin-top:8px}
.seg{display:flex;gap:6px;margin:4px 0}
.seg button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-size:14px}
.seg button.sel{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:1}
.prox{padding:60px 20px;text-align:center;color:var(--text2)}
.filtros{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.filtros select{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.filtros .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.filtros .dot{width:10px;height:10px}
.pista{font-size:13px;color:var(--text2);margin:6px 2px 8px}
.lista{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fwrap{position:relative;overflow:hidden}
.fwrap+.fwrap{border-top:1px solid var(--line)}
.fondo{position:absolute;inset:0;background:var(--campo);color:var(--campo-on);display:flex;align-items:center;padding-left:18px;font-weight:500}
.fila{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:12px 14px;touch-action:pan-y;cursor:pointer;user-select:none}
.fila:focus-visible{outline:3px solid var(--campo);outline-offset:-3px}
.fx{display:flex;flex-direction:column;min-width:0}
.fx .n{font-size:16px}
.fx .s{font-size:13px;color:var(--text2)}
.fq{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);white-space:nowrap}
.rel svg{width:16px;height:16px;display:block}
.dot.n{background:transparent;border:1px solid var(--line)}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:8px 0 4px}
.det dt{color:var(--text2)} .det dd{margin:0}
.dep{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.dep .tit{font-size:14px;color:var(--text2)}
.dep .big{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;margin:2px 0}
.dep .s{font-size:14px;color:var(--text2)}
.dep .des{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:14px;background:var(--bg)}
.dep .des.alerta{background:var(--tierra-bg);color:var(--tierra)}
.barra{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.barra span{display:block;height:100%;background:var(--campo)}
.acc3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.acc3 .chip:last-child:nth-child(odd){grid-column:1/-1}
.hist{margin-top:16px}
.hist h2{font-size:14px;font-weight:500;color:var(--text2);margin:0 4px 8px}
.mov{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
.mov + .mov{border-top:1px solid var(--line)}
.mov .fx{flex:1}
.mov .der{text-align:right;font-size:14px;white-space:nowrap}
.mov .der .s{display:block;font-size:13px;color:var(--text2)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tierra-bg);color:var(--tierra);margin-top:4px}
.tag.ok{background:var(--campo-bg);color:var(--campo)}
button.mov{cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--campo)}
.mes{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mes h2{font-size:18px;font-weight:500;margin:0}
.flecha{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.flecha svg{width:22px;height:22px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--text2);padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px}
.cal button.hoy{outline:2px solid var(--campo);outline-offset:-2px}
.cal button.con{background:var(--campo-bg);font-weight:500}
.cal .pt{width:6px;height:6px;border-radius:50%;background:var(--campo)}
.agenda{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:4px;overflow:hidden}
.agenda .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--text2);padding-left:6px}
.blk{position:absolute;left:52px;right:10px;border-radius:8px;padding:4px 8px;font-size:13px;overflow:hidden;border:0;text-align:left;cursor:pointer;line-height:1.25}
.blk.campo{background:var(--campo);color:var(--campo-on)}
.blk.carretera{background:var(--tierra);color:var(--tierra-on)}
.blk.abierta{opacity:.7}
.tramos{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.tramo{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tramo+.tramo{border-top:1px solid var(--line)}
.tramo .bar{width:6px;align-self:stretch;border-radius:3px}
.tramo .bar.campo{background:var(--campo)} .tramo .bar.carretera{background:var(--tierra)}
.tramo .der{margin-left:auto;font-size:14px;color:var(--text2);white-space:nowrap}
.cambio{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:15px}
.cambio+.cambio{border-top:1px solid var(--line)}
.cambio .s{color:var(--text2);font-size:13px}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0 8px}
.peq{font-size:14px;font-weight:500;margin:0 0 4px}
.cnt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.cnt .dot{width:10px;height:10px}
.secc{font-size:14px;font-weight:500;color:var(--text2);margin:18px 4px 8px}
.wz{font-size:13px;color:var(--text2);margin:0 0 2px}
.mitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mitem .s{display:block;font-size:13px;color:var(--text2)}
.mitem button{margin-left:auto;border:0;background:none;color:var(--text2);cursor:pointer;width:40px;height:40px;font-size:22px;flex:none}
.caja{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--text2);color:var(--text2);font-size:11px;font-weight:700;flex:none;line-height:1}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tierra-bg);color:var(--tierra);margin-left:6px;vertical-align:1px}
.taller{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--tierra);border-radius:14px;background:var(--tierra-bg);color:var(--text);cursor:pointer;font:inherit;margin:0 0 10px}
.taller .n{font-weight:500}
.taller .s{font-size:13px;color:var(--text2)}
.taller .q{margin-left:auto;font-size:14px;color:var(--tierra);white-space:nowrap}
.salir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:20px 0 0;padding:13px;border-radius:12px;border:1.5px solid var(--campo);background:var(--card);color:var(--campo);font:inherit;font-size:16px;font-weight:500;cursor:pointer;position:relative}
.salir svg{width:20px;height:20px}
.salir .pto{width:10px;height:10px;border-radius:50%;background:var(--rojo);position:absolute;top:9px;right:12px}
.salir + .rapidos{margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px 12px}
.rut{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.rut:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:12px;flex:1;width:100%;padding:12px 2px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.hoja .chk + .chk{border-top:1px solid var(--line)}
.chk .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on .box{background:var(--campo);border-color:var(--campo);color:var(--campo-on)}
.chk.fallo .box{background:var(--stop);border-color:var(--stop);color:#fff}
.chk .s{display:block;font-size:13px;color:var(--text2)}
.chk .der{margin-left:auto;font-size:13px;color:var(--text2);white-space:nowrap;text-align:right}
.falla{border:1px solid var(--line);background:none;color:var(--text2);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;flex:none}
.ventana{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:4px 2px 10px}
.ventana button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.ventana b{color:var(--text);font-weight:500;min-width:56px;text-align:center}
.topder{display:flex;align-items:center;gap:8px}
.libreta{position:relative;width:38px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--campo);display:grid;place-items:center;cursor:pointer;padding:0}
.libreta svg{width:18px;height:18px}
.libreta .cnt{position:absolute;top:-6px;right:-6px;margin:0;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--tierra);color:var(--tierra-on);font-size:11px;font-weight:700;display:grid;place-items:center}
.libreta:focus-visible{outline:3px solid var(--campo);outline-offset:2px}

.det dd.txt,.detalles{white-space:pre-line}
.detalles{background:var(--campo-bg);border-radius:12px;padding:10px 12px;margin:6px 0 4px;font-size:15px}

.novedades{margin:8px 0 4px;padding-left:20px}
.novedades li{margin:0 0 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<div class="app">
  <div class="top"><span id="fecha"></span><span class="topder"><button class="libreta" id="btnNotas" type="button" aria-label="Notas de uso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M6 3v18M4 7h4M4 12h4M4 17h4M10 8h5M10 12h5"/></svg></button><button class="badge" id="sync" type="button">Sin conectar</button></span></div>

    <button id="btnAjustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<div class="scrim" id="scrim"><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const I = {
  motor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h2l2-2h5l2 2h2v2h2v-2h1v6h-1v-2h-2v3h-3l-2 2H9l-2-2H5z"/><path d="M9 5h4M11 5v3"/></svg>',
  reloj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  tractor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="16" r="4"/><circle cx="18" cy="17.5" r="2.5"/><path d="M11 16h4.5M3.5 13V6h6l2 6h7v3"/><path d="M9.5 6v-2M17 12V8"/></svg>',
  apero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M6 6v8l-2 4M12 6v8l-2 4M18 6v8l-2 4"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h13"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8"/></svg>',
  road:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L8 4M20 20L16 4M12 6v2M12 11v2M12 16v2"/></svg>',
  campo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/><path d="M3 21h18"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  gas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
  tool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8z"/><path d="M14.7 6.3L9 12l-3-3 5.7-5.7a4 4 0 0 1 3 3z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  pausa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>'
};

const SECCIONES = [
  ['inicio','Inicio',I.home],['mant','Mantenim.',I.tool],['maquinas','Máquinas',I.tractor],['gasoil','Combustible',I.gas],
  ['averias','Averías',I.warn],['dias','Días',I.cal],['notif','Avisos',I.bell],['stats','Estadísticas',I.chart]
];

const H = 3600000;
const CLAVE = 'mant-app-v1';
const VERSION_APP = '1.3.0';

function estadoInicial(){
  return {
    tractores:[], aperos:[], mants:[],
    sel:{tractor:null, apero:null},
    sesion:null, sesiones:[], lecturas:[], repostajes:[], hechos:[], cambios:[],
    deposito:{capacidad:2000, movs:[]},
    umbralDesajuste:5, umbralAmarillo:20, umbralLarga:10
  };
}

let S;
try{ S = JSON.parse(localStorage.getItem(CLAVE)) || estadoInicial(); }catch(e){ S = estadoInicial(); }
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} if(typeof marcarPendiente==='function') marcarPendiente(); if(typeof notiSesion==='function') notiSesion(); }
function migrar(){
if(!S.hechos) S.hechos = [];
if(!S.deposito) S.deposito = {capacidad:2000, movs:[]};
if(S.umbralDesajuste==null) S.umbralDesajuste = 5;
S.tractores.forEach(t=>{ if(t.horometroAlta==null) t.horometroAlta = t.horometro; if(!t.rutina) t.rutina = []; });
if(S.ventanaTaller==null) S.ventanaTaller = 100;
if(S.ventanaSalir==null) S.ventanaSalir = 10;
if(S.diasAmarillo==null) S.diasAmarillo = 30;
if(!S.rutinaDia) S.rutinaDia = {};
if(!S.averias) S.averias = [];
S.mants.forEach(m=>{ if(!m.quien) m.quien='yo'; if(m.fecha==null) m.fecha=Date.now(); if(m.meses===undefined) m.meses=null; if(m.detalles==null) m.detalles=''; });
if(!S.notas) S.notas = [];
if(S.notaSig==null) S.notaSig = 1;
if(!S.codigos) S.codigos = [];
if(!S.usoAperos) S.usoAperos = {};
if(S.engancheH==null) S.engancheH = 30;
if(S.engancheD==null) S.engancheD = 5;
if(S.notiSesion==null) S.notiSesion = true;
try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){}
}
migrar();

const $ = s => document.querySelector(s);
const tractor = id => S.tractores.find(t=>t.id===id);
const apero = id => S.aperos.find(a=>a.id===id);
const esCompat = (a,tid) => !!a && (a.compatTodos || (a.compat||[]).includes(tid));
const fmtH = h => (Math.round(h*10)/10).toLocaleString('es-ES',{maximumFractionDigits:1});
function dur(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':'); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.k); toast.k=setTimeout(()=>el.classList.remove('on'),2200); }

function cuentaEnTramo(m, tramo){
  if(m.reloj!=='trabajo') return false;
  const ap = apero(tramo.apero);
  /* modo 'nose': horas igualadas con "No lo sé"; solo cuenta lo que vale igual en carretera y en campo */
  if(m.maq===tramo.tractor){
    if(m.cuenta==='siempre') return true;
    if(m.cuenta==='campo') return tramo.modo==='campo';
    if(m.cuenta==='alza') return tramo.modo==='campo' && !!ap && ap.tipo==='suspendido';
    if(m.cuenta==='arrastrado') return !!ap && ap.tipo==='arrastrado';
    if(m.cuenta==='carretera') return tramo.modo==='carretera';
    return false;
  }
  if(m.maq===tramo.apero){
    if(m.cuenta==='siempre') return ap.tipo==='arrastrado' || tramo.modo==='campo';
    if(m.cuenta==='campo') return tramo.modo==='campo';
    if(m.cuenta==='carretera') return tramo.modo==='carretera';
  }
  return false;
}

function horasRestantes(m){
  if(!m.intervalo) return Infinity;
  if(m.reloj==='motor'){
    const t = tractor(m.maq);
    return m.intervalo - (t.horometro - m.ultima);
  }
  let acum = m.acum;
  const tr = S.sesion && S.sesion.tramos[S.sesion.tramos.length-1];
  if(tr && !tr.fin && cuentaEnTramo(m,tr)) acum += Math.max(0,(Date.now()-Math.max(tr.inicio, m.desde||0))/H);
  return m.intervalo - acum;
}
const DIA = 86400000;
function venceFecha(m){ if(!m.meses) return null; const d=new Date(m.fecha||Date.now()); d.setMonth(d.getMonth()+m.meses); return d.getTime(); }
function diasRestantes(m){ const v=venceFecha(m); return v==null ? Infinity : (v-Date.now())/DIA; }
const umbralDe = m => m.intervalo ? Math.min(S.umbralAmarillo, m.intervalo/4) : 0;
const umbralDias = m => m.meses ? Math.min(S.diasAmarillo, m.meses*30.4/4) : 0;
function estadoMant(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  if(r < 0 || d < 0) return 'r';
  if(r < umbralDe(m) || d < umbralDias(m)) return 'y';
  return '';
}
function urgencia(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  return Math.min(isFinite(r) ? r/m.intervalo : Infinity, isFinite(d) ? d/(m.meses*30.4) : Infinity);
}
const info = m => ({m, r:horasRestantes(m), d:diasRestantes(m), e:estadoMant(m), u:urgencia(m)});
const porUrgencia = (a,b) => a.u - b.u;
/* aviso "M": lo que va por horas de trabajo pero el manual pide por horómetro */
function restanManual(m){
  if(m.reloj!=='trabajo' || !m.manualH || m.ultimaHoro==null) return Infinity;
  const t = tractor(m.maq); if(!t) return Infinity;
  return m.manualH - (t.horometro - m.ultimaHoro);
}
const marcaM = m => restanManual(m) <= 0;
const textoManual = m => { const r=restanManual(m); return r<=0 ? 'le tocaría ya' : `faltan ${fmtH(r)} h de horómetro`; };
const esc = x => String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function fmtDias(d){ const a=Math.abs(d); if(a<45){ const n=Math.max(1,Math.round(a)); return n===1?'1 día':`${n} días`; } const n=Math.round(a/30.4); return n===1?'1 mes':`${n} meses`; }
const fmtMeses = n => n%12===0 ? (n===12?'1 año':`${n/12} años`) : (n===1?'1 mes':`${n} meses`);
function cadaTexto(m){
  const p = [];
  if(m.intervalo) p.push(`${fmtH(m.intervalo)} h`);
  if(m.meses) p.push(fmtMeses(m.meses));
  return 'cada ' + p.join(' o ');
}
function textoMant(m){
  const r = horasRestantes(m), d = diasRestantes(m);
  if(r < 0 && (!isFinite(d) || d >= 0 || -r/m.intervalo >= -d/(m.meses*30.4))) return `pasado ${fmtH(-r)} h`;
  if(d < 0) return `pasado ${fmtDias(d)}`;
  if(isFinite(r) && isFinite(d)) return `faltan ${fmtH(r)} h o ${fmtDias(d)}`;
  if(isFinite(r)) return `faltan ${fmtH(r)} h`;
  if(isFinite(d)) return `faltan ${fmtDias(d)}`;
  return 'sin plazo';
}
const hoyISO = () => isoDe(Date.now());
function isoDe(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaDe(v){ if(!v || v===hoyISO()) return Date.now(); return new Date(v+'T12:00').getTime(); }
const fechaCorta = ms => new Date(ms).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});

function cerrarTramo(fin){
  const ses = S.sesion; if(!ses) return;
  const tr = ses.tramos[ses.tramos.length-1];
  if(!tr || tr.fin) return;
  tr.fin = fin;
  S.mants.forEach(m=>{ if(cuentaEnTramo(m,tr)) m.acum += Math.max(0,(tr.fin - Math.max(tr.inicio, m.desde||0))/H); });
}

function abrirTramo(modo, inicio){
  S.sesion.tramos.push({modo, tractor:S.sel.tractor, apero:S.sel.apero, inicio, fin:null});
}

function pulsarModo(modo, sinPreguntar){
  const ahora = Date.now();
  if(!S.sesion && !sinPreguntar && rutinaPendiente(tractor(S.sel.tractor))){ hojaPreguntaRutina(modo); return; }
  const nueva = !S.sesion;
  if(!S.sesion){
    S.sesion = {inicio:ahora, tractor:S.sel.tractor, tramos:[]};
    abrirTramo(modo, ahora);
    toast(modo==='campo' ? 'Sesión iniciada en campo' : 'Sesión iniciada en carretera');
  } else if(enPausa()){
    delete S.sesion.pausa;
    abrirTramo(modo, ahora);
    toast(modo==='campo' ? 'Seguimos en campo' : 'Seguimos en carretera');
  } else {
    const tr = S.sesion.tramos[S.sesion.tramos.length-1];
    if(tr.modo===modo) return;
    cerrarTramo(ahora);
    abrirTramo(modo, ahora);
    toast(modo==='campo' ? 'Ahora en campo' : 'Ahora en carretera');
  }
  vibrar();
  guardar(); pintar();
  if(nueva) preguntarNoti();
}

/* ---------- pausa ---------- */
const enPausa = () => !!(S.sesion && S.sesion.pausa);
function pausar(){
  if(!S.sesion){ toast('No hay ninguna sesión abierta'); return; }
  if(enPausa()){ toast('Para seguir, pulsa Campo o Carretera'); return; }
  const ahora = Date.now();
  cerrarTramo(ahora); S.sesion.pausa = ahora;
  vibrar(); guardar(); pintar(); toast('Sesión en pausa');
}
function vibrar(){ try{ if(navigator.vibrate) navigator.vibrate(180); }catch(e){} }
/* tiempo trabajado de la sesión abierta (sin pausas), total o de un modo */
function trabajadoSesion(modo){
  if(!S.sesion) return 0;
  const ahora = Date.now();
  return S.sesion.tramos.reduce((s,t)=> s + ((!modo || t.modo===modo) ? Math.max(0,(t.fin||ahora)-t.inicio) : 0), 0);
}

/* ---------- notificación de sesión abierta ---------- */
let notiFirma = null;
const hhmm = ms => new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
async function notiSesion(forzar){
  try{
    if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration(); if(!reg) return;
    const activa = S.sesion && S.notiSesion && Notification.permission==='granted';
    let firma = 'no';
    if(activa){
      const tr = S.sesion.tramos[S.sesion.tramos.length-1];
      firma = [S.sesion.inicio, enPausa()?'p'+S.sesion.pausa:tr.modo+tr.inicio, S.sel.apero||''].join('|');
    }
    if(firma===notiFirma && !forzar) return;
    notiFirma = firma;
    const viejas = await reg.getNotifications({tag:'sesion'});
    if(!activa){ viejas.forEach(n=>n.close()); return; }
    const t = tractor(S.sesion.tractor), a = apero(S.sel.apero);
    const tr = S.sesion.tramos[S.sesion.tramos.length-1];
    const maq = (t?t.nombre:'') + (a?` con ${a.nombre}`:'');
    let titulo, cuerpo;
    if(enPausa()){ titulo='Sesión en pausa'; cuerpo=`En pausa desde las ${hhmm(S.sesion.pausa)}. ${maq}. Para seguir, pulsa Campo o Carretera.`; }
    else { titulo = tr.modo==='campo' ? 'Sesión abierta en campo' : 'Sesión abierta en carretera'; cuerpo=`${tr.modo==='campo'?'En campo':'En carretera'} desde las ${hhmm(tr.inicio)}. ${maq}. Sesión desde las ${hhmm(S.sesion.inicio)}.`; }
    await reg.showNotification(titulo, {body:cuerpo, tag:'sesion', renotify:false, requireInteraction:true, icon:'icon-192.png', timestamp:S.sesion.inicio, data:{url:'./'}});
  }catch(e){}
}
function preguntarNoti(){
  if(!('Notification' in window) || Notification.permission!=='default' || S.notiPreguntado) return;
  S.notiPreguntado = true; guardar();
  abrirHoja(`<h3>Aviso de sesión abierta</h3><p>Mientras haya una sesión abierta, saldrá una notificación en el móvil, también con la pantalla bloqueada, que dice si estás en campo, en carretera o en pausa. Así no se te olvida pararla.</p><p>Android te pedirá permiso una sola vez.</p><div class="acciones"><button id="no">Ahora no</button><button class="ok" id="si">Activar</button></div>`,()=>{
    $('#no').onclick=()=>{ cerrarHoja(); toast('Puedes activarla en Ajustes'); };
    $('#si').onclick=async()=>{
      cerrarHoja();
      try{ const p = await Notification.requestPermission(); if(p==='granted'){ S.notiSesion=true; guardar(); notiSesion(true); toast('Notificación activada'); } else toast('Sin permiso: no saldrá la notificación'); }catch(e){}
    };
  });
}

/* ---------- hojas (diálogos) ---------- */
let hojaAbierta = false;
function abrirHoja(html, alPintar){
  $('#hoja').innerHTML = html;
  $('#scrim').classList.add('on');
  if(!hojaAbierta){ history.pushState({hoja:true},''); hojaAbierta = true; }
  if(alPintar) alPintar();
  const f = $('#hoja').querySelector('input,button'); if(f) f.focus();
}
let ignorarPop = false;
function cerrarHoja(desdeHistorial){
  $('#scrim').classList.remove('on');
  if(hojaAbierta){ hojaAbierta=false; if(!desdeHistorial){ ignorarPop=true; history.back(); } }
}
$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') cerrarHoja(); });

function hojaTractor(){
  if(S.sesion){
    abrirHoja(`<h3>Sesión abierta</h3><p>Para cambiar de tractor, para antes la sesión del ${tractor(S.sel.tractor).nombre}.</p><div class="acciones"><button id="x">Entendido</button></div>`,
      ()=>$('#x').onclick=()=>cerrarHoja());
    return;
  }
  const ops = S.tractores.map(t=>`<button class="opc ${t.id===S.sel.tractor?'sel':''}" data-id="${t.id}"><span class="ico t">${I.tractor}</span><span><span class="n">${t.nombre}</span><br><span class="s">Horómetro ${fmtH(t.horometro)} h</span></span></button>`).join('');
  abrirHoja(`<h3>Elige tractor</h3>${ops}`, ()=>{
    $('#hoja').querySelectorAll('.opc').forEach(b=>b.onclick=()=>{
      S.sel.tractor=b.dataset.id;
      const ap = apero(S.sel.apero);
      if(ap && !esCompat(ap, S.sel.tractor)) ponerApero(null);
      guardar(); cerrarHoja(); pintar();
    });
  });
}

function hojaApero(){
  const lista = S.aperos.filter(a=>esCompat(a, S.sel.tractor));
  const titulo = S.sesion ? '¿A qué apero cambias?' : 'Elige apero';
  const ops = lista.map(a=>`<button class="opc ${a.id===S.sel.apero?'sel':''}" data-id="${a.id}"><span class="ico a">${I.apero}</span><span><span class="n">${a.nombre}</span><br><span class="s">${a.tipo==='suspendido'?'Suspendido':'Arrastrado'}</span></span></button>`).join('');
  const actual = apero(S.sel.apero);
  abrirHoja(`<h3>${titulo}</h3><p>${lista.length?`Solo aparecen los compatibles con el ${tractor(S.sel.tractor).nombre}.`:'Todavía no hay aperos. Dalos de alta en Máquinas.'}</p>${ops}
    ${actual?`<div class="acciones"><button class="peligro" id="qa">Quitar apero</button></div><p class="nota">Sin apero, solo cuentan las horas del tractor.</p>`:''}`, ()=>{
    if($('#qa')) $('#qa').onclick=()=>{
      if(!S.sesion || enPausa()){ ponerApero(null); guardar(); cerrarHoja(); pintar(); toast(`${actual.nombre} quitado`); return; }
      abrirHoja(`<h3>Quitar apero</h3><p>Se cierran las horas del ${esc(actual.nombre)} ahora. Las horas del tractor siguen corriendo.</p><div class="acciones"><button id="no">Cancelar</button><button class="peligro" id="si">Quitar</button></div>`,()=>{
        $('#no').onclick=()=>cerrarHoja();
        $('#si').onclick=()=>{
          const ahora=Date.now(), modo=S.sesion.tramos[S.sesion.tramos.length-1].modo;
          cerrarTramo(ahora); ponerApero(null); abrirTramo(modo, ahora);
          guardar(); cerrarHoja(); pintar(); toast(`${actual.nombre} quitado`);
        };
      });
    };
    $('#hoja').querySelectorAll('.opc').forEach(b=>b.onclick=()=>{
      const nuevo = b.dataset.id;
      if(nuevo===S.sel.apero){ cerrarHoja(); return; }
      if(!S.sesion || enPausa()){ ponerApero(nuevo); guardar(); cerrarHoja(); pintar(); hojaEnganche(nuevo); return; }
      const viejo = apero(S.sel.apero), nu = apero(nuevo);
      abrirHoja(`<h3>Cambiar de apero</h3><p>${viejo?`Se cierran las horas del ${viejo.nombre} y empiezan`:'Empiezan'} las del ${nu.nombre} ahora. Las horas del tractor siguen corriendo.</p><div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Cambiar</button></div>`,()=>{
        $('#no').onclick=()=>cerrarHoja();
        $('#si').onclick=()=>{
          const ahora=Date.now(), modo=S.sesion.tramos[S.sesion.tramos.length-1].modo;
          cerrarTramo(ahora); ponerApero(nuevo); abrirTramo(modo, ahora);
          guardar(); cerrarHoja(); pintar(); toast(`Ahora con ${nu.nombre}`); hojaEnganche(nuevo);
        };
      });
    });
  });
}

/* enganchar o quitar un apero: guarda cuándo se usó cada uno, para ordenar Mantenimientos */
function ponerApero(id){
  const ahora = Date.now();
  if(S.sel.apero) S.usoAperos[S.sel.apero] = ahora;
  if(id) S.usoAperos[id] = ahora;
  S.sel.apero = id;
}
/* última vez que se usó una máquina: enganche o tramo de sesión */
function ultimoUso(id){
  let u = S.usoAperos[id] || 0;
  todasSesiones().forEach(({s})=>s.tramos.forEach(t=>{ if(t.apero===id || t.tractor===id) u = Math.max(u, t.fin||Date.now()); }));
  return u;
}
/* orden de las máquinas: tractor y apero enganchados, el último apero usado, y el resto por uso */
function bloquesMaquinas(){
  const t = S.sel.tractor, a = S.sel.apero;
  const resto = [...S.tractores, ...S.aperos].map(x=>x.id).filter(id=>id!==t && id!==a)
    .map(id=>({id, u:ultimoUso(id)})).sort((x,y)=>y.u-x.u).map(x=>x.id);
  const ultimoAp = resto.find(id=>apero(id) && ultimoUso(id)>0);
  const bloques = [];
  const b1 = [t, a].filter(id=>id && (tractor(id)||apero(id)));
  if(b1.length) bloques.push({titulo: a ? 'Tractor y apero enganchado' : 'Tractor', ids:b1});
  if(ultimoAp) bloques.push({titulo:`Último apero usado: ${nombreMaq(ultimoAp)}`, ids:[ultimoAp]});
  resto.filter(id=>id!==ultimoAp).forEach(id=>bloques.push({titulo:nombreMaq(id), ids:[id]}));
  return bloques;
}
/* orden por horas que faltan; lo que va solo por tiempo, al final, por días */
function porHoras(a, b){
  const k = x => isFinite(x.r) ? (x.d < 0 ? Math.min(x.r, 0) : x.r) : null;
  const ka = k(a), kb = k(b);
  if(ka!==null && kb!==null) return ka - kb;
  if(ka!==null) return -1;
  if(kb!==null) return 1;
  return a.d - b.d;
}
/* al enganchar un apero: lo que le vence pronto */
function hojaEnganche(id){
  const ap = apero(id); if(!ap) return;
  const l = S.mants.filter(m=>m.maq===id).map(info)
    .filter(x=>x.e==='r' || x.r <= S.engancheH || x.d <= S.engancheD || marcaM(x.m)).sort(porHoras);
  if(!l.length) return;
  setTimeout(()=>abrirHoja(`<h3>${esc(ap.nombre)}: vence pronto</h3><p>Lo que le falta en las próximas ${fmtH(S.engancheH)} h o ${fmtH(S.engancheD)} días.</p>
    <div class="lista">${l.map(({m,e})=>`<div class="mov" style="align-items:center"><span class="dot ${e||'n'}" aria-label="${e==='r'?'Pasado':e==='y'?'Inminente':''}"></span>${marcaM(m)?'<span class="mk">M</span>':''}<span class="fx"><span class="n">${esc(m.nombre)}${m.quien==='taller'?'<span class="tag">Taller</span>':''}</span></span><span class="der">${textoMant(m)}</span></div>`).join('')}</div>
    <div class="acciones"><button id="vm">Ver en Mantenimientos</button><button class="ok" id="si">Entendido</button></div>`,()=>{
      $('#si').onclick=()=>cerrarHoja();
      $('#vm').onclick=()=>{ cerrarHoja(); filtroMaq='todas'; filtroEstado='todos'; setTimeout(()=>irA('mant'), 60); };
  }), 120);
}

function aLocal(ms){ const d=new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

function hojaStop(){
  if(!S.sesion){ toast('No hay ninguna sesión abierta'); return; }
  const ahora = Date.now();
  const horas = (ahora - S.sesion.inicio)/H;
  const larga = horas >= S.umbralLarga;
  abrirHoja(`<h3>Parar sesión</h3>
    <p>${larga ? `La sesión lleva ${fmtH(horas)} h abierta. Si se te olvidó pararla, ajusta la hora real de fin.` : `Trabajado: ${dur(trabajadoSesion())}.`}${enPausa()?` En pausa desde las ${hhmm(S.sesion.pausa)}.`:''}</p>
    <label class="f" for="fin">Hora de fin</label>
    <input type="datetime-local" id="fin" value="${aLocal(ahora)}">
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="peligro" id="si">Parar y guardar</button></div>`, ()=>{
      $('#no').onclick=()=>cerrarHoja();
      $('#fin').oninput=()=>{$('#err').textContent='';};
      $('#si').onclick=()=>{
        const vf = $('#fin').value, fin = vf===aLocal(ahora) ? Date.now() : new Date(vf).getTime();
        if(!fin || isNaN(fin)){ $('#err').textContent='Indica una hora de fin.'; return; }
        if(fin <= S.sesion.inicio){ $('#err').textContent='La hora de fin debe ser posterior al inicio de la sesión.'; return; }
        if(fin > Date.now()+60000){ $('#err').textContent='La hora de fin no puede ser futura.'; return; }
        const ses = S.sesion;
        const quitar = tr => { if(!tr.fin) return; S.mants.forEach(m=>{ if(cuentaEnTramo(m,tr)) m.acum = Math.max(0, m.acum - Math.max(0,(tr.fin - Math.max(tr.inicio, m.desde||0))/H)); }); tr.fin=null; };
        ses.tramos.filter(t=>t.inicio >= fin).forEach(quitar);
        ses.tramos = ses.tramos.filter(t=>t.inicio < fin);
        const ult = ses.tramos[ses.tramos.length-1];
        if(ult.fin && ult.fin > fin) quitar(ult);
        cerrarTramo(fin);
        delete ses.pausa;
        ses.fin = ses.tramos[ses.tramos.length-1].fin;
        S.sesiones.push(ses); S.sesion = null;
        guardar(); cerrarHoja(); pintar(); toast('Sesión guardada');
      };
  });
}

  return `<div class="campo-num"><input id="${id}" type="number" inputmode="decimal" step="0.1" ${valor!==undefined?`value="${valor}"`:''} ${extra}><button class="cam" type="button" data-cam aria-label="Leer con la cámara">${I.cam}</button></div>`;
}
function enlazarCamaras(){

}

function hojaHorometro(){
  const t = tractor(S.sel.tractor);
  abrirHoja(`<h3>Horómetro del ${t.nombre}</h3><p>Última lectura: ${fmtH(t.horometro)} h.</p>
    <label class="f" for="h">Horas que marca ahora</label>${campoNumero('h')}
    <div class="err" id="err"></div>
    <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`, ()=>{
      enlazarCamaras();
      $('#no').onclick=()=>cerrarHoja();
      $('#h').oninput=()=>{$('#err').textContent='';};
      $('#si').onclick=()=>{
        const v = parseFloat($('#h').value);
        if(isNaN(v)){ $('#err').textContent='Escribe las horas del horómetro.'; return; }
        const aplicar = ()=>{
          const antes = S.mants.filter(m=>m.maq===t.id && m.manualH && !marcaM(m));
          const hueco = huecoSinSesiones(t, v), cuando = Date.now();
          S.lecturas.push({fecha:cuando, tractor:t.id, horas:v, origen:'mano'});
          t.horometro = v; guardar(); pintar();
          const seguir = ()=>{
            const nuevos = antes.filter(m=>marcaM(m) && !m.mAviso);
            if(nuevos.length) hojaAvisoM(nuevos.map(m=>m.id)); else { cerrarHoja(); toast('Horómetro actualizado'); }
          };
          if(hueco > 0) hojaIgualar(t, hueco, cuando, seguir); else seguir();
        };
        if(v < t.horometro || v - t.horometro > 24){
          const motivo = v < t.horometro ? `es menor que la anterior (${fmtH(t.horometro)} h)` : `sube ${fmtH(v-t.horometro)} h desde la última`;
          abrirHoja(`<h3>Revisa la lectura</h3><p>${fmtH(v)} h ${motivo}. ¿Es correcta?</p><div class="acciones"><button id="no2">Corregir</button><button class="ok" id="si2">Sí, guardar</button></div>`,()=>{
            $('#no2').onclick=hojaHorometro; $('#si2').onclick=aplicar;
          });
          return;
        }
        aplicar();
      };
  });
}

/* horas del horómetro sin ninguna sesión desde la lectura anterior (0 si hubo sesiones) */
function huecoSinSesiones(t, nuevo){
  const dif = nuevo - t.horometro;
  if(!(dif > 0)) return 0;
  const ult = S.lecturas.filter(l=>l.tractor===t.id).sort((a,b)=>b.fecha-a.fecha)[0];
  const desde = ult ? ult.fecha : (t.fechaAlta || 0);
  if(S.sesion && S.sesion.tractor===t.id) return 0;
  if(S.sesiones.some(s=>s.tractor===t.id && s.fin > desde)) return 0;
  return Math.round(dif*10)/10;
}
function hojaIgualar(t, horas, fin, seguir){
  const ap = apero(S.sel.apero), a = ap && esCompat(ap, t.id) ? ap : null;
  abrirHoja(`<h3>Han pasado ${fmtH(horas)} h sin sesiones</h3>
    <p>¿Qué hiciste? Se apuntan como una sesión para que cuenten los mantenimientos por horas de trabajo.</p>
    <p class="nota" style="margin-top:0">Apero enganchado: ${a ? `${esc(a.nombre)} (${a.tipo==='suspendido'?'suspendido':'arrastrado'})` : 'ninguno'}.</p>
    <button class="opc" data-m="campo"><span class="ico t">${I.campo}</span><span><span class="n">Campo</span><br><span class="s">${a?'Con '+esc(a.nombre):'Sin apero'}</span></span></button>
    <button class="opc" data-m="carretera"><span class="ico a">${I.road}</span><span><span class="n">Carretera</span><br><span class="s">${a?'Con '+esc(a.nombre):'Sin apero'}</span></span></button>
    <button class="opc" data-m="nose"><span class="ico a">?</span><span><span class="n">No lo sé</span><br><span class="s">Solo cuenta lo que vale igual en carretera y en campo</span></span></button>
    <div class="acciones"><button id="no">Ahora no</button></div>`,()=>{
      $('#no').onclick=()=>{ cerrarHoja(); setTimeout(seguir, 80); };
      $('#hoja').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
        /* la sesión acaba justo en la lectura del horómetro, para que la siguiente lectura sepa que después no hubo sesiones */
        const ini = fin - horas*H;
        const tr = {modo:b.dataset.m, tractor:t.id, apero:a?a.id:null, inicio:ini, fin};
        /* las horas se suman enteras, aunque el mantenimiento se haya puesto a cero hace poco: el aviso sale antes, nunca tarde */
        S.mants.forEach(m=>{ if(cuentaEnTramo(m,tr)) m.acum += horas; });
        S.sesiones.push({inicio:ini, fin, tractor:t.id, tramos:[tr], igualada:true});
        guardar(); pintar(); toast(`${fmtH(horas)} h apuntadas`);
        seguir();
      });
  });
}

function hojaRepostar(){
  let prod='gasoil', orig='coop';
  const dibujar = ()=>{
    const t = tractor(S.sel.tractor);
    const dep = prod==='gasoil' && orig==='dep';
    abrirHoja(`<h3>Repostar el ${t.nombre}</h3>
      <div class="seg" id="sp"><button data-v="gasoil" class="${prod==='gasoil'?'sel':''}">Gasoil</button><button data-v="adblue" class="${prod==='adblue'?'sel':''}">AdBlue</button></div>
      ${prod==='gasoil'?`<div class="seg" id="so"><button data-v="coop" class="${orig==='coop'?'sel':''}">Cooperativa</button><button data-v="dep" class="${orig==='dep'?'sel':''}">Depósito</button></div>`:''}
      ${dep ? `<label class="f" for="a">Litros en el tractor antes</label>${campoNumero('a')}<label class="f" for="b">Litros en el tractor después</label>${campoNumero('b')}${t.capDeposito?`<button class="falla" id="lleno" type="button" style="margin-top:8px">Lo he llenado (${fmtH(t.capDeposito)} L)</button>`:''}<p class="nota">El precio se calculará con el precio medio del depósito.</p>`
            : `<label class="f" for="p">Importe total (€)</label>${campoNumero('p',undefined,'step="0.01"')}<label class="f" for="l">Litros</label>${campoNumero('l')}<p class="nota" id="pl" style="min-height:18px"></p>${prod==='gasoil'?`<label class="f" for="an">Litros en el tractor antes (opcional)</label>${campoNumero('an')}<p class="nota" style="margin-top:2px">Sirve para calcular mejor el consumo.</p>`:''}`}
      <div class="err" id="err"></div>
      <div class="acciones"><button id="no">Cancelar</button><button class="ok" id="si">Guardar</button></div>`, ()=>{
        enlazarCamaras();
        if($('#lleno')) $('#lleno').onclick=()=>{ $('#b').value=t.capDeposito; };
        if($('#pl')){
          const precio = ()=>{
            const l=parseFloat($('#l').value), p=parseFloat($('#p').value);
            if(!(l>0) || !(p>0)){ $('#pl').textContent=''; $('#pl').style.color=''; return; }
            const pu = p/l, raro = pu<0.3 || pu>4;
            $('#pl').textContent = `Sale a ${eurL(pu)}${raro?'. Revisa si has cambiado el importe y los litros.':''}`;
            $('#pl').style.color = raro ? 'var(--stop)' : '';
          };
          $('#l').oninput=precio; $('#p').oninput=precio;
        }
        $('#sp').querySelectorAll('button').forEach(b=>b.onclick=()=>{prod=b.dataset.v; dibujar();});
        if($('#so')) $('#so').querySelectorAll('button').forEach(b=>b.onclick=()=>{orig=b.dataset.v; dibujar();});
        $('#no').onclick=()=>cerrarHoja();
        $('#si').onclick=()=>{
          const r = {fecha:Date.now(), producto:prod, origen: prod==='adblue'?'coop':orig, tractor:t.id, apero:S.sel.apero};
          if(dep){
            const a=parseFloat($('#a').value), b=parseFloat($('#b').value);
            if(isNaN(a)||isNaN(b)){ $('#err').textContent='Escribe los litros de antes y de después.'; return; }
            if(b<=a){ $('#err').textContent='Los litros de después deben ser más que los de antes.'; return; }
            r.antes=a; r.despues=b; r.litros=b-a;
          } else {
            const l=parseFloat($('#l').value), p=parseFloat($('#p').value);
            if(isNaN(l)||l<=0){ $('#err').textContent='Escribe los litros.'; return; }
            if(isNaN(p)||p<0){ $('#err').textContent='Escribe el importe.'; return; }
            r.litros=l; r.importe=p;
            if($('#an') && $('#an').value!==''){
              const an=parseFloat($('#an').value);
              if(isNaN(an)||an<0){ $('#err').textContent='Los litros de antes no pueden ser negativos.'; return; }
              r.antes=an; r.despues=an+l;
            }
          }
          S.repostajes.push(r); guardar(); cerrarHoja(); if(seccion==='gasoil') pintar(); toast(`${fmtH(r.litros)} L de ${prod==='gasoil'?'gasoil':'AdBlue'} guardados`);
        };
    });
  };
  dibujar();
}

      </div>

    </div>

      ${relevantes.length ? relevantes.map(({m,e})=>`<div class="av"><span class="dot ${e||'n'}" aria-label="${e==='r'?'Pasado':e==='y'?'Inminente':''}"></span>${marcaM(m)?'<span class="mk" title="Según el manual ya tocaría">M</span>':''}<span>${m.nombre}<br><span style="font-size:13px;color:var(--text2)">${m.maq===t.id?t.nombre:a.nombre}${marcaM(m)?', manual: le tocaría ya':''}</span></span><span class="q">${textoMant(m)}</span></div>`).join('') : (tarjetas ? '' : '<div class="vacio">Todo al día con esta máquina y este apero.</div>')}
    </section>`;
  $('#bt').onclick=hojaTractor; $('#ba').onclick=hojaApero;

  $('#bp').onclick=pausar; $('#bcod').onclick=hojaCodigo;
  $('#bsal').onclick=()=>irA('salir');
